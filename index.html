ے عظیم فضل میں سے مانگتی ہوں، کیونکہ تو قدرت رکھتا ہے اور میں نہیں رکھتی، تو جانتا ہے اور میں نہیں جانتی، اور تو غیب کی باتوں کو خوب جاننے والا ہے۔ اے اللہ! اگر تو جانتا ہے کہ یہ کام میرے لیے میرے دین، میری معاش اور انجامِ کار میں بہتر ہے تو اسے میرے مقدر میں کر دے، میرے لیے آسان کر دے اور اس میں برکت دے۔ اور اگر تو جانتا ہے کہ یہ کام میرے لیے میرے دین، معاش اور انجام میں برا ہے تو اسے مجھ سے پھیر دے اور مجھے اس سے پھیر دے، اور جہاں کہیں خیر ہو وہ میرے مقدر میں کر دے، پھر مجھے اس پر راضی کر دے۔"}},"hadith":[{"id":"h1","n":1,"ar":"اَلصَّوْمُ جُنَّةٌ","ur":"روزہ گناہوں سے بچنے کی ڈھال ہے۔","t":"ڈھال تلوار اور تیر سے بچاتی ہے۔ اسی طرح روزہ انسان کو برے کاموں سے بچاتا ہے۔ روزے دار غصے، جھگڑے اور بری باتوں سے رک جاتا ہے، اور آخرت میں آگ سے بھی بچاؤ ہوتا ہے۔","a":"روزے میں جھوٹ، غیبت اور لڑائی سے بھی روزہ رکھیں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h2","n":2,"ar":"وَالصَّبْرُ ضِيَاءٌ","ur":"صبر روشنی ہے۔","t":"اندھیرے میں روشنی راستہ دکھاتی ہے۔ مشکل کے وقت صبر بھی راستہ دکھاتا ہے، دل کو سکون دیتا ہے اور انسان کو گھبراہٹ میں غلط فیصلے سے بچاتا ہے۔","a":"پریشانی میں شکوہ نہ کریں، «اِنَّا لِلّٰہِ وَاِنَّـاۤ اِلَیْہِ رٰجِعُوْنَ» پڑھیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h3","n":3,"ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ","ur":"بے شک اعمال کی قبولیت کا دار و مدار نیتوں پر ہے۔","t":"کوئی کام اچھا ہو تب بھی اللہ کے ہاں اس کا ثواب نیت کے مطابق ملتا ہے۔ جو کام صرف اللہ کی رضا کے لیے ہو وہ عبادت بن جاتا ہے، اور جو دکھاوے کے لیے ہو اس کا ثواب نہیں رہتا۔","a":"ہر اچھا کام شروع کرتے وقت دل میں کہیں: یہ اللہ کے لیے کر رہی ہوں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h4","n":4,"ar":"اَلصَّلَاةُ مِعْرَاجُ الْمُؤْمِنِ","ur":"نماز مومن کی معراج ہے۔","t":"معراج میں نبی ﷺ کو اللہ کے قریب خاص حاضری ملی۔ بات کا مطلب یہ بیان کیا جاتا ہے کہ نماز میں بندہ اللہ سے سیدھی بات کرتا ہے اور اسے قرب نصیب ہوتا ہے۔","a":"نماز آرام اور دھیان سے پڑھیں، جیسے اللہ سے باتیں کر رہی ہوں۔","src":"مشہور جملہ؛ حدیث کی معتبر کتب میں اس کی پکی سند نہیں ملتی","g":"w","sup":"یہ مفہوم صحیح حدیث سے ثابت ہے: «وَجُعِلَتْ قُرَّةُ عَيْنِي فِي الصَّلَاةِ» (نبی ﷺ نے فرمایا: میری آنکھوں کی ٹھنڈک نماز میں رکھی گئی)، نسائی۔"},{"id":"h5","n":5,"ar":"مَنْ صَمَتَ نَجَا","ur":"جو خاموش رہا وہ نجات پا گیا۔","t":"زبان سے بہت سے گناہ ہوتے ہیں: جھوٹ، غیبت، گالی، چغلی۔ جو شخص فضول اور بری باتوں سے خاموش رہتا ہے وہ ان سب گناہوں سے بچ جاتا ہے۔ اس کا مطلب یہ نہیں کہ اچھی بات بھی نہ کریں؛ مطلب یہ ہے کہ سوچ کر بولیں۔","a":"بولنے سے پہلے سوچیں: کیا یہ بات سچی اور اچھی ہے؟","src":"جامع ترمذی، مسند احمد (بعض محدثین نے سند پر کلام کیا، متعدد سندوں سے معتبر مانا گیا)","g":"h","sup":""},{"id":"h6","n":6,"ar":"اَلْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ","ur":"قرآن تیرے حق میں گواہی دے گا یا تیرے خلاف۔","t":"جو قرآن کو پڑھتی، سمجھتی اور اس پر عمل کرتی ہے، قرآن قیامت کے دن اس کے حق میں گواہی دے گا۔ جو اسے چھوڑ دے اس کے خلاف دلیل بن جائے گا۔","a":"روزانہ تھوڑا قرآن ترجمے کے ساتھ پڑھیں اور اس پر عمل کریں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h7","n":7,"ar":"اَلْمُسْلِمُ أَخُو الْمُسْلِمِ","ur":"مسلمان مسلمان کا بھائی ہے۔","t":"بھائی بھائی ایک دوسرے پر ظلم نہیں کرتے، مصیبت میں ساتھ دیتے ہیں اور ایک دوسرے کی عزت کی حفاظت کرتے ہیں۔ مسلمانوں کا آپس کا رشتہ ایمان کا رشتہ ہے۔","a":"سہیلیوں اور ہم جماعتوں کی مدد کریں، کسی کو تنگ نہ کریں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h8","n":8,"ar":"اَلْكَاسِبُ حَبِيبُ اللَّهِ","ur":"محنت کرنے والا اللہ کا دوست ہے۔","t":"حلال کمانے کے لیے محنت کرنا بہت اچھا کام ہے۔ جو اپنے ہاتھ کی محنت سے روزی کماتا ہے وہ کسی کے آگے ہاتھ نہیں پھیلاتا۔","a":"حلال کمائی کی قدر کریں اور گھر کے کام میں ہاتھ بٹائیں۔","src":"مشہور جملہ؛ سند پر محدثین نے کلام کیا ہے","g":"w","sup":"یہ مفہوم صحیح بخاری کی حدیث سے ثابت ہے: «اپنے ہاتھ کی کمائی سے بہتر کھانا کسی نے نہیں کھایا، اور اللہ کے نبی داؤد علیہ السلام اپنے ہاتھ سے کما کر کھاتے تھے۔»"},{"id":"h9","n":9,"ar":"اَلْبِرُّ حُسْنُ الْخُلُقِ","ur":"نیکی اچھے اخلاق کا نام ہے۔","t":"نیکی صرف نماز روزے کا نام نہیں۔ اچھی بات کرنا، نرمی سے پیش آنا، سچ بولنا اور دوسروں کا خیال رکھنا بھی نیکی ہے۔ اچھا اخلاق دین کا بہت بڑا حصہ ہے۔","a":"سلام کریں، مسکرا کر ملیں، شکریہ اور معاف کیجیے کہنا سیکھیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h10","n":10,"ar":"أَكْمَلُ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا","ur":"کامل مومن وہ ہے جس کا اخلاق اچھا ہو۔","t":"ایمان صرف زبان کا دعویٰ نہیں، کردار میں بھی نظر آتا ہے۔ جس کا اخلاق جتنا اچھا ہوتا ہے اس کا ایمان اتنا ہی مکمل سمجھا جاتا ہے۔","a":"گھر والوں اور چھوٹوں کے ساتھ خاص طور پر نرمی رکھیں۔","src":"سنن ابوداؤد، جامع ترمذی (حسن صحیح)","g":"h","sup":""},{"id":"h11","n":11,"ar":"خَيْرُ النَّاسِ مَنْ يَنْفَعُ النَّاسَ","ur":"لوگوں میں اچھا وہ ہے جو دوسروں کو نفع پہنچائے۔","t":"سب سے اچھا انسان وہ ہے جس سے دوسروں کو فائدہ پہنچے: علم سکھائے، مدد کرے، خوشی دے۔ جس سے لوگ تنگ ہوں وہ اچھا نہیں۔","a":"روزانہ کسی ایک کی مدد کرنے کی نیت کریں۔","src":"معجم اوسط طبرانی (بعض محدثین نے متعدد سندوں کی وجہ سے حسن کہا)","g":"h","sup":""},{"id":"h12","n":12,"ar":"اَلْحَيَاءُ لَا يَأْتِي إِلَّا بِخَيْرٍ","ur":"حیاء بہتری ہی لاتی ہے۔","t":"حیاء وہ احساس ہے جو انسان کو برے کام اور بری بات سے روکتا ہے۔ حیاء والا شخص گناہ سے بھی بچتا ہے اور لوگوں کے ساتھ بھی بھلائی سے پیش آتا ہے۔","a":"لباس، نظر اور بات چیت میں حیاء کا خیال رکھیں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h13","n":13,"ar":"سِبَابُ الْمُسْلِمِ فُسُوقٌ","ur":"مسلمان کو گالی دینا گناہ ہے۔","t":"کسی مسلمان کو گالی دینا یا برے نام سے پکارنا اللہ کی نافرمانی ہے۔ زبان سے دوسروں کو تکلیف دینا بھی ایک بڑا گناہ ہے۔","a":"کسی کو برے نام یا مذاق اڑانے والے نام سے نہ پکاریں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h14","n":14,"ar":"لَا يَكُونُ الْمُؤْمِنُ لَعَّانًا","ur":"مومن لعنت کرنے والا نہیں ہوتا۔","t":"لعنت کا مطلب ہے کسی کو اللہ کی رحمت سے دور ہونے کی بددعا دینا۔ مومن کی زبان پر دعا اور اچھے الفاظ ہونے چاہییں، بددعا اور لعنت نہیں۔","a":"غصے میں بھی کسی کو لعنت یا بددعا نہ دیں۔","src":"جامع ترمذی، صحیح مسلم (الفاظ میں معمولی فرق کے ساتھ)","g":"h","sup":""},{"id":"h15","n":15,"ar":"لَا يَدْخُلُ الْجَنَّةَ نَمَّامٌ","ur":"چغل خور جنت میں داخل نہیں ہوگا۔","t":"چغلی یہ ہے کہ ایک کی بات دوسرے تک اس لیے پہنچائی جائے کہ ان میں لڑائی ہو جائے۔ یہ بہت بڑا گناہ ہے، اور توبہ کیے بغیر اس پر سخت وعید آئی ہے۔","a":"کسی کی بات دوسرے کو لگا کر لڑائی نہ ڈالیں، صلح کرائیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h16","n":16,"ar":"اَلْمُؤْمِنُ مِرْآةُ الْمُؤْمِنِ","ur":"مومن مومن کا آئینہ ہے۔","t":"آئینہ چہرے کا داغ دکھا دیتا ہے مگر کسی کو بتاتا نہیں۔ اسی طرح اچھا مسلمان دوسرے کی غلطی اکیلے میں نرمی سے بتاتا ہے اور سب کے سامنے شرمندہ نہیں کرتا۔","a":"سہیلی کی غلطی اکیلے میں پیار سے بتائیں۔","src":"سنن ابوداؤد (حسن)","g":"h","sup":""},{"id":"h17","n":17,"ar":"اَلدُّعَاءُ مُخُّ الْعِبَادَةِ","ur":"دعا عبادت کا مغز ہے۔","t":"مغز کسی چیز کا اصل حصہ ہوتا ہے۔ دعا مانگنے کا مطلب ہے کہ ہم اللہ کے محتاج ہیں اور وہی دینے والا ہے۔ یہی عبادت کی اصل روح ہے۔","a":"ہر چھوٹی بڑی ضرورت اللہ سے مانگیں۔","src":"جامع ترمذی (سند پر محدثین نے کلام کیا ہے)","g":"w","sup":"اسی مفہوم کی صحیح حدیث: «اَلدُّعَاءُ هُوَ الْعِبَادَةُ» (دعا ہی عبادت ہے)، ترمذی، ابوداؤد۔"},{"id":"h18","n":18,"ar":"اَلطُّهُورُ شَطْرُ الْإِيمَانِ","ur":"صفائی نصف ایمان ہے۔","t":"اسلام میں پاکی اور صفائی بہت ضروری ہے: وضو، غسل، لباس اور گھر کی صفائی۔ اللہ پاک صاف رہنے والوں کو پسند کرتا ہے۔","a":"روزانہ جسم، کپڑوں اور اپنی جگہ کو صاف رکھیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h19","n":19,"ar":"اِتَّقِ اللَّهَ حَيْثُمَا كُنْتَ","ur":"تو جہاں کہیں بھی ہو اللہ سے ڈر۔","t":"اللہ ہر جگہ دیکھ رہا ہے، اکیلے ہوں یا لوگوں میں۔ اس لیے ہر جگہ گناہ سے بچنا چاہیے، چاہے کوئی دیکھ نہ رہا ہو۔","a":"جب اکیلی ہوں تب بھی وہی کام کریں جو سب کے سامنے کرتی ہیں۔","src":"جامع ترمذی (حسن)","g":"h","sup":""},{"id":"h20","n":20,"ar":"اَلصَّلَاةُ عِمَادُ الدِّينِ","ur":"نماز دین کا ستون ہے۔","t":"ستون کے بغیر چھت کھڑی نہیں رہتی۔ اسی طرح نماز کے بغیر دین مضبوط نہیں رہتا۔ نماز ہر مسلمان پر روزانہ پانچ وقت فرض ہے۔","a":"پانچوں نمازیں وقت پر پڑھنے کی کوشش کریں۔","src":"مشہور جملہ؛ حدیث کی معتبر کتب میں اس کی پکی سند نہیں ملتی","g":"w","sup":"نماز کی اہمیت صحیح حدیث سے ثابت ہے: «بندے اور کفر کے درمیان نماز چھوڑ دینا ہے» (صحیح مسلم)، اور حدیثِ جبریل میں نماز اسلام کے ارکان میں ہے (بخاری، مسلم)۔"},{"id":"h21","n":21,"ar":"إِنَّمَا أَنَا قَاسِمٌ وَاللَّهُ يُعْطِي","ur":"میں تقسیم کرنے والا ہوں اور اللہ عطا کرتا ہے۔","t":"نبی ﷺ کا فرمانا ہے کہ دینے والا حقیقت میں اللہ ہے، میں تو اللہ کا دیا ہوا مال لوگوں میں بانٹتا ہوں۔ اس سے ہم سیکھتے ہیں کہ ہر نعمت اللہ کی طرف سے ہے۔","a":"ہر نعمت پر «الحمد للہ» کہیں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h22","n":22,"ar":"إِنَّمَا بُعِثْتُ مُعَلِّمًا","ur":"بے شک مجھے استاد بنا کر بھیجا گیا ہے۔","t":"نبی ﷺ لوگوں کو سکھانے والے بن کر آئے۔ آپ ﷺ نے علم اور اچھی باتیں نرمی اور محبت سے سکھائیں۔ استاد کا ادب اور علم سیکھنا اسی لیے ضروری ہے۔","a":"استاد کا ادب کریں اور سیکھی ہوئی بات دوسروں کو بھی بتائیں۔","src":"سنن ابن ماجہ (سند پر محدثین نے کلام کیا ہے)","g":"w","sup":"اسی مفہوم کی صحیح حدیث: «اللہ نے مجھے سختی کرنے والا بنا کر نہیں بھیجا بلکہ سکھانے والا اور آسانی کرنے والا بنا کر بھیجا» (صحیح مسلم)۔"},{"id":"h23","n":23,"ar":"اَلرَّاشِي وَالْمُرْتَشِي كِلَاهُمَا فِي النَّارِ","ur":"رشوت دینے والا اور رشوت لینے والا دونوں جہنمی ہیں۔","t":"رشوت یہ ہے کہ کسی کا حق مارنے یا ناجائز کام کرانے کے لیے پیسے یا تحفہ دیا جائے۔ دینے والا اور لینے والا دونوں گناہ گار ہیں۔","a":"ہمیشہ جائز طریقے سے کام کروائیں اور رشوت سے دور رہیں۔","src":"مشہور جملہ؛ ان الفاظ کی سند پر کلام ہے","g":"w","sup":"صحیح حدیث: «اللہ نے رشوت دینے والے اور رشوت لینے والے پر لعنت کی» (سنن ابوداؤد، جامع ترمذی)۔"},{"id":"h24","n":24,"ar":"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ","ur":"تم میں بہتر وہ شخص ہے جو قرآن سیکھے اور سکھائے۔","t":"قرآن سیکھنا اور دوسروں کو سکھانا سب سے بہترین کاموں میں سے ہے۔ ایسی سیکھنے سکھانے والی مائیں، بہنیں اور استانیاں بہت خوش نصیب ہیں۔","a":"قرآن خود پڑھیں اور چھوٹے بہن بھائیوں کو بھی سکھائیں۔","src":"صحیح بخاری","g":"s","sup":""},{"id":"h25","n":25,"ar":"حُبُّ الدُّنْيَا رَأْسُ كُلِّ خَطِيئَةٍ","ur":"دنیا کی محبت ہر خطا کی جڑ ہے۔","t":"جب دنیا کی چیزوں سے حد سے زیادہ محبت ہو جائے تو انسان انھیں پانے کے لیے جھوٹ، لالچ اور ناجائز کام کرنے لگتا ہے۔ ضرورت کے مطابق دنیا ٹھیک ہے مگر دل کو اس کا غلام نہ بنائیں۔","a":"چیزوں کے پیچھے نہ بھاگیں، جو اللہ نے دیا اس پر شکر کریں۔","src":"یہ بزرگوں (حسن بصری رحمہ اللہ) کا قول مشہور ہے، نبی ﷺ کی مرفوع حدیث کے طور پر سند کمزور ہے","g":"w","sup":"دنیا کی محبت کے بارے میں قرآن (سورۃ آلِ عمران، آیت ۱۴) اور صحیح حدیث «کُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ» (صحیح بخاری) سے رہنمائی ملتی ہے۔"},{"id":"h26","n":26,"ar":"اَلدَّالُّ عَلَى الْخَيْرِ كَفَاعِلِهِ","ur":"نیکی کی راہ دکھانے والا نیکی کرنے والے کی طرح ہے۔","t":"اگر آپ کسی کو اچھے کام کی طرف بلائیں یا بتائیں تو جب وہ کرے گا آپ کو بھی ویسا ہی ثواب ملے گا، اور اس کے ثواب میں کمی بھی نہیں ہوگی۔","a":"کسی کو نماز، قرآن یا اچھی بات کی طرف بلائیں۔","src":"جامع ترمذی، صحیح مسلم (مفہوم)","g":"h","sup":""},{"id":"h27","n":27,"ar":"اَلتَّائِبُ مِنَ الذَّنْبِ كَمَنْ لَا ذَنْبَ لَهُ","ur":"گناہ سے توبہ کرنے والا ایسا ہے جیسے اس نے گناہ کیا ہی نہ ہو۔","t":"اللہ بہت معاف کرنے والا ہے۔ جب بندہ سچے دل سے توبہ کرے، شرمندہ ہو اور دوبارہ نہ کرنے کا ارادہ کرے تو اللہ اس کا گناہ معاف کر دیتا ہے۔","a":"غلطی ہو جائے تو فوراً «استغفر اللہ» کہیں اور توبہ کریں۔","src":"سنن ابن ماجہ (متعدد سندوں کی وجہ سے حسن)","g":"h","sup":""},{"id":"h28","n":28,"ar":"إِنَّ الصَّدَقَةَ لَتُطْفِئُ غَضَبَ الرَّبِّ","ur":"بے شک صدقہ اللہ تعالیٰ کے غصے کو ٹھنڈا کرتا ہے۔","t":"صدقہ دینے سے اللہ ناراضی ختم کر دیتا ہے اور بلاؤں کو ٹال دیتا ہے۔ چھوٹا سا صدقہ بھی اللہ کے ہاں بہت قیمتی ہے۔","a":"روزانہ تھوڑا سا صدقہ ضرور دیں، چاہے ایک روپیہ ہی ہو۔","src":"جامع ترمذی (حسن غریب)","g":"h","sup":""},{"id":"h29","n":29,"ar":"إِنَّ اللَّهَ جَمِيلٌ يُحِبُّ الْجَمَالَ","ur":"اللہ تعالیٰ خوبصورت ہے، خوبصورتی کو پسند کرتا ہے۔","t":"اللہ کو صفائی، اچھا لباس، سلیقہ اور اچھے اخلاق پسند ہیں۔ اس میں غرور نہیں ہونا چاہیے۔ سادہ اور صاف ستھرا رہنا بھی خوبصورتی ہے۔","a":"صاف ستھرے اور باحیاء لباس میں رہیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h30","n":30,"ar":"أَوَّلُ مَا يُحَاسَبُ بِهِ الْعَبْدُ الصَّلَاةُ","ur":"بندے سے سب سے پہلے نماز کا حساب لیا جائے گا۔","t":"قیامت کے دن پہلا سوال نماز کا ہوگا۔ اگر نماز ٹھیک نکلی تو باقی اعمال بھی آسان ہو جائیں گے۔ اس لیے نماز کو سب سے زیادہ اہمیت دینی چاہیے۔","a":"نماز کبھی قضا نہ کریں اور گھر کی چھوٹی بچیوں کو بھی ساتھ پڑھائیں۔","src":"جامع ترمذی، سنن نسائی، سنن ابوداؤد (صحیح)","g":"s","sup":""},{"id":"h31","n":31,"ar":"اَلصِّدْقُ يُنْجِي وَالْكَذِبُ يُهْلِكُ","ur":"سچ نجات دیتا ہے اور جھوٹ ہلاک کرتا ہے۔","t":"سچ بولنے والا پریشانیوں اور گناہوں سے بچ جاتا ہے، لوگ اس پر بھروسا کرتے ہیں۔ جھوٹ بولنے والا ایک جھوٹ چھپانے کے لیے کئی جھوٹ بولتا ہے اور آخر پھنس جاتا ہے۔","a":"نقصان ہو تب بھی سچ بولیں۔","src":"مشہور جملہ؛ ان الفاظ کی سند کمزور ہے","g":"w","sup":"صحیح حدیث: «سچائی نیکی کی طرف لے جاتی ہے اور نیکی جنت کی طرف، اور جھوٹ گناہ کی طرف لے جاتا ہے» (صحیح بخاری، صحیح مسلم)۔"},{"id":"h32","n":32,"ar":"رَأْسُ الْحِكْمَةِ مَخَافَةُ اللَّهِ","ur":"دانائی کی بنیاد خوفِ خدا ہے۔","t":"اصل عقلمند وہ ہے جو اللہ سے ڈر کر گناہوں سے بچتا ہے، کیونکہ اسے معلوم ہے کہ سب کچھ اللہ کے سامنے پیش ہونا ہے۔","a":"کوئی کام کرنے سے پہلے سوچیں کہ اللہ اس سے راضی ہوگا یا نہیں۔","src":"مشہور جملہ؛ حدیث کے طور پر سند کمزور ہے","g":"w","sup":"قرآن میں ہے: «اللہ سے اس کے بندوں میں سے علم والے ہی ڈرتے ہیں» (سورۃ فاطر، آیت ۲۸)۔"},{"id":"h33","n":33,"ar":"اَلْمَجَالِسُ بِالْأَمَانَةِ","ur":"مجلس کی بات امانت ہوتی ہے۔","t":"جو بات کسی مجلس یا دوستوں میں ہو، اسے باہر لوگوں میں پھیلانا درست نہیں۔ کسی کا راز بتانا امانت میں خیانت ہے۔","a":"سہیلی کا راز دوسروں کو نہ بتائیں۔","src":"سنن ابوداؤد، جامع ترمذی (حسن)","g":"h","sup":""},{"id":"h34","n":34,"ar":"اَلدِّينُ النَّصِيحَةُ","ur":"دین خیرخواہی کا نام ہے۔","t":"نصیحت کا مطلب ہے خلوص سے بھلائی چاہنا: اللہ، اس کے رسول، کتاب، حکمرانوں اور سب مسلمانوں کے ساتھ۔ دین میں خیرخواہی اور سچائی سب سے اہم ہے۔","a":"کسی کو غلطی پر نرمی اور محبت سے سمجھائیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h35","n":35,"ar":"يَدُ اللَّهِ عَلَى الْجَمَاعَةِ","ur":"اللہ تعالیٰ کا ہاتھ جماعت پر ہے۔","t":"جو مسلمان مل جل کر اتفاق سے رہتے ہیں اللہ کی مدد ان کے ساتھ ہوتی ہے۔ اختلاف اور فرقہ     A.busy = true; render();
    window.claude.use('artifact').then(function (art) {
      if (!art) throw { code: 'not_granted' };
      try { sessionStorage.setItem('hy:pub', '1'); } catch (e) { /* ignore */ }
      return art.publish(buildDoc());
    }).catch(function (e) {
      try { sessionStorage.removeItem('hy:pub'); } catch (x) { /* ignore */ }
      A.busy = false;
      var c = e && e.code;
      toast(c === 'conflict' ? 'کسی اور نے صفحہ تبدیل کر دیا ہے۔ صفحہ دوبارہ لوڈ ہو رہا ہے، پھر تبدیلی دہرائیں۔' :
        (c === 'not_writer' || c === 'not_granted') ? 'آپ کے پاس اس صفحے میں ترمیم کا اختیار نہیں۔' :
        c === 'too_large' ? 'مواد بہت بڑا ہو گیا ہے۔' : 'شائع نہیں ہو سکا۔ کچھ دیر بعد دوبارہ کوشش کریں۔');
      render();
    });
  }

  /* ---------- boot ---------- */
  var BUILTIN_STORIES = (D.stories || []).slice();
  function loadContent() {
    if (document.getElementById('hy-q') || location.protocol === 'file:') return Promise.resolve();
    var timeout = new Promise(function (res) { setTimeout(function () { res(null); }, 3000); });
    var req = fetch('content.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    return Promise.race([req, timeout]).then(function (j) {
      if (!j || typeof j !== 'object') return;
      ['lectures', 'stories', 'articles', 'quizzes', 'sections'].forEach(function (k) { if (Array.isArray(j[k])) D[k] = j[k]; });
      D.removed = Array.isArray(j.removed) ? j.removed : [];
      var have = {}; D.stories.forEach(function (x) { have[x.id] = 1; });
      var rem = {}; D.removed.forEach(function (x) { rem[x] = 1; });
      var add = BUILTIN_STORIES.filter(function (x) { return !have[x.id] && !rem[x.id]; });
      if (add.length) {
        var order = {}; BUILTIN_STORIES.forEach(function (x, i) { order[x.id] = i; });
        var merged = D.stories.concat(add);
        var known = merged.filter(function (x) { return order[x.id] != null; }).sort(function (a, b) { return order[a.id] - order[b.id]; });
        var extra = merged.filter(function (x) { return order[x.id] == null; });
        D.stories = known.concat(extra);
      }
      if (j.site && typeof j.site === 'object') D.site = j.site;
      if (j.custom && typeof j.custom === 'object') D.custom = j.custom;
      if (j.auth && j.auth.hash && j.auth.salt) D.auth = j.auth;
    });
  }
  buildShell();
  applyTheme();
  if (STATIC) {
    dlApi = {
      save: function (o) {
        return new Promise(function (res, rej) {
          try {
            var u = URL.createObjectURL(o.data);
            var a = h('a', { href: u, download: o.filename });
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(u); }, 4000); res();
          } catch (e) { rej({ code: 'unavailable' }); }
        });
      }
    };
    assetsApi = {
      upload: function (file) {
        if (!ghReady()) return Promise.reject({ code: 'gh_setup' });
        if (file.size > 25 * 1024 * 1024) return Promise.reject({ code: 'too_large' });
        return fileToB64(file).then(function (b64) {
          var name = 'media/' + Date.now().toString(36) + '-' + file.name.replace(/[^A-Za-z0-9._-]/g, '_');
          return ghPut(name, b64, 'Upload ' + file.name).then(function () { return { id: name }; });
        });
      }
    };
    A.tab = 'records';
    viewEl.appendChild(h('div', { class: 'wrap' }, h('p', { class: 'note', style: 'margin-top:30px' }, 'لوڈ ہو رہا ہے…')));
    loadContent().then(function () { render(); flushRecs(); }, render);
  } else {
    render();
    window.claude.use('user').then(function (u) { return u ? u.canEdit() : false; }).then(function (ok) {
      canEdit = !!ok;
      if (!canEdit) return null;
      return Promise.all([window.claude.use('assets').catch(function () { return null; }), window.claude.use('downloads').catch(function () { return null; })]);
    }).then(function (r) { if (r) { assetsApi = r[0] || null; dlApi = r[1] || null; } render(); }).catch(function () { render(); });
  }
})();
</script>
