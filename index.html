ٰرُ خَٰلِدِينَ فِيهَآ أَبَدًا ذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ ﴾\n(سورۃ التوبہ، آیت ۱۰۰)\n\nمفہوم: مہاجرین اور انصار میں سے سبقت لے جانے والے پہلے لوگ، اور وہ جنہوں نے نیکی کے ساتھ ان کی پیروی کی، اللہ ان سے راضی ہوا اور وہ اللہ سے راضی ہوئے۔\n\nبیعتِ رضوان کے موقع پر بھی اللہ نے ان سے اپنی رضا کا اعلان فرمایا (الفتح ۱۸)۔ نبی ﷺ نے فرمایا: \"میرے صحابہ کو برا نہ کہو۔ اگر تم میں سے کوئی احد پہاڑ کے برابر سونا بھی خرچ کر دے تو ان کے ایک مد (مٹھی بھر) یا آدھے مد کے برابر بھی نہیں پہنچ سکتا\" (صحیح بخاری و مسلم)۔\n\nاہلِ سنت والجماعت کا عقیدہ یہ ہے: (۱) تمام صحابہؓ سے محبت اور ان کا ادب کیا جائے۔ (۲) سب سے افضل ترتیب یوں ہے: حضرت ابوبکرؓ، پھر حضرت عمرؓ، پھر حضرت عثمانؓ، پھر حضرت علیؓ۔ (۳) صحابہ کے آپس کے اختلافات کے بارے میں زبان بند رکھی جائے، ان پر تنقید یا طعن سے بچا جائے اور سب کے لیے خیر کی دعا کی جائے۔\n\nعملی بات: صحابہ و صحابیات کی سیرت پڑھنا اور بچوں کو ان کے واقعات سنانا ایمان کو تازہ کرتا ہے۔ ہماری ویب سائٹ کے \"واقعات\" سیکشن میں صحابہ کرامؓ کے واقعات موجود ہیں۔"},{"id":"a-ahle-sunnat","v":2,"title":"اہلِ سنت والجماعت کون ہیں؟","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اہلِ سنت والجماعت وہ لوگ ہیں جو اللہ کی کتاب، رسول ﷺ کی سنت اور صحابہ کرامؓ کے طریقے پر چلتے ہیں۔ نبی ﷺ نے پیش گوئی فرمائی کہ امت کئی گروہوں میں بٹ جائے گی، اور نجات پانے والی جماعت کی پہچان یہ بتائی: \"جو اس طریقے پر ہو جس پر میں اور میرے صحابہ ہیں\" (جامع ترمذی)۔\n\n﴿ وَٱعْتَصِمُوا۟ بِحَبْلِ ٱللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا۟ وَٱذْكُرُوا۟ نِعْمَتَ ٱللَّهِ عَلَيْكُمْ إِذْ كُنتُمْ أَعْدَآءً فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُم بِنِعْمَتِهِۦٓ إِخْوَٰنًا وَكُنتُمْ عَلَىٰ شَفَا حُفْرَةٍ مِّنَ ٱلنَّارِ فَأَنقَذَكُم مِّنْهَا كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَهْتَدُونَ ﴾\n(سورۃ آل عمران، آیت ۱۰۳)\n\nمفہوم: اللہ کی رسی کو سب مل کر مضبوطی سے تھام لو اور آپس میں تفرقہ نہ ڈالو۔\n\nاہلِ سنت والجماعت کی بنیادی پہچان یہ ہے: (۱) عقائد میں قرآن، سنت اور صحابہ کے طریقے کی پیروی، جن کی ترجمانی امام ابوالحسن اشعریؒ اور امام ابو منصور ماتریدیؒ نے کی۔ (۲) عملی مسائل میں ائمہ مجتہدین (امام ابوحنیفہؒ، امام مالکؒ، امام شافعیؒ، امام احمدؒ) میں سے کسی ایک کی فقہ کی پیروی۔ (۳) تزکیۂ نفس اور اصلاحِ باطن کے لیے اہلِ اللہ کی صحبت، شریعت کے دائرے میں۔\n\nعلمائے دیوبند اپنے آپ کو اسی اہلِ سنت والجماعت کا حصہ سمجھتے ہیں۔ دارالعلوم دیوبند کی بنیاد 1866ء میں مولانا محمد قاسم نانوتویؒ اور ان کے رفقاء نے رکھی۔ ان کا طریقہ عقائد میں اشعری و ماتریدی، فقہ میں عموماً حنفی، اور تزکیہ میں صوفیائے کرام کے مستند سلسلوں پر رہا ہے۔\n\nاپنے مسلک پر ثابت قدم رہتے ہوئے دوسرے مسلمانوں کے ساتھ نرمی، ادب اور اتحاد کا رویہ رکھنا بھی اہلِ سنت کی تعلیم ہے۔ اختلافی مسائل میں زبان اور رویے کو قابو میں رکھیں اور اپنے مستند علماء سے رہنمائی لیں۔\n\nمزید تفصیل: ایک اعتراض اور جواب۔ اعتراض: \"اسلام میں مسلک بندی کیوں؟ سب مسلمان ہیں۔\" جواب: بلا شبہ سب مسلمان ہیں اور ہمیں سب کے ساتھ ایک امت کے طور پر رہنا چاہیے۔ مسلک کا مطلب نیا دین نہیں بلکہ قرآن و سنت کو سمجھنے کا ایک مستند علمی طریقہ ہے، جو صحابہؓ و تابعینؒ سے چلا آ رہا ہے۔ مسلک کا اختلاف فروعی اور علمی ہے، اس کو نفرت کا ذریعہ بنانا غلط ہے۔ قرآن کا حکم ہے: ﴿ إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا۟ بَيْنَ أَخَوَيْكُمْ ﴾ (الحجرات ۱۰)، یعنی مومن آپس میں بھائی ہیں۔\n\nاہلِ سنت والجماعت کی ایک بڑی پہچان \"اعتدال\" ہے: نہ افراط نہ تفریط۔ نہ صحابہ کو برا کہنا، نہ اہلِ بیت کی توہین؛ نہ تقدیر کا انکار نہ ہاتھ باندھ کر بیٹھنا؛ نہ ہر گناہ پر کفر کا فتویٰ نہ گناہ کو معمولی سمجھنا۔"},{"id":"a-aimma-fiqh","v":2,"title":"ائمہ مجتہدین اور فقہ کی ضرورت","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"قرآن و حدیث میں اصول اور احکام بیان ہوئے ہیں، لیکن ہر نئے مسئلے میں ان سے حکم نکالنے کے لیے گہرے علم، عربی زبان، حدیث اور اصولِ فقہ کی مہارت چاہیے۔ یہی کام ائمہ مجتہدین نے کیا۔\n\n﴿ وَمَآ أَرْسَلْنَا مِن قَبْلِكَ إِلَّا رِجَالًا نُّوحِىٓ إِلَيْهِمْ فَسْـَٔلُوٓا۟ أَهْلَ ٱلذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ ﴾\n(سورۃ النحل، آیت ۴۳)\n\nمفہوم: اگر تم نہیں جانتے تو اہلِ علم سے پوچھ لو۔ اور دوسری جگہ فرمایا کہ ہر گروہ میں سے کچھ لوگ دین میں سمجھ حاصل کرنے کے لیے نکلیں (التوبہ ۱۲۲)۔ نبی ﷺ نے فرمایا: \"اللہ جس کے ساتھ بھلائی کا ارادہ کرتا ہے اسے دین کی سمجھ عطا کرتا ہے\" (صحیح بخاری و مسلم)۔\n\nچار مشہور ائمہ مجتہدین ہیں: امام ابوحنیفہؒ، امام مالکؒ، امام شافعیؒ اور امام احمد بن حنبلؒ۔ ان سب کا مقصد قرآن و سنت کو سمجھنا تھا، اور چاروں مسلک حق پر ہیں۔ جو شخص خود اجتہاد کی صلاحیت نہیں رکھتا وہ کسی ایک امام کے فقہی مذہب کی پیروی کرتا ہے، اسی کو \"تقلید\" کہتے ہیں۔ یہ بالکل ایسا ہے جیسے عام آدمی بیماری میں ڈاکٹر سے اور قانونی مسئلے میں وکیل سے رجوع کرتا ہے۔\n\nبرصغیر میں اکثریت اور علمائے دیوبند فقہ حنفی کی پیروی کرتے ہیں۔ دوسرے ائمہ کے مسلک کا بھی ادب کیا جاتا ہے، اور ان کے اختلاف کو \"اختلافِ رائے برائے سہولت\" سمجھا جاتا ہے، جھگڑے کا ذریعہ نہیں بنایا جاتا۔\n\nعملی بات: اپنے مسائل کسی مستند عالم یا دارالافتاء سے پوچھیں، اور انٹرنیٹ سے بغیر تحقیق کے فتوے لے کر آپس میں بحث نہ کریں۔"},{"id":"a-sunnat-bidat","v":2,"title":"سنت کی پیروی اور بدعت سے بچاؤ","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اللہ سے محبت کا دعویٰ اسی وقت سچا ہے جب نبی ﷺ کی پیروی کی جائے۔\n\n﴿ قُلْ إِن كُنتُمْ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِى يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَٱللَّهُ غَفُورٌ رَّحِيمٌ ﴾\n(سورۃ آل عمران، آیت ۳۱)\n\nمفہوم: کہہ دیجیے کہ اگر تم اللہ سے محبت کرتے ہو تو میری پیروی کرو، اللہ تم سے محبت کرے گا اور تمہارے گناہ معاف کرے گا۔ اور فرمایا: ﴿ وَمَآ ءَاتَىٰكُمُ ٱلرَّسُولُ فَخُذُوهُ وَمَا نَهَىٰكُمْ عَنْهُ فَٱنتَهُوا۟ ﴾ (الحشر ۷)۔\n\nنبی ﷺ نے فرمایا: \"جس نے ہمارے اس دین میں کوئی نئی چیز نکالی جو اس میں سے نہیں ہے، وہ مردود ہے\" (صحیح بخاری و مسلم)۔ اور فرمایا: \"تم میری سنت اور ہدایت یافتہ خلفائے راشدین کی سنت کو لازم پکڑو\" (سنن ابوداؤد، جامع ترمذی)۔\n\nبدعت اس کام کو کہتے ہیں جسے دین اور ثواب کا کام سمجھ کر کیا جائے، حالانکہ قرآن، سنت یا صحابہ کے طریقے میں اس کی کوئی اصل نہ ہو۔ دنیاوی ایجادات (جیسے نئی سواریاں یا دین سکھانے کے نئے انتظامات) بدعت میں شامل نہیں، کیونکہ ان کا مقصد دین میں اضافہ نہیں۔\n\nاپنے عمل کو سنت کے مطابق بنانے کے لیے ہر نئے کام سے پہلے دیکھیں کہ کیا یہ نبی ﷺ اور صحابہؓ کے طریقے سے ثابت ہے۔ اگر شک ہو تو کسی معتبر عالم سے پوچھ لیں۔\n\nسنت کی پیروی کے ساتھ لوگوں سے نرمی اور حکمت کا رویہ رکھیں۔ کسی کو سخت لہجے میں ٹوکنے کے بجائے محبت سے سمجھانا خود نبی ﷺ کی سنت ہے۔\n\nمزید تفصیل: ایک اعتراض اور اس کا جواب۔ سوال: \"نبی ﷺ نے فرمایا کہ جو اسلام میں اچھا طریقہ نکالے اسے اس کا اجر ملے گا (صحیح مسلم)، تو کیا نئی نیکیاں نکالنا جائز نہیں؟\" جواب: یہ حدیث ایک خاص موقع پر ہے جب ایک صحابی ایسی صدقہ کی چیز لائے جس سے دوسرے بھی صدقہ دینے پر آمادہ ہو گئے۔ مطلب یہ ہے کہ جو شخص کسی ثابت شدہ نیکی کو زندہ کرے یا اس کی طرف لوگوں کو بلائے اسے اس کا اجر ملے گا۔ اس کا مطلب یہ نہیں کہ کوئی عبادت اپنی طرف سے گھڑ لی جائے، کیونکہ اسی نبی ﷺ نے یہ بھی فرمایا ہے کہ دین میں نئی چیز نکالنا مردود ہے۔ اس حدیث کو دوسری احادیث کے ساتھ ملا کر سمجھنا چاہیے۔\n\nدوسرا سوال: \"کیا نئی ایجادات اور وسائل بھی بدعت ہیں؟\" جواب: نہیں، جیسے مدارس اور کتابوں کی طباعت، قرآن کے رکوع و پارے اور اعراب، یہ سب دین سکھانے کے وسائل ہیں، اور ان کی اصل شریعت کے عمومی اصولوں میں موجود ہے۔ بدعت اس چیز کو کہتے ہیں جو عبادت کے طور پر نئی گھڑی جائے۔ البتہ کون سی چیز بدعت ہے اور کون سی نہیں، اس کا فیصلہ مستند علماء کریں، عام لوگ آپس میں ایک دوسرے کو بدعتی کہنے سے بچیں۔"},{"id":"a-tazkiya","v":2,"title":"تزکیۂ نفس اور اہلِ اللہ کی صحبت","cat":"تزکیہ","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"قرآن نے کامیابی کا راز بیان کیا ہے:\n\n﴿ قَدْ أَفْلَحَ مَن زَكَّىٰهَا وَقَدْ خَابَ مَن دَسَّىٰهَا ﴾\n(سورۃ الشمس، آیات ۹ تا ۱۰)\n\nمفہوم: جس نے اپنے نفس کو پاک کیا وہ کامیاب ہوا، اور جس نے اسے مٹی میں دبا دیا وہ ناکام ہوا۔ تزکیہ کا مطلب ہے دل کو تکبر، حسد، ریاکاری، کینہ اور دنیا کی حد سے زیادہ محبت جیسی بیماریوں سے پاک کرنا، اور اس میں اخلاص، صبر، شکر اور اللہ کی محبت پیدا کرنا۔\n\nنبی ﷺ نے فرمایا: \"جسم میں گوشت کا ایک ٹکڑا ہے، جب وہ درست ہو جائے تو سارا جسم درست ہو جاتا ہے اور جب وہ بگڑ جائے تو سارا جسم بگڑ جاتا ہے، سنو! وہ دل ہے\" (صحیح بخاری و مسلم)۔ حدیثِ جبرئیل میں احسان کی تعریف یہ ہے: \"تم اللہ کی عبادت ایسے کرو گویا تم اسے دیکھ رہے ہو، اور اگر یہ نہ ہو سکے تو یہ سمجھو کہ وہ تمہیں دیکھ رہا ہے\" (صحیح مسلم)۔\n\nعلمائے دیوبند کے ہاں تصوف کا مطلب یہی تزکیہ اور احسان ہے، جو شریعت کے ماتحت ہو۔ ان کا اصول ہے کہ جو طریقہ شریعت کے خلاف ہو وہ تصوف نہیں۔ اس کے لیے مستند، شریعت پر چلنے والے اہلِ اللہ کی صحبت فائدہ مند ہے۔ قرآن میں حکم ہے:\n\n﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَكُونُوا۟ مَعَ ٱلصَّٰدِقِينَ ﴾\n(سورۃ التوبہ، آیت ۱۱۹)\n\nروزمرہ کے آسان اعمال: فرض نمازوں کی پابندی، صبح و شام کے اذکار، روزانہ کچھ تلاوت، رات کو اپنا محاسبہ، اور ذکر کی کثرت۔ قرآن کہتا ہے: ﴿ أَلَا بِذِكْرِ ٱللَّهِ تَطْمَئِنُّ ٱلْقُلُوبُ ﴾ (الرعد ۲۸)۔\n\nمزید تفصیل: ایک اعتراض اور جواب۔ اعتراض: \"تصوف کا لفظ قرآن و حدیث میں نہیں، اس لیے یہ بدعت ہے۔\" جواب: اصل چیز لفظ نہیں، مفہوم ہے۔ تزکیہ اور احسان قرآن اور حدیث دونوں میں موجود ہیں، اور صوفیائے کرام نے اسی کو ایک علم کی شکل میں مرتب کیا، جیسے نحو، صرف، اصولِ حدیث اور فقہ کو مرتب کیا گیا، حالانکہ یہ الفاظ بھی نبی ﷺ کے زمانے میں نہیں تھے۔ جو تصوف شریعت کے خلاف ہو، یا جس میں شرک، بے نمازی، یا رسومات ہوں، وہ علمائے حق کے نزدیک مردود ہے۔\n\nدوسرا اعتراض: \"پیری مریدی کی کیا ضرورت ہے؟\" جواب: انسان کو اپنے نفس کی بیماریوں کا علاج کسی ماہر سے کرانے کی ضرورت ہوتی ہے، جیسے جسمانی علاج ڈاکٹر سے۔ بیعت ایک عہد ہے کہ میں اصلاح کے لیے آپ کی رہنمائی پر چلوں گا۔ شیخ کی شرائط یہ ہیں کہ وہ عالم یا عالم کی صحبت یافتہ ہو، سنت پر عمل کرنے والا ہو، اور خود کو عبادت کا مستحق یا غیب دان نہ سمجھتا ہو۔"},{"id":"a-tilawat","v":2,"title":"تلاوتِ قرآن کے آداب اور فضائل","cat":"قرآن","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"قرآن اللہ کا کلام ہے، اس لیے اسے پڑھنے کے کچھ آداب ہیں جن کا خیال رکھنے سے برکت اور ثواب بڑھ جاتا ہے۔\n\n﴿ أَوْ زِدْ عَلَيْهِ وَرَتِّلِ ٱلْقُرْءَانَ تَرْتِيلًا ﴾\n(سورۃ المزمل، آیت ۴)\n\nمفہوم: اور قرآن کو ٹھہر ٹھہر کر (ترتیل سے) پڑھو۔ نبی ﷺ نے فرمایا: \"قرآن کا ماہر نیک اور معزز فرشتوں کے ساتھ ہوگا، اور جو اٹک اٹک کر پڑھتا ہے اور اسے مشقت ہوتی ہے اس کے لیے دوہرا اجر ہے\" (صحیح بخاری و مسلم)۔ اور فرمایا: \"جو اللہ کی کتاب کا ایک حرف پڑھے اسے ایک نیکی ملتی ہے اور ایک نیکی دس گنا ہوتی ہے\" (جامع ترمذی)۔\n\nتلاوت کے آداب: (۱) وضو کے ساتھ اور پاک جگہ پر بیٹھ کر پڑھنا۔ (۲) قرآن کو ادب سے اونچی جگہ رکھنا اور قبلہ رخ ہو کر پڑھنا بہتر ہے۔ (۳) شروع میں \"اعوذ باللہ\" اور \"بسم اللہ\" پڑھنا۔ (۴) تجوید کے ساتھ صاف اور ٹھہر کر پڑھنا۔ (۵) پڑھتے وقت دھیان اور خشوع رکھنا اور معنی پر غور کرنا۔ (۶) جب قرآن پڑھا جا رہا ہو تو خاموشی سے سننا۔\n\n﴿ وَإِذَا قُرِئَ ٱلْقُرْءَانُ فَٱسْتَمِعُوا۟ لَهُۥ وَأَنصِتُوا۟ لَعَلَّكُمْ تُرْحَمُونَ ﴾\n(سورۃ الاعراف، آیت ۲۰۴)\n\nعملی بات: ہر روز کم از کم ایک رکوع ترجمے کے ساتھ پڑھیں، اور قرآن کو صرف ثواب کی کتاب نہیں بلکہ زندگی کی رہنمائی سمجھ کر پڑھیں۔ حیض کی حالت میں خواتین کے لیے تلاوت کے مسائل کسی مستند عالمہ سے معلوم کر لیں۔"},{"id":"a-wuzu-paki","v":2,"title":"پاکی اور وضو کی اہمیت","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نبی ﷺ نے فرمایا: \"پاکی آدھا ایمان ہے\" (صحیح مسلم)۔ اسلام نے جسم، لباس اور جگہ کی صفائی کو عبادت کا حصہ بنایا ہے۔\n\n﴿ وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ قُلْ هُوَ أَذًى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى ٱلْمَحِيضِ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ ٱللَّهُ إِنَّ ٱللَّهَ يُحِبُّ ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ ﴾\n(سورۃ البقرہ، آیت ۲۲۲)\n\nمفہوم: بے شک اللہ توبہ کرنے والوں اور پاک رہنے والوں سے محبت کرتا ہے۔ نماز کی شرط وضو ہے، اور وضو کے فرائض قرآن میں بیان ہوئے ہیں:\n\n﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا قُمْتُمْ إِلَى ٱلصَّلَوٰةِ فَٱغْسِلُوا۟ وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى ٱلْمَرَافِقِ وَٱمْسَحُوا۟ بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى ٱلْكَعْبَيْنِ وَإِن كُنتُمْ جُنُبًا فَٱطَّهَّرُوا۟ وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌ مِّنكُم مِّنَ ٱلْغَآئِطِ أَوْ لَٰمَسْتُمُ ٱلنِّسَآءَ فَلَمْ تَجِدُوا۟ مَآءً فَتَيَمَّمُوا۟ صَعِيدًا طَيِّبًا فَٱمْسَحُوا۟ بِوُجُوهِكُمْ وَأَيْدِيكُم مِّنْهُ مَا يُرِيدُ ٱللَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٍ وَلَٰكِن يُرِيدُ لِيُطَهِّرَكُمْ وَلِيُتِمَّ نِعْمَتَهُۥ عَلَيْكُمْ لَعَلَّكُمْ تَشْكُرُونَ ﴾\n(سورۃ المائدہ، آیت ۶)\n\nاس آیت میں وضو کے چار فرائض مذکور ہیں: (۱) چہرہ دھونا۔ (۲) دونوں ہاتھ کہنیوں سمیت دھونا۔ (۳) سر کا مسح کرنا۔ (۴) دونوں پاؤں ٹخنوں سمیت دھونا۔ نبی ﷺ نے فرمایا: \"اللہ کسی کی نماز پاکی کے بغیر قبول نہیں فرماتا\" (صحیح مسلم)۔\n\nوضو کی فضیلت: نبی ﷺ نے فرمایا کہ جب مسلمان بندہ وضو کرتا ہے اور چہرہ دھوتا ہے تو آنکھوں سے کیے ہوئے گناہ پانی کے ساتھ جھڑ جاتے ہیں، اور اسی طرح ہاتھ اور پاؤں دھونے سے بھی (صحیح مسلم)۔\n\nوضو کی سنتیں جیسے بسم اللہ، مسواک، کلی، ناک میں پانی ڈالنا، اور اعضا تین تین بار دھونا کسی مستند عالمہ سے عملی طریقہ سیکھ کر اپنائیں۔ خواتین کے لیے پاکی کے خاص مسائل (حیض و نفاس) بھی مستند اہلِ علم سے ضرور سیکھیں۔"},{"id":"a-roza","v":2,"title":"روزہ اور رمضان المبارک","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ ﴾\n(سورۃ البقرہ، آیت ۱۸۳)\n\nمفہوم: اے ایمان والو! تم پر روزے فرض کیے گئے جیسے تم سے پہلے لوگوں پر فرض کیے گئے تھے تاکہ تم پرہیزگار بنو۔ یعنی روزے کا مقصد تقویٰ ہے، صرف بھوکا رہنا نہیں۔\n\nرمضان کی خاص فضیلت یہ ہے کہ قرآن اسی مہینے میں نازل ہوا (البقرہ ۱۸۵)۔ نبی ﷺ نے فرمایا: \"جو شخص ایمان اور ثواب کی نیت سے رمضان کے روزے رکھے اس کے پچھلے گناہ معاف کر دیے جاتے ہیں\" (صحیح بخاری و مسلم)۔ اور فرمایا: \"روزہ ڈھال ہے\" (صحیح بخاری و مسلم)۔\n\nروزے کی حفاظت: نبی ﷺ نے فرمایا: \"جو شخص جھوٹ بولنا اور اس پر عمل کرنا نہ چھوڑے تو اللہ کو اس کے کھانا پینا چھوڑنے کی کوئی حاجت نہیں\" (صحیح بخاری)۔ اس لیے روزے میں زبان، آنکھ اور کان کی بھی حفاظت کریں۔\n\nخواتین کے لیے خاص باتیں: حیض و نفاس میں روزہ نہیں رکھا جاتا اور بعد میں ان کی قضا کی جاتی ہے۔ یہ اللہ کی طرف سے آسانی ہے۔ دوسرے مسائل جیسے بیماری، سفر اور فدیہ کے لیے مستند عالم سے پوچھیں۔ رمضان میں قرآن کی تلاوت، نوافل، دعا اور صدقہ بڑھا دیں۔\n\nمزید تفصیل: لیلۃ القدر۔ قرآن میں اس رات کی عظمت یوں بیان ہوئی:\n\n﴿ إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ لَيْلَةُ ٱلْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ ﴾\n(سورۃ القدر)\n\nنبی ﷺ نے فرمایا: \"جو لیلۃ القدر میں ایمان اور ثواب کی نیت سے قیام کرے اس کے پچھلے گناہ معاف ہو جاتے ہیں\" (صحیح بخاری و مسلم)۔ اسے رمضان کی آخری دس طاق راتوں میں تلاش کرنے کا حکم ہے (صحیح بخاری)۔\n\nسحری اور افطار: نبی ﷺ نے فرمایا: \"سحری کھاؤ، کیونکہ سحری میں برکت ہے\" (صحیح بخاری و مسلم)۔ افطار میں جلدی کرنا سنت ہے، اور افطار کے وقت دعا قبول ہوتی ہے۔ اعتکاف رمضان کے آخری دس دنوں کی سنتِ مؤکدہ علی الکفایہ ہے، اور خواتین گھر کے کسی گوشے میں اعتکاف کر سکتی ہیں۔"},{"id":"a-zakat-sadaqa","v":2,"title":"زکوٰۃ اور صدقہ","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"زکوٰۃ اسلام کے پانچ ارکان میں سے ایک رکن ہے۔ قرآن میں بہت سی جگہوں پر نماز کے ساتھ زکوٰۃ کا حکم آیا ہے:\n\n﴿ وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَٱرْكَعُوا۟ مَعَ ٱلرَّٰكِعِينَ ﴾\n(سورۃ البقرہ، آیت ۴۳)\n\nنبی ﷺ نے فرمایا: \"اسلام کی بنیاد پانچ چیزوں پر ہے...\" جن میں کلمۂ شہادت، نماز، زکوٰۃ، حج اور رمضان کے روزے شامل ہیں (صحیح بخاری و مسلم)۔\n\nزکوٰۃ کے مصارف قرآن نے خود بیان کیے ہیں: فقراء، مساکین، زکوٰۃ کے کام پر مقرر لوگ، جن کے دل جوڑنے مقصود ہوں، غلام آزاد کرانے، مقروض، اللہ کے راستے میں اور مسافر (التوبہ ۶۰)۔ عام طور پر زکوٰۃ کی شرح مال کا ڈھائی فیصد (چالیسواں حصہ) ہے، بشرطیکہ مال نصاب کو پہنچے اور ایک سال گزر جائے۔ نصاب کے مسائل (سونا، چاندی، نقدی، تجارتی مال) کے لیے کسی مستند مفتی سے حساب کروا لیں۔\n\nصدقہ فرض زکوٰۃ کے علاوہ نفلی نیکی ہے۔ نبی ﷺ نے فرمایا: \"صدقہ سے مال میں کمی نہیں آتی\" (صحیح مسلم)۔ قرآن نے اللہ کی راہ میں خرچ کرنے کی مثال یوں دی ہے کہ جیسے ایک دانہ سات بالیں اگاتا ہے اور ہر بال میں سو دانے ہوں (البقرہ ۲۶۱)۔\n\nعملی بات: صدقہ کم ہی کیوں نہ ہو، مگر مسلسل دیں۔ زکوٰۃ اپنے ایسے رشتہ داروں کو بھی دی جا سکتی ہے جو مستحق ہوں (والدین، اولاد اور میاں بیوی کے علاوہ)، اور اس میں دوہرا ثواب ہے۔\n\nمزید تفصیل: زکوٰۃ کا نصاب۔ عام طور پر علماء کے مطابق سونے کا نصاب ساڑھے سات تولہ اور چاندی کا ساڑھے باون تولہ ہے۔ جس کے پاس ضروریات کے علاوہ سونا، چاندی، نقدی یا مالِ تجارت اس مقدار کی قیمت کے برابر ہو اور اس پر سال گزر جائے اس پر ڈھائی فیصد زکوٰۃ فرض ہے۔ عورت کے پاس اپنا زیور ہو تو اس کی زکوٰۃ فرض ہے، اور اسے خود ادا کرنا چاہیے یا شوہر کو دینے کے لیے اجازت دے۔\n\nزکوٰۃ نہ دینے کا انجام قرآن نے سخت بیان کیا ہے (التوبہ ۳۴ تا ۳۵)۔ ہر سال اپنے مال کا حساب کر کے زکوٰۃ نکالنے کی عادت بنائیں اور ایک مقررہ تاریخ رکھیں۔ زکوٰۃ مستحق تک پہنچائیں، اور اسے احسان جتانے یا دکھاوے کے ساتھ نہ دیں، کیونکہ قرآن نے ایسے صدقے کو ضائع ہونے والا بتایا ہے (البقرہ ۲۶۴)۔"},{"id":"a-hajj","v":2,"title":"حج اور عمرہ: ایک عظیم سفر","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"حج ہر اس مسلمان پر زندگی میں ایک بار فرض ہے جو بیت اللہ تک پہنچنے کی استطاعت رکھتا ہو۔\n\n﴿ فِيهِ ءَايَٰتٌۢ بَيِّنَٰتٌ مَّقَامُ إِبْرَٰهِيمَ وَمَن دَخَلَهُۥ كَانَ ءَامِنًا وَلِلَّهِ عَلَى ٱلنَّاسِ حِجُّ ٱلْبَيْتِ مَنِ ٱسْتَطَاعَ إِلَيْهِ سَبِيلًا وَمَن كَفَرَ فَإِنَّ ٱللَّهَ غَنِىٌّ عَنِ ٱلْعَٰلَمِينَ ﴾\n(سورۃ آل عمران، آیت ۹۷)\n\nنبی ﷺ نے فرمایا: \"جس نے اللہ کے لیے حج کیا، اس دوران نہ فحش بات کی اور نہ گناہ کیا، تو وہ ایسے لوٹتا ہے جیسے اس دن جب اس کی ماں نے اسے جنم دیا\" (صحیح بخاری و مسلم)۔ اور فرمایا: \"حجِ مبرور (مقبول حج) کا بدلہ جنت ہی ہے\" (صحیح بخاری و مسلم)۔\n\nحج کے ارکان میں احرام، وقوفِ عرفہ، طوافِ زیارت وغیرہ شامل ہیں۔ ابراہیمؑ کی دعوت کا ذکر یوں ہے:\n\n﴿ وَأَذِّن فِى ٱلنَّاسِ بِٱلْحَجِّ يَأْتُوكَ رِجَالًا وَعَلَىٰ كُلِّ ضَامِرٍ يَأْتِينَ مِن كُلِّ فَجٍّ عَمِيقٍ ﴾\n(سورۃ الحج، آیت ۲۷)\n\nخواتین کے لیے مسئلہ: فقہ حنفی کے مطابق عورت کو حج کے سفر میں شوہر یا محرم کا ساتھ ہونا ضروری ہے (حدیث: عورت محرم کے بغیر سفر نہ کرے، صحیح بخاری و مسلم)۔\n\nحج کی طرف جانے والے ہر شخص کو چاہیے کہ پہلے مستند عالم یا معلم سے مناسک عملی طور پر سیکھ لے۔ عمرہ زندگی میں جب بھی کیا جا سکے بڑی نیکی ہے، مگر فرض نہیں۔ جو حج کی استطاعت نہیں رکھتا، وہ نیت اور دعا رکھے۔\n\nمزید تفصیل: حج کے فرائض۔ احرام باندھ کر نیت کرنا، وقوفِ عرفہ (نو ذوالحجہ کو عرفات میں ٹھہرنا) اور طوافِ زیارت حج کے فرائض ہیں۔ حج کے دیگر اعمال جیسے منیٰ میں قیام، مزدلفہ میں رات گزارنا، رمی جمرات، قربانی، سر منڈوانا یا بال کٹوانا اور صفا و مروہ کی سعی واجبات میں شامل ہیں۔\n\nحج مبرور کی علامت یہ ہے کہ اس کے بعد انسان کی زندگی میں تبدیلی آئے اور گناہوں سے بچنے کی کوشش بڑھے۔ حج کے لیے مال حلال ہونا ضروری ہے۔ عمرہ کا طریقہ: احرام، طواف، صفا و مروہ کی سعی، اور بال کٹوانا۔ کسی مستند معلم یا حج گروپ کے ساتھ جا کر یہ اعمال عملی طور پر سیکھنا بہتر ہے۔"},{"id":"a-tauba","v":2,"title":"توبہ و استغفار: رحمت کا دروازہ","cat":"اخلاق","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"انسان سے خطا ہو جاتی ہے، مگر اللہ نے توبہ کا دروازہ کھلا رکھا ہے۔\n\n﴿ قُلْ يَٰعِبَادِىَ ٱلَّذِينَ أَسْرَفُوا۟ عَلَىٰٓ أَنفُسِهِمْ لَا تَقْنَطُوا۟ مِن رَّحْمَةِ ٱللَّهِ إِنَّ ٱللَّهَ يَغْفِرُ ٱلذُّنُوبَ جَمِيعًا إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ ﴾\n(سورۃ الزمر، آیت ۵۳)\n\nمفہوم: اے میرے بندو! جنہوں نے اپنی جانوں پر زیادتی کی، اللہ کی رحمت سے ناامید نہ ہو، بے شک اللہ سارے گناہ معاف کر دیتا ہے، وہ بہت بخشنے والا، رحم کرنے والا ہے۔\n\nنبی ﷺ نے فرمایا: \"اللہ اپنے بندے کی توبہ سے اس شخص سے بھی زیادہ خوش ہوتا ہے جسے صحرا میں اپنی گم شدہ سواری مل جائے\" (صحیح بخاری و مسلم)۔ اور فرمایا: \"ہر انسان خطا کار ہے اور بہترین خطا کار وہ ہیں جو توبہ کرتے ہیں\" (جامع ترمذی، سنن ابن ماجہ)۔\n\nسچی توبہ کی شرطیں یہ ہیں: (۱) گناہ پر دل سے شرمندہ ہونا۔ (۲) فوراً اس گناہ کو چھوڑ دینا۔ (۳) آئندہ نہ کرنے کا پکا ارادہ۔ (۴) اگر کسی بندے کا حق مارا ہو تو اسے ادا کرنا یا معافی مانگنا۔ قرآن میں سچی توبہ کا حکم ہے: ﴿ تُوبُوٓا۟ إِلَى ٱللَّهِ تَوْبَةً نَّصُوحًا ﴾ (التحریم ۸)۔\n\nعملی بات: روزانہ استغفار کی عادت بنائیں، مثلاً سو بار \"استغفر اللہ\"۔ سید الاستغفار صبح و شام پڑھنا بھی بڑی فضیلت رکھتا ہے۔ ہماری ویب سائٹ کے \"اذکار و دعائیں\" سیکشن میں یہ دعائیں موجود ہیں۔\n\nمزید تفصیل: اللہ کے حقوق اور بندوں کے حقوق۔ اگر گناہ اللہ کے حق سے متعلق ہو (جیسے نماز کی قضا، روزے کی کوتاہی) تو توبہ کے ساتھ اس کی قضا کی جائے۔ اگر کسی انسان کا مال یا عزت مجروح کی ہو تو اس کا حق لوٹانا یا اس سے معافی مانگنا ضروری ہے، کیونکہ حقوق العباد صرف توبہ سے معاف نہیں ہوتے۔\n\nنبی ﷺ نے فرمایا: \"اللہ بندے کی توبہ اس وقت تک قبول کرتا ہے جب تک اس کی جان حلق تک نہ پہنچ جائے\" (جامع ترمذی)۔ اس لیے کسی بھی وقت توبہ میں دیر نہ کریں۔"},{"id":"a-sach-amanat","v":2,"title":"سچائی، امانت داری اور وعدے کی پابندی","cat":"اخلاق","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَكُونُوا۟ مَعَ ٱلصَّٰدِقِينَ ﴾\n(سورۃ التوبہ، آیت ۱۱۹)\n\nنبی ﷺ نے فرمایا: \"سچ کو لازم پکڑو، کیونکہ سچ نیکی کی طرف لے جاتا ہے اور نیکی جنت کی طرف۔ آدمی سچ بولتا رہتا ہے یہاں تک کہ اللہ کے ہاں صدیق لکھ دیا جاتا ہے۔ اور جھوٹ سے بچو، کیونکہ جھوٹ گناہ کی طرف لے جاتا ہے اور گناہ جہنم کی طرف\" (صحیح بخاری و مسلم)۔\n\nامانت کے بارے میں قرآن کا حکم ہے:\n\n﴿ إِنَّ ٱللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا۟ ٱلْأَمَٰنَٰتِ إِلَىٰٓ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ ٱلنَّاسِ أَن تَحْكُمُوا۟ بِٱلْعَدْلِ إِنَّ ٱللَّهَ نِعِمَّا يَعِظُكُم بِهِۦٓ إِنَّ ٱللَّهَ كَانَ سَمِيعًۢا بَصِيرًا ﴾\n(سورۃ النساء، آیت ۵۸)\n\nمفہوم: اللہ تمہیں حکم دیتا ہے کہ امانتیں ان کے حق داروں کو لوٹا دو۔ امانت صرف مال نہیں، راز، ذمہ داری، علم اور ملاقات کی باتیں بھی امانت ہیں۔\n\nنبی ﷺ نے منافق کی تین نشانیاں بتائیں: \"جب بات کرے تو جھوٹ بولے، جب وعدہ کرے تو خلاف ورزی کرے، اور جب اس کے پاس امانت رکھی جائے تو خیانت کرے\" (صحیح بخاری و مسلم)۔\n\nعملی بات: چھوٹے بچوں سے بھی جھوٹا وعدہ نہ کریں۔ جو وعدہ کریں اسے پورا کریں، اور اگر پورا نہ ہو سکے تو پہلے ہی معذرت کر لیں۔"},{"id":"a-ghibat","v":2,"title":"غیبت، چغلی اور بدگمانی سے بچاؤ","cat":"اخلاق","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"زبان کے گناہ بہت آسانی سے ہو جاتے ہیں مگر ان کا نقصان بہت بڑا ہے۔ قرآن نے غیبت کی مثال بہت سخت دی ہے:\n\n﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱجْتَنِبُوا۟ كَثِيرًا مِّنَ ٱلظَّنِّ إِنَّ بَعْضَ ٱلظَّنِّ إِثْمٌ وَلَا تَجَسَّسُوا۟ وَلَا يَغْتَب بَّعْضُكُم بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ وَٱتَّقُوا۟ ٱللَّهَ إِنَّ ٱللَّهَ تَوَّابٌ رَّحِيمٌ ﴾\n(سورۃ الحجرات، آیت ۱۲)\n\nنبی ﷺ نے صحابہؓ سے پوچھا: \"کیا تم جانتے ہو غیبت کیا ہے؟\" انہوں نے کہا: اللہ اور اس کا رسول بہتر جانتے ہیں۔ فرمایا: \"اپنے بھائی کا ایسی بات سے ذکر کرنا جو اسے بری لگے۔\" پوچھا گیا: اگر وہ بات اس میں واقعی ہو؟ فرمایا: \"اگر وہ بات اس میں ہے تو تم نے غیبت کی، اور اگر نہیں ہے تو تم نے بہتان لگایا\" (صحیح مسلم)۔\n\nچغلی یہ ہے کہ فساد ڈالنے کے لیے ایک کی بات دوسرے تک پہنچائی جائے۔ نبی ﷺ نے فرمایا: \"چغل خور جنت میں داخل نہیں ہوگا\" (صحیح مسلم)۔ اور بدگمانی کے بارے میں فرمایا: \"بدگمانی سے بچو، کیونکہ بدگمانی سب سے جھوٹی بات ہے\" (صحیح بخاری و مسلم)۔\n\nغیبت سے بچنے کے طریقے: (۱) جب کوئی کسی کی برائی کرنے لگے تو موضوع بدل دیں یا وہاں سے اٹھ جائیں۔ (۲) اگر غیبت ہو جائے تو توبہ کریں اور جس کی غیبت کی اس کے لیے دعا کریں، اور اگر معافی مانگنے سے فساد نہ ہو تو معافی بھی مانگ لیں۔ (۳) اپنے عیبوں پر نظر رکھیں۔\n\nبعض مواقع پر کسی کا برائی بیان کرنا جائز ہے، جیسے ظلم کی شکایت، یا مشورہ، یا گواہی۔ ایسی صورت میں مقصد اصلاح ہو، دل کی بھڑاس نہیں۔\n\nمزید تفصیل: غیبت کا کفارہ۔ علماء کے مطابق جس شخص کی غیبت کی گئی ہو اگر اسے معلوم ہو گیا ہو اور معافی مانگنے سے فساد کا ڈر نہ ہو تو اس سے معافی مانگ لے۔ اگر اسے معلوم نہیں ہوا تو اس کے لیے دعا اور استغفار کرے اور اس کی تعریف اور اچھائی لوگوں کے سامنے بیان کرے۔ غیبت سننے والا بھی گناہ میں شریک ہے، اس لیے اسے چاہیے کہ منع کرے یا وہاں سے اٹھ جائے۔"},{"id":"a-parda-haya","v":2,"title":"پردہ اور حیا: عورت کی عزت کے محافظ","cat":"خواتین","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اللہ تعالیٰ نے مرد و عورت دونوں کو نظر نیچی رکھنے کا حکم دیا ہے، اور عورتوں کو خاص طور پر اپنی زینت چھپانے اور سر و سینے کو دوپٹے سے ڈھانپنے کا حکم دیا:\n\n﴿ وَقُل لِّلْمُؤْمِنَٰتِ يَغْضُضْنَ مِنْ أَبْصَٰرِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّ أَوْ ءَابَآئِهِنَّ أَوْ ءَابَآءِ بُعُولَتِهِنَّ أَوْ أَبْنَآئِهِنَّ أَوْ أَبْنَآءِ بُعُولَتِهِنَّ أَوْ إِخْوَٰنِهِنَّ أَوْ بَنِىٓ إِخْوَٰنِهِنَّ أَوْ بَنِىٓ أَخَوَٰتِهِنَّ أَوْ نِسَآئِهِنَّ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُنَّ أَوِ ٱلتَّٰبِعِينَ غَيْرِ أُو۟لِى ٱلْإِرْبَةِ مِنَ ٱلرِّجَالِ أَوِ ٱلطِّفْلِ ٱلَّذِينَ لَمْ يَظْهَرُوا۟ عَلَىٰ عَوْرَٰتِ ٱلنِّسَآءِ وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِن زِينَتِهِنَّ وَتُوبُوٓا۟ إِلَى ٱللَّهِ جَمِيعًا أَيُّهَ ٱلْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُونَ ﴾\n(سورۃ النور، آیت ۳۱)\n\nاور فرمایا کہ نبی کی بیویوں، بیٹیوں اور ایمان والی عورتوں سے کہہ دیجیے کہ اپنی چادریں اپنے اوپر لٹکا لیا کریں، یہ اس کے زیادہ قریب ہے کہ وہ پہچانی جائیں اور ستائی نہ جائیں (الاحزاب ۵۹)۔ مردوں کو بھی حکم ہے کہ نگاہیں نیچی رکھیں (النور ۳۰)۔\n\nنبی ﷺ نے فرمایا: \"حیا ایمان کا حصہ ہے\" (صحیح بخاری و مسلم)۔ پردہ عورت کی حفاظت، وقار اور عزت کی علامت ہے، قید نہیں۔ جیسے قیمتی چیز کو حفاظت میں رکھا جاتا ہے، اسی طرح اسلام نے عورت کو ہر قسم کی ایذا سے بچانے کے لیے پردے کا نظام دیا۔\n\nپردے کی تفصیل: ستر (جسم کا وہ حصہ جس کا چھپانا لازم ہے) اور غیر محرم سے پردہ دونوں احکام ہیں۔ اس بارے میں ائمہ کا چہرے کے پردے میں کچھ اختلاف ہے۔ علمائے دیوبند عام طور پر فتنے کے اس دور میں غیر محرموں کے سامنے چہرے کے پردے کو بھی لازم کہتے ہیں۔ اپنے حالات کے مطابق تفصیلی مسائل کسی مستند عالمہ یا مفتی سے معلوم کریں۔\n\nعملی بات: بچیوں کو بچپن ہی سے حیا اور حجاب کی محبت سکھائیں، اور انہیں بتائیں کہ یہ اللہ کی رضا کا راستہ ہے۔ زبردستی کے بجائے محبت اور اپنے عملی نمونے سے سمجھائیں۔\n\nاعتراض اور جواب: اعتراض: \"پردہ ترقی اور تعلیم میں رکاوٹ ہے۔\" جواب: صحابیاتؓ نے پردے کے ساتھ علم، جہاد کی خدمت اور تجارت میں حصہ لیا۔ حضرت عائشہؓ سے بڑے بڑے صحابہ مسائل پوچھتے، حضرت ام سلیمؓ اور حضرت ام عطیہؓ جیسی خواتین نے بیماروں کی خدمت اور زخمیوں کا علاج کیا، اور حضرت خدیجہؓ تجارت کرتی تھیں۔ اسلام عورت کو تعلیم اور ضروری کاموں سے نہیں روکتا، بلکہ حیا، حفاظت اور مناسب پردے کی حدود میں رہنے کا کہتا ہے۔\n\nمزید تفصیل: حیا اور حجاب کا تعلق صرف لباس تک نہیں۔ گفتگو میں نرمی اور وقار، نظر کی حفاظت، غیر محرم کے ساتھ تنہائی سے بچنا، اور سوشل میڈیا پر اپنی تصاویر یا نجی باتوں کی نمائش سے بچنا بھی حیا کا حصہ ہے۔ نبی ﷺ نے فرمایا: \"حیا بھلائی ہی لاتی ہے\" (صحیح بخاری و مسلم)۔"},{"id":"a-nikah-huqooq","v":2,"title":"نکاح اور میاں بیوی کے حقوق","cat":"گھر اور خاندان","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نکاح انبیاء کی سنت اور سکون کا ذریعہ ہے۔\n\n﴿ وَمِنْ ءَايَٰتِهِۦٓ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًا لِّتَسْكُنُوٓا۟ إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً إِنَّ فِى ذَٰلِكَ لَـَٔايَٰتٍ لِّقَوْمٍ يَتَفَكَّرُونَ ﴾\n(سورۃ الروم، آیت ۲۱)\n\nمفہوم: اور اس کی نشانیوں میں سے یہ ہے کہ اس نے تمہارے لیے تمہاری ہی جنس سے بیویاں بنائیں تاکہ تم ان سے سکون پاؤ، اور تمہارے درمیان محبت اور رحمت رکھ دی۔\n\nمیاں بیوی کے ایک دوسرے پر حقوق ہیں۔ قرآن کا حکم ہے: ﴿ وَعَاشِرُوهُنَّ بِٱلْمَعْرُوفِ ﴾ (النساء ۱۹)، ان کے ساتھ اچھے طریقے سے زندگی گزارو۔ اور فرمایا: ﴿ وَلَهُنَّ مِثْلُ ٱلَّذِى عَلَيْهِنَّ بِٱلْمَعْرُوفِ ﴾ (البقرہ ۲۲۸)۔ نبی ﷺ نے فرمایا: \"تم میں بہتر وہ ہے جو اپنے گھر والوں کے لیے بہتر ہو، اور میں اپنے گھر والوں کے لیے تم سب سے بہتر ہوں\" (جامع ترمذی)۔ اور فرمایا: \"عورتوں کے ساتھ بھلائی کی وصیت قبول کرو\" (صحیح بخاری و مسلم)۔\n\nشوہر کے ذمے بیوی کا نان نفقہ، رہائش، عزت اور حسنِ سلوک ہے۔ بیوی کے ذمے شوہر کی جائز بات ماننا، اس کے گھر اور مال کی حفاظت، اور اس کی ناشکری نہ کرنا ہے۔ مہر بیوی کا حق ہے جو خوش دلی سے ادا کیا جائے (النساء ۴)۔\n\nگھر میں سکون کے لیے: ایک دوسرے کی تعریف کریں، غلطیاں معاف کریں، ناراضی میں بھی زبان کو قابو رکھیں، اور مل کر نماز اور دعا کریں۔ کوئی بڑی بات ہو جائے تو رشتے داروں یا کسی دیندار عالم سے مشورہ لے کر صلح کریں۔\n\nاعتراض اور جواب: اعتراض: \"اسلام نے ایک سے زیادہ شادیوں کی اجازت کیوں دی؟\" جواب: قرآن نے مشروط اجازت دی ہے: ﴿ وَإِنْ خِفْتُمْ أَلَّا تُقْسِطُوا۟ فِى ٱلْيَتَٰمَىٰ فَٱنكِحُوا۟ مَا طَابَ لَكُم مِّنَ ٱلنِّسَآءِ مَثْنَىٰ وَثُلَٰثَ وَرُبَٰعَ فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا۟ فَوَٰحِدَةً أَوْ مَا ﴾ (النساء ۳)۔ شرط یہ ہے کہ سب بیویوں کے درمیان عدل ہو، ورنہ ایک ہی پر اکتفا کیا جائے۔ یہ اجازت ضرورت کے وقت معاشرے کے مسائل (جیسے بیواؤں اور یتیموں کی کفالت) کے حل کے لیے ہے۔ یہ ہر شخص کے لیے ضروری نہیں اور نہ ہی بغیر عدل کے جائز ہے۔\n\nازدواجی زندگی میں تنازعہ ہو جائے تو قرآن نے صلح کا طریقہ بتایا ہے کہ دونوں گھروں کے سمجھدار لوگ مل کر صلح کرائیں (النساء ۳۵)۔ طلاق ناپسندیدہ ہے، اس لیے آخری حل کے طور پر ہی کی جائے، اور اس کے مسائل مستند مفتی سے معلوم کیے جائیں۔"},{"id":"a-aulad-tarbiyat","v":2,"title":"اولاد کی دینی تربیت","cat":"گھر اور خاندان","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اولاد اللہ کی امانت ہے اور ان کی تربیت والدین کی ذمہ داری۔\n\n﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ قُوٓا۟ أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًا وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ عَلَيْهَا مَلَٰٓئِكَةٌ غِلَاظٌ شِدَادٌ لَّا يَعْصُونَ ٱللَّهَ مَآ أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ ﴾\n(سورۃ التحریم، آیت ۶)\n\nمفہوم: اے ایمان والو! اپنے آپ کو اور اپنے گھر والوں کو آگ سے بچاؤ۔ نبی ﷺ نے فرمایا: \"تم میں سے ہر ایک نگہبان ہے اور ہر ایک سے اس کی رعیت کے بارے میں پوچھا جائے گا\" (صحیح بخاری و مسلم)۔ عورت اپنے شوہر کے گھر کی نگران ہے اور اس سے اس کے بارے میں پوچھا جائے گا۔\n\nحضرت لقمانؑ نے اپنے بیٹے کو نصیحت کی: ﴿ يَٰبُنَىَّ أَقِمِ ٱلصَّلَوٰةَ وَأْمُرْ بِٱلْمَعْرُوفِ وَٱنْهَ عَنِ ٱلْمُنكَرِ وَٱصْبِرْ عَلَىٰ مَآ أَصَابَكَ ﴾ (لقمان ۱۷)۔ نبی ﷺ نے فرمایا: \"اپنی اولاد کو سات سال کی عمر میں نماز کا حکم دو\" (سنن ابوداؤد)۔\n\nتربیت کے آسان اصول: (۱) خود عمل کر کے دکھائیں، بچے وہی سیکھتے ہیں جو دیکھتے ہیں۔ (۲) نرمی سے سمجھائیں، نبی ﷺ نے فرمایا: \"اللہ نرمی کرنے والا ہے اور ہر کام میں نرمی کو پسند کرتا ہے\" (صحیح بخاری و مسلم)۔ (۳) بچپن میں کلمہ، نماز، دعائیں اور چھوٹی سورتیں یاد کرائیں۔ (۴) اچھی صحبت اور اچھے ماحول کا خیال رکھیں۔ (۵) ان کے لیے روزانہ دعا کریں۔\n\nدعا: ﴿ رَبِّ هَبْ لِى مِنَ ٱلصَّٰلِحِينَ ﴾ (الصافات ۱۰۰) اور ﴿ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعْيُنٍ ﴾ (الفرقان ۷۴)۔"},{"id":"a-maut-akhirat","v":2,"title":"موت، قبر اور آخرت کی تیاری","cat":"آخرت","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"دنیا کی زندگی کا ہر انسان کو ایک دن خاتمہ ہونا ہے۔\n\n﴿ كُلُّ نَفْسٍ ذَآئِقَةُ ٱلْمَوْتِ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ ٱلْقِيَٰمَةِ فَمَن زُحْزِحَ عَنِ ٱلنَّارِ وَأُدْخِلَ ٱلْجَنَّةَ فَقَدْ فَازَ وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا مَتَٰعُ ٱلْغُرُورِ ﴾\n(سورۃ آل عمران، آیت ۱۸۵)\n\nمفہوم: ہر جان موت کا مزہ چکھنے والی ہے، اور قیامت کے دن تمہیں تمہارے پورے اعمال کا بدلہ دیا جائے گا۔ جو آگ سے بچا لیا گیا اور جنت میں داخل کیا گیا وہ کامیاب ہوا، اور دنیا کی زندگی تو دھوکے کا سامان ہے۔\n\nنبی ﷺ نے فرمایا: \"لذتوں کو ختم کر دینے والی موت کو کثرت سے یاد کیا کرو\" (جامع ترمذی، سنن نسائی)۔ اور فرمایا: \"دنیا میں اس طرح رہو جیسے تم مسافر یا راہ گزر ہو\" (صحیح بخاری)۔\n\nقیامت کے دن ہر چھوٹے بڑے عمل کا حساب ہوگا:\n\n﴿ فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُۥ وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُۥ ﴾\n(سورۃ الزلزال، آیات ۷ تا ۸)\n\nموت کے بعد کا سلسلہ: قبر، پھر قیامت میں دوبارہ اٹھایا جانا، حساب، میزان، پل صراط، اور آخر میں جنت یا جہنم۔ یہ سب قرآن اور صحیح احادیث سے ثابت ہیں اور ان پر ایمان لازم ہے۔\n\nنبی ﷺ نے فرمایا: \"جب انسان مر جاتا ہے تو اس کا عمل ختم ہو جاتا ہے مگر تین چیزیں: صدقۂ جاریہ، ایسا علم جس سے فائدہ اٹھایا جائے، یا نیک اولاد جو اس کے لیے دعا کرے\" (صحیح مسلم)۔ اسی لیے ایسے کام کریں جن کا ثواب موت کے بعد بھی جاری رہے، جیسے علم پھیلانا، قرآن سکھانا، اور بچوں کی نیک تربیت۔\n\nعملی بات: روزانہ سونے سے پہلے اپنے دن کا حساب لیں، توبہ کریں، اور وصیت اور قرض وغیرہ کے معاملات صاف رکھیں۔\n\nمزید تفصیل: قبر اور برزخ۔ قبر آخرت کی پہلی منزل ہے۔ نبی ﷺ نے فرمایا: \"قبر آخرت کی منزلوں میں سے پہلی منزل ہے، اگر اس سے نجات پا گیا تو آگے کی منزلیں آسان ہیں\" (جامع ترمذی، سنن ابن ماجہ)۔ مرنے کے بعد قبر میں سوالات اور نعمت یا عذاب کا ذکر صحیح احادیث میں ہے، اور اہلِ سنت اس پر ایمان رکھتے ہیں۔\n\nمرنے والے کے احکام: میت کو غسل، کفن اور نمازِ جنازہ کے بعد دفن کیا جاتا ہے۔ اہلِ میت کو تسلی دینا اور ان کی مدد کرنا سنت ہے۔ میت پر نوحہ کرنا اور چیخ چیخ کر رونا منع ہے، آنکھ کا آنسو اور دل کا غم قدرتی اور جائز ہے۔"},{"id":"a-inkar-hadith","v":2,"title":"حدیث کی حجیت: انکارِ حدیث کے شبہات اور جوابات","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"بعض لوگ کہتے ہیں کہ ہمیں صرف قرآن کافی ہے، حدیث کی ضرورت نہیں۔ یہ بات قرآن کے اپنے حکم کے خلاف ہے۔ ذیل میں چند عام شبہات اور ان کے جواب سادہ انداز میں لکھے ہیں۔\n\nپہلا اعتراض: \"قرآن کافی ہے، حدیث کی ضرورت نہیں۔\"\n\nجواب: قرآن نے خود رسول ﷺ کی اطاعت کا حکم دیا ہے:\n\n﴿ مَّن يُطِعِ ٱلرَّسُولَ فَقَدْ أَطَاعَ ٱللَّهَ وَمَن تَوَلَّىٰ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظًا ﴾\n(سورۃ النساء، آیت ۸۰)\n\nمفہوم: جس نے رسول کی اطاعت کی اس نے اللہ کی اطاعت کی۔ اور فرمایا کہ ہم نے آپ پر ذکر (قرآن) اس لیے اتارا کہ آپ لوگوں کے سامنے وہ بات کھول کر بیان کر دیں جو ان کی طرف اتاری گئی ہے (النحل ۴۴)۔ یعنی قرآن کی تشریح اور بیان رسول ﷺ کا کام ہے، اور یہی بیان حدیث اور سنت ہے۔\n\nمثال: قرآن میں نماز کا حکم ہے (اقیموا الصلاۃ) مگر پانچ نمازیں، ان کے اوقات، رکعات کی تعداد، رکوع و سجدے کا طریقہ قرآن میں تفصیل سے نہیں آیا۔ یہ سب ہمیں رسول ﷺ کے عمل سے ملا ہے۔ اسی طرح زکوٰۃ کے نصاب اور حج کے مناسک کی تفصیل بھی حدیث و سنت سے ہے۔ نبی ﷺ نے فرمایا: \"نماز اس طرح پڑھو جیسے مجھے پڑھتے دیکھتے ہو\" (صحیح بخاری)۔\n\nدوسرا اعتراض: \"حدیثیں تو بہت بعد میں لکھی گئیں، ان پر اعتماد کیسے کیا جائے؟\"\n\nجواب: حدیث کا ذخیرہ صرف بعد کی تحریروں پر نہیں، بلکہ نبی ﷺ کے زمانے سے محفوظ ہوتا آیا ہے۔ صحابہ کرامؓ سنتے، یاد کرتے اور عمل کرتے۔ حضرت ابوہریرہؓ فرماتے ہیں کہ صحابہ میں عبداللہ بن عمروؓ مجھ سے زیادہ حدیثیں رکھتے ہیں کیونکہ وہ لکھ لیا کرتے تھے اور میں نہیں لکھتا تھا (صحیح بخاری)۔ تابعین اور بعد کے محدثین نے ہر حدیث کی سند (راویوں کا سلسلہ) محفوظ کی اور راویوں کے حالات، حافظے اور سچائی کی جانچ کے لیے \"علمِ جرح و تعدیل\" بنایا۔ ایسی اہتمام والی حفاظت کسی اور کلام کے لیے نہیں ہوئی۔\n\nتیسرا اعتراض: \"حدیث کی کتابوں میں جھوٹی روایتیں بھی ہیں۔\"\n\nجواب: نبی ﷺ نے خود خبردار کیا تھا: \"جس نے مجھ پر جان بوجھ کر جھوٹ باندھا وہ اپنا ٹھکانہ جہنم میں بنا لے\" (صحیح بخاری و مسلم)۔ اسی لیے محدثین نے صحیح، حسن، ضعیف اور موضوع روایات کو الگ الگ کیا اور اس پر مستقل کتابیں لکھیں۔ امام بخاریؒ اور امام مسلمؒ نے صرف وہ روایات لیں جو سخت شرائط پر پوری اتریں۔ اس لیے جو چیز جھوٹی ثابت ہو اس کا رد کیا جاتا ہے، مگر صحیح احادیث کا انکار نہیں کیا جا سکتا۔\n\nچوتھا اعتراض: \"احادیث آپس میں ٹکراتی ہیں۔\"\n\nجواب: اکثر جگہ ظاہری ٹکراؤ ہوتا ہے، حقیقی نہیں۔ ایک حکم کسی خاص موقع یا شخص کے لیے ہوتا ہے، یا ایک بعد کا ہوتا ہے جو پہلے حکم کو منسوخ کر دیتا ہے۔ اہلِ علم نے اصولِ حدیث اور اصولِ فقہ میں ان سب کو سمجھنے کے قاعدے بنائے ہیں۔ اس لیے عام آدمی کو چاہیے کہ احادیث کی تشریح مستند علماء سے سمجھے اور خود بغیر علم کے اختلاف نہ ڈھونڈے۔\n\nنتیجہ: قرآن اور حدیث دونوں اللہ کی ہدایت کے دو حصے ہیں۔ جو نبی ﷺ کی سنت کو چھوڑ دے وہ قرآن کے مفہوم تک بھی صحیح طور پر نہیں پہنچ سکتا۔ قرآن کا حکم ہے: ﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَطِيعُوا۟ ٱللَّهَ وَأَطِيعُوا۟ ٱلرَّسُولَ وَأُو۟لِى ٱلْأَمْرِ مِنكُمْ فَإِن تَنَٰزَعْتُمْ ﴾ (النساء ۵۹)۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-taqleed-itiraz","v":2,"title":"تقلید پر اعتراضات اور جوابات","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"تقلید کا مطلب ہے کہ جو شخص خود قرآن و حدیث سے مسائل نکالنے کی صلاحیت نہ رکھتا ہو وہ کسی مستند مجتہد امام کی تحقیق پر اعتماد کر کے عمل کرے۔ اس پر چند اعتراضات کیے جاتے ہیں، ان کے جواب دیکھیے۔\n\nپہلا اعتراض: \"تقلید شرک ہے، یہ اللہ کے سوا کسی اور کی اطاعت ہے۔\"\n\nجواب: شرک تب ہے جب کسی کو حلال و حرام کا خود مختار مقرر کرنے والا مان لیا جائے۔ مقلد امام کو شارع نہیں مانتا، بلکہ قرآن و حدیث کا ترجمان سمجھتا ہے اور ان کی تحقیق پر اس لیے اعتماد کرتا ہے کہ وہ علم رکھتے ہیں۔ قرآن کا حکم ہے:\n\n﴿ وَمَآ أَرْسَلْنَا مِن قَبْلِكَ إِلَّا رِجَالًا نُّوحِىٓ إِلَيْهِمْ فَسْـَٔلُوٓا۟ أَهْلَ ٱلذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ ﴾\n(سورۃ النحل، آیت ۴۳)\n\nقرآن میں اہلِ کتاب کے بارے میں جو فرمایا گیا کہ انہوں نے اپنے علماء اور راہبوں کو رب بنا لیا (التوبہ ۳۱)، حدیث کے مطابق اس کی تفسیر یہ ہے کہ وہ ان کے حلال کیے کو حلال اور حرام کیے کو حرام مان لیتے تھے، چاہے وہ اللہ کے حکم کے خلاف ہوتا (جامع ترمذی)۔ ائمہ مجتہدین کی تقلید اس سے بالکل مختلف ہے، کیونکہ ان کی ہر رائے قرآن و سنت سے مستنبط ہے۔\n\nدوسرا اعتراض: \"صحابہ کرامؓ کے زمانے میں تقلید نہیں تھی۔\"\n\nجواب: صحابہؓ میں مجتہد بھی تھے (جیسے حضرت عمرؓ، عبداللہ بن مسعودؓ، عبداللہ بن عباسؓ) اور عام لوگ بھی تھے۔ عام لوگ مسئلہ معلوم کرنے کے لیے ان سے پوچھتے اور ان کے فتووں پر عمل کرتے تھے۔ یہی طریقہ بعد کے فقہاء نے اصول کی شکل میں مرتب کیا۔ اسی لیے آج بھی ہر آدمی اپنے علاقے کے مستند عالم یا مفتی سے پوچھ کر عمل کرتا ہے۔\n\nتیسرا اعتراض: \"امام ابوحنیفہؒ اور دوسرے ائمہ نے خود کہا تھا کہ صحیح حدیث میرا مذہب ہے۔\"\n\nجواب: بالکل درست ہے، یہ ائمہ کی عاجزی اور ان کے اصول کا ثبوت ہے۔ مگر یہ بات اس شخص کے لیے ہے جو صحیح، ضعیف، ناسخ و منسوخ اور خاص و عام میں فرق کر سکے۔ عام آدمی کے لیے یہ ممکن نہیں کہ وہ ہر حدیث کو خود جانچ کر عمل کرے۔ اور ائمہ نے ہر مسئلے میں دلائل کو سامنے رکھ کر ہی فیصلہ کیا۔\n\nچوتھا اعتراض: \"چار مذاہب کیوں ہیں؟ حق تو ایک ہوتا ہے۔\"\n\nجواب: اختلاف صحابہؓ کے زمانے سے ہے اور اس کی وجہ دلیل کی مختلف تعبیر ہے، نیت کا فرق نہیں۔ غزوۂ احزاب کے بعد نبی ﷺ نے فرمایا: \"کوئی عصر کی نماز بنو قریظہ پہنچ کر ہی پڑھے\" (صحیح بخاری و مسلم)۔ بعض صحابہ نے راستے میں وقت ختم ہونے کے خوف سے نماز پڑھ لی اور بعض نے حکم کے ظاہر پر عمل کر کے بنو قریظہ پہنچ کر پڑھی۔ نبی ﷺ نے کسی پر ناراضی ظاہر نہیں کی۔ اسی طرح ائمہ کا فروعی اختلاف دلیل کی سمجھ کا اختلاف ہے اور چاروں مذاہب حق پر ہیں۔\n\nنتیجہ: ایک مستند فقہ کی پیروی اپنانا، دوسرے ائمہ کا ادب رکھنا اور اختلاف کو جھگڑے کا ذریعہ نہ بنانا اہلِ سنت کا مزاج ہے۔ ایک ہی مسئلے میں اپنی آسانی کے لیے مختلف مذاہب سے سہولتیں چننا درست نہیں، اس لیے اپنے مستند عالم سے رہنمائی لیتے رہیں۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-ghalat-fahmiyan","v":2,"title":"علمائے دیوبند کے بارے میں عام غلط فہمیاں","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"دارالعلوم دیوبند 1866ء میں مولانا محمد قاسم نانوتویؒ اور ان کے ساتھیوں نے قائم کیا۔ حاجی امداداللہ مہاجر مکیؒ کی دعاؤں اور رہنمائی میں مولانا رشید احمد گنگوہیؒ، مولانا اشرف علی تھانویؒ، شیخ الہند مولانا محمود حسنؒ اور بہت سے علماء نے علمِ دین اور اصلاحِ باطن کی خدمت کی۔ ان کے متعلق چند غلط فہمیاں عام ہیں، ان کا خلاصہ اور وضاحت یہاں ہے۔\n\nپہلی غلط فہمی: \"علمائے دیوبند وہابی ہیں۔\"\n\nوضاحت: علمائے دیوبند فقہ میں عموماً امام ابوحنیفہؒ کے مقلد، عقائد میں اشعری و ماتریدی، اور تزکیہ میں چشتی، نقشبندی، قادری، سہروردی سلسلوں سے وابستہ رہے ہیں۔ یہ طریقہ نجد کی تحریک سے الگ ہے۔ اس بارے میں انہوں نے خود اپنے عقائد کی وضاحت میں مولانا خلیل احمد سہارنپوریؒ کی کتاب \"المہند علی المفند\" لکھی، جس پر مکہ اور مدینہ کے علماء کی تصدیقات بھی ہیں۔\n\nدوسری غلط فہمی: \"یہ تصوف اور اولیاء کے منکر ہیں۔\"\n\nوضاحت: یہ بات حقیقت کے خلاف ہے۔ دیوبند کے بڑے علماء خود صوفیائے کرام کے سلسلوں سے وابستہ اور شیخِ طریقت رہے ہیں۔ وہ تصوف کو شریعت کے تابع تزکیۂ نفس اور احسان مانتے ہیں اور بزرگانِ دین کا ادب کرتے ہیں، البتہ ایسی رسومات اور عقائد سے بچتے ہیں جن کی اصل قرآن و سنت میں نہیں۔\n\nتیسری غلط فہمی: \"یہ نبی ﷺ کی محبت اور ادب میں کمی کرتے ہیں۔\"\n\nوضاحت: نبی ﷺ کی محبت ایمان کی بنیاد ہے اور اس میں کسی مسلک کا اختلاف نہیں۔ اختلاف ان طریقوں میں ہے جن سے محبت ظاہر کی جاتی ہے۔ علمائے دیوبند کا اصول ہے کہ محبت کا اصل اظہار اتباعِ سنت اور کثرتِ درود ہے، اور وہ عبادت کے نئے طریقے نکالنے سے منع کرتے ہیں۔ سیرتِ رسول ﷺ کا بیان، درود اور آپ ﷺ کی سنتوں کی ترویج ان کے ہاں سال بھر ہوتی ہے۔\n\nچوتھی غلط فہمی: \"ان کا دوسرے مسلمانوں سے تعلق نہیں۔\"\n\nوضاحت: اہلِ سنت کا اصول یہ ہے کہ کلمہ گو مسلمان کو کافر نہ کہا جائے جب تک وہ ضروریاتِ دین میں سے کسی چیز کا انکار نہ کرے۔ اختلافی مسائل میں علمی دلائل اور ادب کے ساتھ بات ہونی چاہیے، طعن اور تکفیر سے نہیں۔\n\nنصیحت: کسی جماعت کے بارے میں سنی سنائی بات پر نہیں بلکہ ان کی اپنی معتبر کتابوں اور مستند اہلِ علم کی وضاحت پر اعتبار کریں۔ قرآن کا حکم ہے: ﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍ فَتَبَيَّنُوٓا۟ ﴾ (الحجرات ۶)۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-isaal-sawab","v":2,"title":"ایصالِ ثواب: دلائل اور رسومات کا فرق","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"ایصالِ ثواب کا مطلب ہے کسی نیک عمل کا ثواب مرحومین یا زندہ مسلمانوں کو پہنچانے کی نیت کرنا۔ اہلِ سنت والجماعت کے نزدیک یہ جائز اور مفید ہے، اور اس کے دلائل صحیح احادیث میں موجود ہیں۔\n\nایک صحابی نے نبی ﷺ سے عرض کیا: میری ماں اچانک فوت ہو گئی، میرا خیال ہے کہ اگر بولنے کا موقع ملتا تو صدقہ کرتیں۔ اگر میں ان کی طرف سے صدقہ کروں تو کیا انہیں ثواب ملے گا؟ آپ ﷺ نے فرمایا: \"ہاں\" (صحیح بخاری و مسلم)۔\n\nقرآن نے مومنوں کی دعا یوں بیان کی ہے:\n\n﴿ وَٱلَّذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌ رَّحِيمٌ ﴾\n(سورۃ الحشر، آیت ۱۰ (ایک حصہ))\n\nاس لیے مرحومین کے لیے دعا، استغفار، صدقہ، قرآن کی تلاوت، نفل نماز اور روزہ کا ثواب پہنچانا علماء کے نزدیک درست ہے۔ نبی ﷺ نے فرمایا کہ انسان کے مرنے کے بعد اس کا عمل ختم ہو جاتا ہے مگر تین چیزیں: صدقۂ جاریہ، نافع علم اور نیک اولاد کی دعا (صحیح مسلم)۔\n\nرسومات اور اصل میں فرق: ایصالِ ثواب بذاتِ خود ایک مشروع عمل ہے، مگر اس کے ساتھ جو رسومات جوڑ دی گئی ہیں (جیسے کسی خاص دن کو ضروری سمجھنا، دعوتوں کا دباؤ، یا اس میں فخر و نمود) وہ شریعت کا حکم نہیں۔ حدیث میں تو یہ آیا ہے کہ جب حضرت جعفرؓ کی شہادت ہوئی تو نبی ﷺ نے فرمایا: \"جعفر کے گھر والوں کے لیے کھانا تیار کرو، ان پر ایسی مصیبت آئی ہے جس نے انہیں مصروف کر دیا ہے\" (سنن ابوداؤد، جامع ترمذی)۔ یعنی اہلِ میت کی مدد کرنے کا حکم ہے، ان پر دعوت کا بوجھ ڈالنے کا نہیں۔\n\nاس لیے علمائے دیوبند اور اہلِ سنت کا طریقہ یہ ہے کہ ایصالِ ثواب خاموشی، اخلاص اور بغیر کسی خاص دن یا شرط کے کیا جائے۔ اس میں قرض اور رسم سے بچتے ہوئے غریبوں کو کھانا کھلانا، قرآن پڑھنا اور دعا کرنا شامل ہو سکتا ہے۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-taraweeh","v":2,"title":"تراویح: بیس رکعات اور اعتراض کا جواب","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"رمضان کی راتوں میں نماز تراویح سنتِ مؤکدہ ہے۔ نبی ﷺ نے فرمایا: \"جو رمضان میں ایمان اور ثواب کی نیت سے قیام کرے اس کے پچھلے گناہ معاف کر دیے جاتے ہیں\" (صحیح بخاری و مسلم)۔\n\nام المومنین حضرت عائشہؓ سے روایت ہے کہ نبی ﷺ نے ایک رات مسجد میں نماز پڑھی تو لوگ بھی پیچھے کھڑے ہو گئے، اگلی راتوں میں تعداد بڑھ گئی، پھر آپ ﷺ نہ نکلے اور فرمایا کہ مجھے ڈر ہوا کہ یہ تم پر فرض نہ کر دی جائے (صحیح بخاری و مسلم)۔ بعد میں حضرت عمرؓ نے لوگوں کو ایک امام (حضرت ابی بن کعبؓ) کے پیچھے جمع کر دیا (صحیح بخاری)۔\n\nتراویح کی رکعات کے بارے میں فقہاء کا مشہور موقف: حنفی، شافعی اور حنبلی فقہاء کے نزدیک بیس رکعات تراویح ہیں، اور مالکی مذہب میں بھی بیس سے زائد کا عمل رہا ہے۔ مکہ اور مدینہ کی مساجد میں بھی بیس رکعات پڑھائی جاتی ہیں۔ علمائے احناف بیس رکعات کا ثبوت صحابہؓ کے عمل اور خلفائے راشدین کے دور کی روایات سے دیتے ہیں۔\n\nاعتراض: \"ام المومنین حضرت عائشہؓ کی حدیث میں رمضان اور غیر رمضان میں گیارہ رکعات سے زیادہ نہیں ہیں، پھر بیس کیسے؟\"\n\nجواب: علماء کی ایک بڑی جماعت کے نزدیک اس حدیث کا تعلق نبی ﷺ کی رات کی نماز (تہجد اور وتر) سے ہے، جو رمضان اور غیر رمضان دونوں میں ایک ہی تھی۔ تراویح جماعت کے ساتھ رمضان کی خاص نماز ہے، جس کی شکل حضرت عمرؓ کے زمانے میں مقرر ہوئی۔ اہلِ علم میں جو لوگ آٹھ رکعات کے قائل ہیں وہ بھی دلیل کی بنا پر یہ کہتے ہیں، اس لیے ایک دوسرے پر طعن یا بدگمانی سے بچنا ضروری ہے۔\n\nاہم باتیں: تراویح کا وقت عشاء کی نماز کے بعد اور وتر سے پہلے ہے۔ پورے مہینے میں ایک بار قرآن مجید سنا جانا مسنون ہے۔ خواتین کے لیے مسئلہ یہ ہے کہ وہ گھر میں اکیلی پڑھ لیں، یا گھر کی جماعت کے ساتھ۔ اور تراویح میں نیت اور خشوع ضروری ہے، صرف تیز پڑھ کر ختم کرنے سے اس کا مقصد پورا نہیں ہوتا۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-namaz-masail","v":2,"title":"نماز کی شرائط، فرائض اور واجبات (فقہ حنفی)","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نبی ﷺ نے فرمایا: \"نماز اس طرح پڑھو جیسے مجھے پڑھتے دیکھتے ہو\" (صحیح بخاری)۔ نماز کے مسائل سیکھنا ہر مسلمان مرد اور عورت پر ضروری ہے۔ یہاں فقہ حنفی کی روشنی میں بنیادی باتیں آسان انداز میں لکھی گئی ہیں۔\n\nنماز کی شرائط (نماز سے پہلے لازم): (۱) طہارت یعنی بدن، کپڑے اور جگہ کا پاک ہونا اور وضو یا غسل۔ (۲) ستر کا چھپانا، عورت کے لیے چہرہ، دونوں ہاتھ اور پاؤں کے علاوہ پورا بدن۔ (۳) قبلہ رخ ہونا۔ (۴) وقت کا ہونا۔ (۵) نیت۔ (۶) تکبیرِ تحریمہ یعنی \"اللہ اکبر\" سے نماز شروع کرنا۔ بعض کتب میں تکبیرِ تحریمہ کو فرائض میں شمار کیا جاتا ہے۔\n\nنماز کے فرائض (نماز کے اندر لازم): (۱) قیام یعنی کھڑے ہونا۔ (۲) قراءت یعنی قرآن کا کچھ حصہ پڑھنا۔ (۳) رکوع۔ (۴) سجدہ۔ (۵) قعدۂ اخیرہ یعنی آخری رکعت میں تشہد کی مقدار بیٹھنا۔ (۶) اپنے عمل سے نماز سے نکلنا۔ اگر ان میں سے کوئی فرض چھوٹ جائے تو نماز نہیں ہوتی۔\n\nنماز کے واجبات (مثلاً): سورۃ الفاتحہ پڑھنا، فرض کی پہلی دو رکعتوں میں سورت یا آیات ملانا، رکوع و سجدے اور قومہ و جلسہ میں اطمینان، قعدۂ اولیٰ، تشہد، اور سلام کہنا۔ واجب چھوٹ جائے تو عموماً سجدۂ سہو لازم ہوتا ہے۔\n\nخواتین کی نماز کا فرق: فقہ حنفی کے مطابق عورتیں سینے پر ہاتھ باندھتی ہیں، رکوع و سجدے میں سمٹ کر رہتی ہیں اور اونچی آواز سے قراءت نہیں کرتیں۔ نبی ﷺ نے فرمایا: \"عورت کی نماز اس کے گھر میں اس کی کوٹھری میں زیادہ افضل ہے\" (سنن ابوداؤد)۔\n\nنماز کی اہمیت پر قرآن کا حکم ہے: ﴿ حَٰفِظُوا۟ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلْوُسْطَىٰ وَقُومُوا۟ لِلَّهِ قَٰنِتِينَ ﴾ (البقرہ ۲۳۸)۔ اس لیے پانچوں نمازوں کو وقت پر اور اطمینان سے ادا کریں۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-haiz-nifas","v":2,"title":"خواتین کے لیے حیض، نفاس اور استحاضہ کے بنیادی مسائل","cat":"خواتین","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"ہر لڑکی اور خاتون کو ان مسائل کا بنیادی علم ہونا چاہیے، کیونکہ نماز، روزہ اور دوسری عبادات ان سے متعلق ہیں۔ اللہ تعالیٰ نے یہ مسئلہ قرآن میں بھی بیان کیا ہے:\n\n﴿ وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ قُلْ هُوَ أَذًى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى ٱلْمَحِيضِ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ ٱللَّهُ إِنَّ ٱللَّهَ يُحِبُّ ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ ﴾\n(سورۃ البقرہ، آیت ۲۲۲)\n\nحیض: بلوغت کے بعد عورت کو ہر مہینے ایک مخصوص خون آتا ہے۔ فقہ حنفی میں حیض کی کم سے کم مدت تین دن اور تین راتیں اور زیادہ سے زیادہ دس دن اور دس راتیں ہے۔ اس سے کم یا زیادہ آنے والا خون استحاضہ (بیماری کا خون) شمار ہو سکتا ہے۔\n\nحیض کے دوران احکام: (۱) نماز معاف ہے، اس کی قضا نہیں۔ (۲) روزہ نہیں رکھا جاتا مگر بعد میں اس کی قضا کی جاتی ہے۔ حضرت عائشہؓ فرماتی ہیں کہ ہمیں روزوں کی قضا کا حکم دیا جاتا تھا اور نماز کی قضا کا حکم نہیں دیا جاتا تھا (صحیح بخاری و مسلم)۔ (۳) مسجد میں داخل ہونا، طواف، اور قرآن کی تلاوت جائز نہیں (حنفی فقہ کے مطابق)۔ دعائیں، اذکار، درود اور استغفار جائز ہیں۔ (۴) میاں بیوی کا ازدواجی تعلق جائز نہیں۔\n\nنفاس: بچے کی پیدائش کے بعد جو خون آتا ہے اسے نفاس کہتے ہیں، اس کی زیادہ سے زیادہ مدت چالیس دن ہے۔ اس میں بھی نماز، روزہ اور باقی احکام حیض کی طرح ہیں۔\n\nاستحاضہ: وہ خون جو حیض اور نفاس کے علاوہ کسی بیماری سے آئے۔ اس میں نماز معاف نہیں، عورت ہر نماز کے وقت نیا وضو کرے اور نماز ادا کرے۔ ایک صحابیہ حضرت فاطمہ بنت ابی حبیشؓ نے نبی ﷺ سے اس بارے میں پوچھا تو آپ ﷺ نے فرمایا کہ یہ رگ کا خون ہے، حیض نہیں، اس لیے حیض کے دنوں میں نماز چھوڑو اور بعد میں غسل کر کے نماز پڑھو (صحیح بخاری)۔\n\nعملی بات: اپنی عادت کے دن اور تاریخیں یاد رکھیں، اور ماں، بڑی بہن یا کسی دیندار عالمہ سے مسئلے پوچھتی رہیں۔ شرم کی وجہ سے دین کے مسائل میں خاموشی نہ رکھیں۔ انصار کی عورتوں کے بارے میں حضرت عائشہؓ نے فرمایا: \"انصار کی عورتیں کتنی اچھی ہیں، حیا انہیں دین میں سمجھ حاصل کرنے سے نہیں روکتی\" (صحیح مسلم)۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-wirasat","v":2,"title":"وراثت میں عورت کا حق","cat":"خواتین","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اسلام نے عورت کو بیٹی، ماں، بیوی اور بہن ہر حیثیت میں وراثت کا حق دیا ہے۔ ہمارے معاشرے میں بعض جگہ بہنوں اور بیٹیوں کو حصہ نہیں دیا جاتا، حالانکہ یہ اللہ کا مقرر کردہ فرض ہے۔\n\n﴿ لِّلرِّجَالِ نَصِيبٌ مِّمَّا تَرَكَ ٱلْوَٰلِدَانِ وَٱلْأَقْرَبُونَ وَلِلنِّسَآءِ نَصِيبٌ مِّمَّا تَرَكَ ٱلْوَٰلِدَانِ وَٱلْأَقْرَبُونَ مِمَّا قَلَّ مِنْهُ أَوْ كَثُرَ نَصِيبًا مَّفْرُوضًا ﴾\n(سورۃ النساء، آیت ۷)\n\nمفہوم: مردوں کے لیے اس مال میں حصہ ہے جو والدین اور رشتہ دار چھوڑ جائیں، اور عورتوں کے لیے بھی حصہ ہے، چاہے ترکہ تھوڑا ہو یا زیادہ، یہ طے شدہ حصہ ہے۔\n\nسورۃ النساء میں مختلف رشتہ داروں کے حصے بیان ہوئے ہیں۔ چند بنیادی اصول: (۱) اولاد میں لڑکے کا حصہ دو لڑکیوں کے برابر ہوتا ہے (النساء ۱۱)۔ (۲) اگر ایک ہی بیٹی ہو تو اسے آدھا ملتا ہے۔ (۳) میت کی اولاد ہو تو ماں باپ میں سے ہر ایک کو چھٹا حصہ۔ (۴) بیوی کو اولاد نہ ہونے پر چوتھائی اور اولاد ہونے پر آٹھواں حصہ، اور شوہر کو اولاد نہ ہونے پر آدھا اور ہونے پر چوتھائی۔ ان حصوں کے علاوہ وصیت اور قرض پہلے ادا کیے جاتے ہیں۔\n\nان حدود کے بارے میں قرآن کی تنبیہ یہ ہے:\n\n﴿ تِلْكَ حُدُودُ ٱللَّهِ وَمَن يُطِعِ ٱللَّهَ وَرَسُولَهُۥ يُدْخِلْهُ جَنَّٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَا وَذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ وَمَن يَعْصِ ٱللَّهَ وَرَسُولَهُۥ وَيَتَعَدَّ حُدُودَهُۥ يُدْخِلْهُ نَارًا خَٰلِدًا فِيهَا وَلَهُۥ عَذَابٌ مُّهِينٌ ﴾\n(سورۃ النساء، آیات ۱۳ تا ۱۴)\n\nمفہوم: یہ اللہ کی حدود ہیں؛ جو اللہ اور رسول کی اطاعت کرے وہ جنت میں جائے گا، اور جو نافرمانی کرے اور حدوں سے بڑھ جائے اسے آگ میں ڈالا جائے گا۔ اس لیے بہنوں اور بیٹیوں کا حق دبانا یا \"حق بخشوانا\" کی رسم کے ذریعے دباؤ ڈالنا بڑا گناہ ہے۔\n\nعملی بات: والدین کی زندگی میں ہبہ کرنا یا بعد میں جائیداد تقسیم کرنے میں کسی مستند مفتی سے حصے نکلوائیں، اور بیٹیوں اور بہنوں کو ان کا حصہ خوش دلی سے دیں۔ یہ دین کا حکم بھی ہے اور عدل بھی۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-sood-halal","v":2,"title":"سود کی حرمت اور حلال کمائی","cat":"اخلاق","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اسلام میں رزق حلال کمانا عبادت کا درجہ رکھتا ہے، اور حرام کمائی سے بچنا ایمان کا تقاضا ہے۔ قرآن نے سود کو سختی سے حرام قرار دیا ہے:\n\n﴿ ٱلَّذِينَ يَأْكُلُونَ ٱلرِّبَوٰا۟ لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ ٱلَّذِى يَتَخَبَّطُهُ ٱلشَّيْطَٰنُ مِنَ ٱلْمَسِّ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓا۟ إِنَّمَا ٱلْبَيْعُ مِثْلُ ٱلرِّبَوٰا۟ وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ وَحَرَّمَ ٱلرِّبَوٰا۟ فَمَن جَآءَهُۥ مَوْعِظَةٌ مِّن رَّبِّهِۦ فَٱنتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى ٱللَّهِ وَمَنْ عَادَ فَأُو۟لَٰٓئِكَ ﴾ (البقرہ ۲۷۵)\n\nمفہوم: اللہ نے تجارت کو حلال کیا اور سود کو حرام کیا۔ دوسری جگہ سود کو ترک کرنے کا حکم دیتے ہوئے فرمایا کہ اگر ایسا نہ کرو تو اللہ اور اس کے رسول سے جنگ کے لیے تیار ہو جاؤ (البقرہ ۲۷۸ تا ۲۷۹)۔\n\nنبی ﷺ نے سود کھانے والے، کھلانے والے، لکھنے والے اور اس کے گواہوں پر لعنت فرمائی اور فرمایا کہ یہ سب برابر ہیں (صحیح مسلم)۔ اس لیے سود لینا بھی حرام ہے اور دینا بھی۔\n\nحلال کی اہمیت: نبی ﷺ نے فرمایا: \"اے لوگو! اللہ پاک ہے اور پاک چیز ہی کو قبول کرتا ہے\" (صحیح مسلم)۔ پھر آپ ﷺ نے ایک ایسے شخص کا ذکر کیا جو لمبا سفر کرتا ہے، بال بکھرے ہوئے ہیں، ہاتھ آسمان کی طرف اٹھا کر \"یا رب یا رب\" کہتا ہے، مگر اس کا کھانا، پینا اور لباس حرام کا ہے، تو اس کی دعا کیسے قبول ہو؟ (صحیح مسلم)۔\n\nعملی بات: (۱) کمائی کے ذریعے کا حلال ہونا یقینی بنائیں۔ (۲) قرض، لین دین اور تجارت میں سود، دھوکے اور جھوٹ سے بچیں۔ (۳) بینک اور مالیاتی معاملات میں شرعی رہنمائی کے لیے مستند مفتی یا اسلامی بینکاری کے ماہر علماء سے پوچھیں۔ (۴) جو آمدنی مشتبہ ہو اس کے بارے میں علماء سے مسئلہ معلوم کریں۔\n\nنوٹ: مسائل میں اپنی صورتِ حال کے مطابق تفصیل کے لیے کسی مستند مفتی یا عالمِ دین سے رجوع کریں۔"},{"id":"a-durood","v":2,"title":"درود شریف کی فضیلت اور طریقہ","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"درود شریف ایسا عمل ہے جس کا اللہ تعالیٰ نے خود حکم دیا اور اسے اپنی اور فرشتوں کی سنت بتایا:\n\n﴿ إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا ﴾\n(سورۃ الاحزاب، آیت ۵۶)\n\nمفہوم: بے شک اللہ اور اس کے فرشتے نبی پر درود بھیجتے ہیں، اے ایمان والو! تم بھی ان پر درود اور خوب سلام بھیجو۔ نبی ﷺ نے فرمایا: \"جو مجھ پر ایک بار درود بھیجے اللہ اس پر دس رحمتیں نازل کرتا ہے\" (صحیح مسلم)۔\n\nایک اور حدیث میں ہے: \"بخیل وہ ہے جس کے سامنے میرا ذکر ہو اور وہ مجھ پر درود نہ بھیجے\" (جامع ترمذی)۔ اور جمعہ کے دن کثرت سے درود بھیجنے کی تاکید ہے (سنن ابوداؤد)۔\n\nدرودِ ابراہیمی جو نماز میں پڑھا جاتا ہے وہی سب سے افضل درود ہے، جو نبی ﷺ نے صحابہؓ کو خود سکھایا (صحیح بخاری و مسلم): \"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ\"۔\n\nعملی بات: روزانہ کچھ وقت درود شریف کے لیے مقرر کر لیں، مثلاً صبح و شام سو بار۔ جمعہ کے دن زیادہ پڑھیں، اور نبی ﷺ کا نام آئے تو \"صلی اللہ علیہ وسلم\" ضرور کہیں۔ درود ایسے الفاظ میں پڑھیں جو حدیث سے ثابت ہوں یا کسی مستند عالم نے بتائے ہوں۔"},{"id":"a-ilm-fazilat","v":2,"title":"علم کی فضیلت اور طالبِ علم کے آداب","cat":"اخلاق","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اسلام کی پہلی وحی \"اقرأ\" یعنی پڑھ تھی۔ قرآن نے علم والوں کی فضیلت یوں بیان کی ہے:\n\n﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا قِيلَ لَكُمْ تَفَسَّحُوا۟ فِى ٱلْمَجَٰلِسِ فَٱفْسَحُوا۟ يَفْسَحِ ٱللَّهُ لَكُمْ وَإِذَا قِيلَ ٱنشُزُوا۟ فَٱنشُزُوا۟ يَرْفَعِ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ مِنكُمْ وَٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ دَرَجَٰتٍ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ ﴾\n(سورۃ المجادلہ، آیت ۱۱ (ایک حصہ))\n\nمفہوم: اللہ ان لوگوں کے درجات بلند کرتا ہے جو ایمان لائے اور جنہیں علم دیا گیا۔ اور فرمایا: \"کہہ دیجیے کیا علم والے اور بے علم برابر ہو سکتے ہیں؟\" (الزمر ۹)۔ اور نبی ﷺ کو یہ دعا سکھائی گئی: ﴿ مِن قَبْلِ أَن يُقْضَىٰٓ ﴾ (طہٰ ۱۱۴)، یعنی اے میرے رب! میرا علم بڑھا۔\n\nنبی ﷺ نے فرمایا: \"جو شخص علم کی تلاش میں کوئی راستہ چلے اللہ اس کے لیے جنت کا راستہ آسان کر دیتا ہے\" (صحیح مسلم)۔ اور فرمایا: \"علم حاصل کرنا ہر مسلمان پر فرض ہے\" (سنن ابن ماجہ)۔ اس میں مرد اور عورت دونوں شامل ہیں۔\n\nطالبِ علم کے آداب: (۱) نیت صرف اللہ کی رضا ہو، دکھاوے یا فخر کے لیے نہیں۔ (۲) استاد کا ادب کرے، کیونکہ استاد دین کا سبق دینے والا ہے۔ (۳) جو سیکھے اس پر عمل کرے اور دوسروں تک پہنچائے۔ (۴) سوال پوچھنے میں شرم نہ کرے اور اپنی کم علمی کا اعتراف کرے۔ (۵) مستند اساتذہ اور معتبر کتب سے علم حاصل کرے، انٹرنیٹ کی ہر بات پر آنکھ بند کر کے اعتماد نہ کرے۔ (۶) علم کے ساتھ تواضع اور عاجزی رکھے۔\n\nعملی بات: روزانہ ایک نئی دینی بات سیکھنے کی عادت بنائیں، جیسے ہماری ویب سائٹ کا ایک سبق، ایک حدیث یا ایک مضمون۔"},{"id":"a-gussa-takabbur","v":2,"title":"غصہ، تکبر اور عاجزی","cat":"اخلاق","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"غصہ اور تکبر دل کی بڑی بیماریاں ہیں جن سے آدمی کے اخلاق خراب ہو جاتے ہیں۔ قرآن نے جنت والوں کی صفت یہ بتائی:\n\n﴿ ٱلَّذِينَ يُنفِقُونَ فِى ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلْكَٰظِمِينَ ٱلْغَيْظَ وَٱلْعَافِينَ عَنِ ٱلنَّاسِ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ ﴾\n(سورۃ آل عمران، آیت ۱۳۴)\n\nمفہوم: جو خوشحالی اور تنگی میں خرچ کرتے ہیں، غصے کو پی جاتے ہیں اور لوگوں کو معاف کر دیتے ہیں، اور اللہ نیکی کرنے والوں سے محبت کرتا ہے۔\n\nنبی ﷺ نے فرمایا: \"پہلوان وہ نہیں جو لوگوں کو پچھاڑ دے، بلکہ پہلوان وہ ہے جو غصے کے وقت اپنے آپ پر قابو رکھے\" (صحیح بخاری و مسلم)۔ ایک شخص نے نصیحت مانگی تو آپ ﷺ نے بار بار فرمایا: \"غصہ نہ کرو\" (صحیح بخاری)۔ غصے کے علاج: وضو کرنا، بیٹھ جانا یا لیٹ جانا، \"اعوذ باللہ\" پڑھنا، اور خاموش ہو جانا۔\n\nتکبر کے بارے میں فرمایا: \"وہ شخص جنت میں نہیں جائے گا جس کے دل میں ذرہ برابر تکبر ہو\" (صحیح مسلم)۔ ایک صحابی نے پوچھا کہ آدمی چاہتا ہے کہ اس کا لباس اور جوتا اچھا ہو، کیا یہ تکبر ہے؟ فرمایا: \"اللہ خوبصورت ہے اور خوبصورتی کو پسند کرتا ہے، تکبر تو حق کا انکار کرنا اور لوگوں کو حقیر سمجھنا ہے\" (صحیح مسلم)۔\n\nعاجزی کے بارے میں رحمٰن کے بندوں کی پہچان یہ بتائی گئی: ﴿ وَعِبَادُ ٱلرَّحْمَٰنِ ٱلَّذِينَ يَمْشُونَ عَلَى ٱلْأَرْضِ هَوْنًا وَإِذَا ﴾ (الفرقان ۶۳)، یعنی وہ زمین پر نرمی اور عاجزی سے چلتے ہیں۔ عملی بات: اپنے آپ کو دوسروں سے بہتر نہ سمجھیں، اپنی غلطی ماننے میں دیر نہ کریں، اور غصے میں کوئی فیصلہ نہ کریں۔"},{"id":"a-silah-rahmi-padosi","v":2,"title":"پڑوسی اور رشتہ داروں کے حقوق","cat":"گھر اور خاندان","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اسلام نے ہر رشتے کے حقوق متعین کیے ہیں۔ قرآن کا حکم ہے:\n\n﴿ وَٱعْبُدُوا۟ ٱللَّهَ وَلَا تُشْرِكُوا۟ بِهِۦ شَيْـًٔا وَبِٱلْوَٰلِدَيْنِ إِحْسَٰنًا وَبِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱلْجَارِ ذِى ٱلْقُرْبَىٰ وَٱلْجَارِ ٱلْجُنُبِ وَٱلصَّاحِبِ بِٱلْجَنۢبِ وَٱبْنِ ٱلسَّبِيلِ وَمَا مَلَكَتْ أَيْمَٰنُكُمْ إِنَّ ٱللَّهَ لَا يُحِبُّ مَن كَانَ مُخْتَالًا فَخُورًا ﴾\n(سورۃ النساء، آیت ۳۶)\n\nمفہوم: اللہ کی عبادت کرو اور اس کے ساتھ کسی کو شریک نہ کرو، اور ماں باپ، رشتہ داروں، یتیموں، مسکینوں، رشتہ دار پڑوسی، اجنبی پڑوسی، ساتھ بیٹھنے والے، مسافر اور اپنے غلاموں کے ساتھ اچھا سلوک کرو۔\n\nنبی ﷺ نے فرمایا: \"جبرئیلؑ مجھے پڑوسی کے بارے میں اتنی وصیت کرتے رہے کہ مجھے گمان ہوا کہ وہ اسے وارث بنا دیں گے\" (صحیح بخاری و مسلم)۔ اور فرمایا: \"جو اللہ اور آخرت پر ایمان رکھتا ہے وہ اپنے پڑوسی کی عزت کرے\" اور \"اپنے رشتوں کو جوڑے\" (صحیح بخاری و مسلم)۔\n\nصلہ رحمی یعنی رشتہ داروں سے تعلق جوڑنا بڑی نیکی ہے، اور قطع رحمی بڑا گناہ۔ نبی ﷺ نے فرمایا: \"رشتہ توڑنے والا جنت میں داخل نہیں ہوگا\" (صحیح بخاری و مسلم)۔ اور فرمایا کہ رشتہ جوڑنے والا وہ نہیں جو بدلہ دے، بلکہ وہ ہے جو دوسرا توڑے تو بھی جوڑے (صحیح بخاری)۔\n\nعملی بات: پڑوسی کو سلام کریں، بیمار ہو تو عیادت کریں، کھانا پکے تو ہدیہ بھیجیں، اس کی چیز یا راز کا خیال رکھیں۔ رشتہ داروں سے ملتے رہیں، فون یا پیغام سے خیریت پوچھیں، اور ناراضی ہو تو پہل کر کے صلح کریں۔"},{"id":"a-ahle-bait","v":2,"title":"اہلِ بیتِ اطہار کا مقام","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نبی ﷺ کے گھر والے (اہلِ بیت) امت کے لیے محبت و عقیدت کا مرکز ہیں۔ قرآن میں فرمایا:\n\n﴿ وَقَرْنَ فِى بُيُوتِكُنَّ وَلَا تَبَرَّجْنَ تَبَرُّجَ ٱلْجَٰهِلِيَّةِ ٱلْأُولَىٰ وَأَقِمْنَ ٱلصَّلَوٰةَ وَءَاتِينَ ٱلزَّكَوٰةَ وَأَطِعْنَ ٱللَّهَ وَرَسُولَهُۥٓ إِنَّمَا يُرِيدُ ٱللَّهُ لِيُذْهِبَ عَنكُمُ ٱلرِّجْسَ أَهْلَ ٱلْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيرًا ﴾\n(سورۃ الاحزاب، آیت ۳۳)\n\nاس آیت میں ازواجِ مطہراتؓ سے خطاب ہے اور اہلِ بیت کی پاکیزگی کا بیان ہے۔ اہلِ سنت کے نزدیک ازواجِ مطہرات (امہات المومنین)، حضرت فاطمہؓ، حضرت علیؓ، اور حضرات حسنینؓ اہلِ بیت میں شامل ہیں۔\n\nنبی ﷺ نے فرمایا: \"میں تمہیں اپنے اہلِ بیت کے بارے میں اللہ کی یاد دلاتا ہوں\" (صحیح مسلم)۔ اور حضرت فاطمہؓ کے بارے میں فرمایا: \"فاطمہ میرے جسم کا ٹکڑا ہے\" (صحیح بخاری و مسلم)۔ حضرات حسن اور حسین رضی اللہ عنہما کے بارے میں فرمایا: \"وہ جنت کے نوجوانوں کے سردار ہیں\" (جامع ترمذی)۔\n\nاہلِ سنت والجماعت کا عقیدہ اعتدال پر ہے: وہ اہلِ بیت اور صحابہ کرام دونوں سے محبت رکھتے ہیں، کسی ایک کی محبت میں دوسرے کی توہین نہیں کرتے، اور اہلِ بیت میں سے کسی کو اللہ کی صفات کا حامل نہیں مانتے۔ علمائے دیوبند بھی اہلِ بیت سے ایسی ہی محبت رکھتے ہیں اور ان کے فضائل بیان کرتے ہیں۔\n\nعملی بات: اہلِ بیت کے نام آئیں تو ادب اور دعا کے الفاظ (\"رضی اللہ عنہ/عنہا\") کہیں، اور ان کی سیرت پڑھ کر ان کے اخلاق کو اپنائیں۔"},{"id":"a-dua-adab","v":2,"title":"دعا کے آداب اور قبولیت کے اسباب","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"دعا عبادت کا مغز اور بندے کی بندگی کا اظہار ہے۔ قرآن میں اللہ نے فرمایا:\n\n﴿ وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ فَلْيَسْتَجِيبُوا۟ لِى وَلْيُؤْمِنُوا۟ بِى لَعَلَّهُمْ يَرْشُدُونَ ﴾\n(سورۃ البقرہ، آیت ۱۸۶)\n\nاور فرمایا: ﴿ وَقَالَ رَبُّكُمُ ٱدْعُونِىٓ أَسْتَجِبْ لَكُمْ إِنَّ ٱلَّذِينَ يَسْتَكْبِرُونَ عَنْ ﴾ (غافر ۶۰)، یعنی مجھے پکارو، میں تمہاری دعا قبول کروں گا۔ نبی ﷺ نے فرمایا: \"دعا ہی عبادت ہے\" (جامع ترمذی، سنن ابوداؤد)۔\n\nقبولیت کے اسباب اور آداب: (۱) اللہ کی حمد اور نبی ﷺ پر درود سے آغاز کرنا۔ (۲) حلال کھانا اور حلال کمائی۔ (۳) قبولیت کا یقین رکھنا، نبی ﷺ نے فرمایا: \"اللہ سے دعا اس حال میں کرو کہ تمہیں قبولیت کا یقین ہو\" (جامع ترمذی)۔ (۴) خشوع اور عاجزی کے ساتھ مانگنا۔ (۵) ہاتھ اٹھا کر دعا کرنا۔ نبی ﷺ نے فرمایا: \"تمہارا رب حیا والا اور کریم ہے، جب بندہ ہاتھ اٹھاتا ہے تو اسے خالی لوٹانے سے حیا کرتا ہے\" (سنن ابوداؤد)۔\n\nجلدی نہ کریں: نبی ﷺ نے فرمایا: \"تم میں سے ہر ایک کی دعا قبول ہوتی ہے جب تک وہ جلدی نہ کرے، یہ کہہ کر کہ میں نے دعا کی مگر قبول نہیں ہوئی\" (صحیح بخاری و مسلم)۔ قبولیت کی تین صورتیں ہو سکتی ہیں: وہی چیز مل جائے، اس کے بدلے کوئی مصیبت ٹال دی جائے، یا آخرت میں اجر ذخیرہ ہو جائے۔\n\nدعا کے خاص اوقات: رات کا آخری حصہ، سجدے کی حالت، فرض نمازوں کے بعد، اذان و اقامت کے درمیان، جمعہ کے دن کی ایک گھڑی، اور بارش کے وقت۔ مسنون دعائیں \"اذکار و دعائیں\" سیکشن میں دیکھیں۔"},{"id":"a-jumuah","v":2,"title":"جمعہ کا دن: فضیلت اور آداب","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"جمعہ ہفتے کا افضل ترین دن ہے۔ نبی ﷺ نے فرمایا: \"بہترین دن جس پر سورج طلوع ہوتا ہے جمعہ کا دن ہے\" (صحیح مسلم)۔ قرآن میں اس کے احکام یوں آئے ہیں:\n\n﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نُودِىَ لِلصَّلَوٰةِ مِن يَوْمِ ٱلْجُمُعَةِ فَٱسْعَوْا۟ إِلَىٰ ذِكْرِ ٱللَّهِ وَذَرُوا۟ ٱلْبَيْعَ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ ﴾\n(سورۃ الجمعہ، آیت ۹)\n\nمفہوم: اے ایمان والو! جب جمعہ کے دن نماز کے لیے پکارا جائے تو اللہ کے ذکر کی طرف دوڑو اور خرید و فروخت چھوڑ دو۔ جمعہ کی نماز مردوں پر فرض ہے، اور عورتوں پر فرض نہیں، وہ ظہر کی نماز اپنے گھر میں پڑھتی ہیں۔\n\nجمعہ کے آداب: (۱) غسل کرنا (حدیث: صحیح بخاری و مسلم)۔ (۲) صاف ستھرا، بہتر لباس پہننا اور خوشبو لگانا۔ (۳) مسجد جلدی پہنچنا۔ (۴) خطبہ توجہ اور خاموشی سے سننا۔ (۵) درود کی کثرت (سنن ابوداؤد)۔ (۶) سورۃ الکہف کی تلاوت، جس کی فضیلت روایات میں آئی ہے۔ (۷) دعا کا خاص اہتمام، کیونکہ جمعہ میں ایک گھڑی ہے جس میں دعا قبول ہوتی ہے (صحیح بخاری و مسلم)۔\n\nخواتین کے لیے: جمعہ کا دن ان کے لیے بھی فضیلت کا دن ہے، وہ گھر میں ظہر کی نماز، سورۃ الکہف کی تلاوت، درود، صدقہ اور دعا کا اہتمام کر کے اس کی برکت حاصل کر سکتی ہیں۔"},{"id":"a-seerat-khulasa","v":2,"title":"سیرتِ طیبہ ﷺ کا مختصر خاکہ","cat":"سیرت","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نبی کریم ﷺ مکہ مکرمہ میں پیر کے دن، مشہور قول کے مطابق ربیع الاول میں، عام الفیل کے سال (تقریباً 570ء) پیدا ہوئے۔ آپ ﷺ کے والد حضرت عبداللہ آپ کی ولادت سے پہلے وفات پا چکے تھے، والدہ حضرت آمنہ آپ کے بچپن ہی میں فوت ہو گئیں، پھر دادا عبدالمطلب اور ان کے بعد چچا ابو طالب نے آپ کی پرورش کی۔\n\nجوانی میں آپ ﷺ \"صادق\" اور \"امین\" کے لقب سے مشہور تھے۔ پچیس سال کی عمر میں آپ نے حضرت خدیجہؓ سے نکاح کیا۔ چالیس سال کی عمر میں غارِ حرا میں پہلی وحی آئی:\n\n﴿ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ ﴾\n(سورۃ العلق، آیات ۱ تا ۵)\n\nتقریباً تیرہ سال مکہ میں دعوت و تبلیغ کی، جس میں آپ ﷺ اور صحابہؓ نے سخت تکلیفیں برداشت کیں۔ پھر مدینہ منورہ ہجرت ہوئی (622ء)۔ مدینہ میں اسلامی معاشرہ قائم ہوا، مسجدِ نبوی بنی اور مہاجرین و انصار کے درمیان بھائی چارہ ہوا۔\n\nاہم واقعات: غزوۂ بدر (۲ ہجری)، غزوۂ احد (۳ ہجری)، غزوۂ خندق (۵ ہجری)، صلحِ حدیبیہ (۶ ہجری)، فتحِ مکہ (۸ ہجری) اور حجۃ الوداع (۱۰ ہجری)۔ فتحِ مکہ کے موقع پر آپ ﷺ نے اپنے دشمنوں کو بھی معاف فرما دیا۔ آخر میں آپ ﷺ ربیع الاول ۱۱ ہجری میں تریسٹھ سال کی عمر میں اس دنیا سے پردہ فرما گئے۔\n\nآپ ﷺ کے اخلاق کے بارے میں قرآن نے گواہی دی: ﴿ وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ ﴾ (القلم ۴)، یعنی بے شک آپ بڑے اخلاق والے ہیں۔ ہماری ویب سائٹ کے \"واقعات\" سیکشن میں انبیاء اور صحابہ کے واقعات کے ساتھ سیرت کے اور واقعات بھی پڑھیں۔\n\nتنبیہ: تاریخوں کے بارے میں سیرت کی کتابوں میں اختلاف ہے، اس لیے مستند سیرت کی کتب سے تصدیق کریں۔"}],"quizzes":[{"id":"q-arkan","title":"ارکانِ اسلام","desc":"اسلام کی بنیادی باتوں کا آسان امتحان","qs":[{"q":"اسلام کے کتنے ارکان ہیں؟","opts":["تین","چار","پانچ","چھ"],"a":2,"why":"حدیثِ جبریل اور دیگر احادیث کے مطابق اسلام کی بنیاد پانچ چیزوں پر ہے: شہادتین، نماز، زکوٰۃ، روزہ اور حج۔"},{"q":"اسلام کا پہلا رکن کیا ہے؟","opts":["نماز","کلمۂ شہادت","زکوٰۃ","حج"],"a":1,"why":"اللہ کی وحدانیت اور محمد ﷺ کی رسالت کی گواہی اسلام کا پہلا رکن ہے۔"},{"q":"روزے کس مہینے میں فرض ہیں؟","opts":["محرم","شعبان","رمضان","ذوالحجہ"],"a":2,"why":"رمضان کے روزے ہر عاقل بالغ مسلمان پر فرض ہیں۔"},{"q":"عام طور پر قابلِ زکوٰۃ مال پر زکوٰۃ کی شرح کتنی ہے؟","opts":["ڈھائی فیصد","پانچ فیصد","دس فیصد","بیس فیصد"],"a":0,"why":"سونا، چاندی اور نقدی جیسے مال پر شرط پوری ہونے کی صورت میں ڈھائی فیصد (چالیسواں حصہ) زکوٰۃ فرض ہے۔"},{"q":"حج کن مہینوں میں ادا کیا جاتا ہے؟","opts":["رجب میں","ذوالحجہ کے ایام میں","ربیع الاول میں","صفر میں"],"a":1,"why":"حج کے مناسک ذوالحجہ کی مخصوص تاریخوں میں ادا ہوتے ہیں۔"}]},{"id":"q-quran","title":"قرآن کا تعارف","desc":"قرآن پاک کے بارے میں بنیادی معلومات","qs":[{"q":"قرآن پاک میں کل کتنی سورتیں ہیں؟","opts":["110","114","120","30"],"a":1,"why":"قرآن مجید میں کل 114 سورتیں ہیں۔"},{"q":"قرآن پاک کے کتنے پارے ہیں؟","opts":["20","25","30","40"],"a":2,"why":"قرآن کو تلاوت کی آسانی کے لیے 30 پاروں میں تقسیم کیا گیا ہے۔"},{"q":"قرآن کی سب سے طویل سورت کون سی ہے؟","opts":["البقرہ","آل عمران","النساء","الاعراف"],"a":0,"why":"سورۃ البقرہ قرآن کی سب سے بڑی سورت ہے۔"},{"q":"وحی کی ابتدا کن آیات سے ہوئی؟","opts":["سورۃ الفاتحہ","سورۃ العلق کی ابتدائی آیات","سورۃ البقرہ","سورۃ الناس"],"a":1,"why":"غارِ حرا میں سب سے پہلے سورۃ العلق کی ابتدائی آیات \"اقرأ باسم ربک\" نازل ہوئیں۔"},{"q":"کون سی سورت \"بسم اللہ\" کے بغیر شروع ہوتی ہے؟","opts":["سورۃ التوبہ","سورۃ الکوثر","سورۃ یٰس","سورۃ الاخلاص"],"a":0,"why":"سورۃ التوبہ کے شروع میں بسم اللہ نہیں لکھی جاتی۔"}]},{"id":"q-anbiya","title":"انبیاء کرام کے قصے","desc":"قرآنی قصوں پر مبنی سوالات","qs":[{"q":"سب سے پہلے نبی کون تھے؟","opts":["حضرت نوحؑ","حضرت آدمؑ","حضرت ابراہیمؑ","حضرت موسیٰؑ"],"a":1,"why":"حضرت آدمؑ پہلے انسان اور پہلے نبی تھے۔"},{"q":"کشتی کس نبی نے بنائی؟","opts":["حضرت نوحؑ","حضرت یونسؑ","حضرت یوسفؑ","حضرت ایوبؑ"],"a":0,"why":"حضرت نوحؑ نے اللہ کے حکم سے کشتی بنائی۔"},{"q":"کس نبی کو آگ نے نقصان نہیں پہنچایا؟","opts":["حضرت ابراہیمؑ","حضرت موسیٰؑ","حضرت عیسیٰؑ","حضرت داؤدؑ"],"a":0,"why":"اللہ کے حکم سے آگ حضرت ابراہیمؑ پر ٹھنڈی اور سلامتی والی ہو گئی۔"},{"q":"کس نبی کو مچھلی نے نگل لیا تھا؟","opts":["حضرت یونسؑ","حضرت ایوبؑ","حضرت یعقوبؑ","حضرت ہارونؑ"],"a":0,"why":"حضرت یونسؑ نے مچھلی کے پیٹ میں دعا کی اور اللہ نے انہیں نجات دی۔"},{"q":"کس نبی کے صبر کی مثال بیماری کی آزمائش میں دی جاتی ہے؟","opts":["حضرت ایوبؑ","حضرت سلیمانؑ","حضرت یحییٰؑ","حضرت ہودؑ"],"a":0,"why":"حضرت ایوبؑ نے طویل بیماری پر صبر کیا اور پھر شفا پائی۔"}]}],"qintro":{"1":"قرآن کی پہلی سورت، جسے ہر نماز کی ہر رکعت میں پڑھا جاتا ہے۔ یہ دراصل بندے کی طرف سے اللہ سے ہدایت کی دعا ہے۔","103":"تین آیات کی یہ مختصر سورت کامیابی کا پورا نقشہ دیتی ہے۔ امام شافعیؒ سے منقول ہے کہ اگر لوگ صرف اس سورت پر غور کر لیتے تو یہی ان کے لیے کافی ہوتی۔","105":"اس سورت میں ابرہہ کے لشکر کا واقعہ بیان ہوا ہے جو ہاتھیوں کے ساتھ کعبہ کو گرانے آیا تھا۔ مشہور قول کے مطابق یہ واقعہ نبی ﷺ کی ولادت کے سال پیش آیا۔","106":"اس سورت میں قریش کو یاد دلایا گیا ہے کہ ان کے سفر، رزق اور امن اللہ کی نعمتیں ہیں، اس لیے انہیں اسی کی عبادت کرنی چاہیے۔","108":"قرآن کی سب سے چھوٹی سورت۔ کوثر کا مطلب بے شمار خیر ہے، اور روایات میں جنت کی ایک نہر کو بھی کوثر کہا گیا ہے۔","109":"اس سورت میں عقیدے کے معاملے میں دو ٹوک اعلان ہے، اور ساتھ ہی یہ سبق ہے کہ ہر شخص اپنے دین کا خود ذمہ دار ہے۔","110":"یہ سورت اللہ کی مدد اور فتح کی خوشخبری دیتی ہے، اور کامیابی کے وقت تسبیح اور استغفار کا حکم دیتی ہے۔ یہ آخری نازل ہونے والی سورتوں میں سے ہے۔","112":"توحید کا خلاصہ۔ صحیح بخاری و مسلم کی روایت میں اسے ایک تہائی قرآن کے برابر فرمایا گیا ہے۔","113":"یہ اور اگلی سورت معوذتین کہلاتی ہیں، یعنی پناہ مانگنے والی سورتیں۔ صحیح بخاری کی روایت ہے کہ نبی ﷺ سونے سے پہلے ان کو پڑھ کر ہاتھوں پر دم کرتے اور جسم پر پھیرتے تھے۔","114":"قرآن کی آخری سورت۔ اس میں وسوسہ ڈالنے والے کے شر سے اللہ کی پناہ مانگی گئی ہے۔","2:255":"صحیح مسلم کی روایت کے مطابق یہ قرآن کی سب سے عظیم آیت ہے۔ اس میں اللہ کی توحید، علم، قدرت اور عظمت بیان ہوئی ہے۔"},"qnotes":{"1:1":"ہر اچھے کام کی ابتدا اللہ کے نام سے کرنے کی تعلیم۔","1:2":"حقیقی تعریف کا مستحق وہی ہے جو ہر مخلوق کو پیدا کرتا اور پالتا ہے۔","1:3":"اللہ کی رحمت ہر چیز پر چھائی ہوئی ہے، اور آخرت میں خاص طور پر ایمان والوں کے لیے ہے۔","1:4":"قیامت کے دن حساب اور بدلے کا پورا اختیار صرف اللہ کے پاس ہے۔","1:5":"توحید کا خلاصہ: عبادت بھی اللہ کی، اور مدد بھی اسی سے۔","1:6":"سیدھے راستے پر قائم رہنے کی دعا، جو بندہ روزانہ بار بار مانگتا ہے۔","1:7":"انعام یافتہ لوگوں سے مراد انبیاء، صدیقین، شہداء اور صالحین ہیں۔ اس دعا میں حق جان کر چھوڑنے اور بھٹک جانے، دونوں سے پناہ مانگی گئی ہے۔","2:255":"اس آیت میں اللہ کی صفات ایک ساتھ بیان ہوئی ہیں: زندہ و قائم رہنا، کبھی نہ سونا، ہر چیز کا مالک ہونا، مکمل علم رکھنا اور بلند و عظیم ہونا۔ بندہ جب اسے سمجھ کر پڑھتا ہے تو دل کو اللہ پر بھروسے کا سکون ملتا ہے۔","103:1":"اللہ وقت کی قسم کھا کر اس کی اہمیت کی طرف توجہ دلاتا ہے۔","103:2":"جو وقت ضائع ہو جائے وہ واپس نہیں آتا، اس لیے عام انسان نقصان میں ہے۔","103:3":"کامیابی کے چار ستون: ایمان، نیک عمل، حق کی نصیحت اور صبر کی نصیحت۔","105:5":"اللہ اپنے گھر کی خود حفاظت فرماتا ہے، چاہے دشمن کتنا ہی طاقتور ہو۔","106:4":"رزق اور امن، دونوں بڑی نعمتیں ہیں اور دونوں پر شکر واجب ہے۔","108:2":"نعمت کے شکر میں نماز اور قربانی، یعنی بدنی اور مالی عبادت۔","109:6":"توحید پر کوئی سمجھوتہ نہیں، مگر دوسروں پر زبردستی بھی نہیں۔","110:3":"کامیابی پر غرور نہیں، شکر اور استغفار سکھایا گیا ہے۔","112:2":"صمد وہ ہے جو کسی کا محتاج نہ ہو اور سب اس کے محتاج ہوں۔","114:4":"جب بندہ اللہ کو یاد کرتا ہے تو وسوسہ ڈالنے والا پیچھے ہٹ جاتا ہے۔"},"sections":[],"custom":{},"auth":{"salt":"32e5148927ab2ae75c7a0774cca78b2c","hash":"9d941c39fc6e30a12179c5c1abb3d
