! ہم نے اپنی جانوں پر ظلم کیا، اور اگر تو نے ہمیں نہ بخشا اور ہم پر رحم نہ کیا تو ہم ضرور نقصان اٹھانے والوں میں سے ہوں گے۔","src":"سورۃ الاعراف ۲۳ (دعائے آدم و حواء علیہما السلام)","count":"","note":"توبہ و استغفار کی دعا۔"},{"ar":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ","ur":"اے ہمارے رب! ہدایت دینے کے بعد ہمارے دلوں کو ٹیڑھا نہ کر اور ہمیں اپنے پاس سے رحمت عطا فرما، بے شک تو بہت عطا کرنے والا ہے۔","src":"سورۃ آل عمران ۸","count":"","note":"دین پر ثابت قدمی کی دعا۔"},{"ar":"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","ur":"ہمارے لیے اللہ کافی ہے اور وہ بہترین کارساز ہے۔","src":"سورۃ آل عمران ۱۷۳۔ صحیح بخاری میں ہے کہ حضرت ابراہیم علیہ السلام نے آگ میں ڈالے جانے پر اور نبی کریم ﷺ نے غزوۂ حمراء الاسد میں یہ پڑھا۔","count":"","note":"خوف اور آزمائش کے وقت۔"}]}],"istikhara":{"title":"استخارہ کی دعا","note":"کسی اہم معاملے (رشتہ، سفر، کاروبار وغیرہ) میں فیصلہ نہ ہو پا رہا ہو تو دو رکعت نفل پڑھ کر یہ دعا پڑھیں۔ دعا میں \"هَذَا الْأَمْرَ\" کی جگہ اپنی ضرورت کا نام لیں۔","src":"صحیح بخاری، کتاب التہجد اور کتاب الدعوات","ar":"اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ. اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثُمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِي بِهِ","ur":"اے اللہ! میں تیرے علم کے واسطے سے تجھ سے خیر مانگتی ہوں اور تیری قدرت کے واسطے سے طاقت مانگتی ہوں اور تیرے عظیم فضل میں سے مانگتی ہوں، کیونکہ تو قدرت رکھتا ہے اور میں نہیں رکھتی، تو جانتا ہے اور میں نہیں جانتی، اور تو غیب کی باتوں کو خوب جاننے والا ہے۔ اے اللہ! اگر تو جانتا ہے کہ یہ کام میرے لیے میرے دین، میری معاش اور انجامِ کار میں بہتر ہے تو اسے میرے مقدر میں کر دے، میرے لیے آسان کر دے اور اس میں برکت دے۔ اور اگر تو جانتا ہے کہ یہ کام میرے لیے میرے دین، معاش اور انجام میں برا ہے تو اسے مجھ سے پھیر دے اور مجھے اس سے پھیر دے، اور جہاں کہیں خیر ہو وہ میرے مقدر میں کر دے، پھر مجھے اس پر راضی کر دے۔"}},"oldArt":{"a-maqam":"4127418576","a-namaz":"2736797984","a-haya":"994182743","a-sabr":"2340463895","a-walidain":"3316996150","a-quran-seekhna":"2697915466"},"hadith":[{"id":"h1","n":1,"ar":"اَلصَّوْمُ جُنَّةٌ","ur":"روزہ گناہوں سے بچنے کی ڈھال ہے۔","t":"ڈھال تلوار اور تیر سے بچاتی ہے۔ اسی طرح روزہ انسان کو برے کاموں سے بچاتا ہے۔ روزے دار غصے، جھگڑے اور بری باتوں سے رک جاتا ہے، اور آخرت میں آگ سے بھی بچاؤ ہوتا ہے۔","a":"روزے میں جھوٹ، غیبت اور لڑائی سے بھی روزہ رکھیں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h2","n":2,"ar":"وَالصَّبْرُ ضِيَاءٌ","ur":"صبر روشنی ہے۔","t":"اندھیرے میں روشنی راستہ دکھاتی ہے۔ مشکل کے وقت صبر بھی راستہ دکھاتا ہے، دل کو سکون دیتا ہے اور انسان کو گھبراہٹ میں غلط فیصلے سے بچاتا ہے۔","a":"پریشانی میں شکوہ نہ کریں، «اِنَّا لِلّٰہِ وَاِنَّـاۤ اِلَیْہِ رٰجِعُوْنَ» پڑھیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h3","n":3,"ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ","ur":"بے شک اعمال کی قبولیت کا دار و مدار نیتوں پر ہے۔","t":"کوئی کام اچھا ہو تب بھی اللہ کے ہاں اس کا ثواب نیت کے مطابق ملتا ہے۔ جو کام صرف اللہ کی رضا کے لیے ہو وہ عبادت بن جاتا ہے، اور جو دکھاوے کے لیے ہو اس کا ثواب نہیں رہتا۔","a":"ہر اچھا کام شروع کرتے وقت دل میں کہیں: یہ اللہ کے لیے کر رہی ہوں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h4","n":4,"ar":"اَلصَّلَاةُ مِعْرَاجُ الْمُؤْمِنِ","ur":"نماز مومن کی معراج ہے۔","t":"معراج میں نبی ﷺ کو اللہ کے قریب خاص حاضری ملی۔ بات کا مطلب یہ بیان کیا جاتا ہے کہ نماز میں بندہ اللہ سے سیدھی بات کرتا ہے اور اسے قرب نصیب ہوتا ہے۔","a":"نماز آرام اور دھیان سے پڑھیں، جیسے اللہ سے باتیں کر رہی ہوں۔","src":"مشہور جملہ؛ حدیث کی معتبر کتب میں اس کی پکی سند نہیں ملتی","g":"w","sup":"یہ مفہوم صحیح حدیث سے ثابت ہے: «وَجُعِلَتْ قُرَّةُ عَيْنِي فِي الصَّلَاةِ» (نبی ﷺ نے فرمایا: میری آنکھوں کی ٹھنڈک نماز میں رکھی گئی)، نسائی۔"},{"id":"h5","n":5,"ar":"مَنْ صَمَتَ نَجَا","ur":"جو خاموش رہا وہ نجات پا گیا۔","t":"زبان سے بہت سے گناہ ہوتے ہیں: جھوٹ، غیبت، گالی، چغلی۔ جو شخص فضول اور بری باتوں سے خاموش رہتا ہے وہ ان سب گناہوں سے بچ جاتا ہے۔ اس کا مطلب یہ نہیں کہ اچھی بات بھی نہ کریں؛ مطلب یہ ہے کہ سوچ کر بولیں۔","a":"بولنے سے پہلے سوچیں: کیا یہ بات سچی اور اچھی ہے؟","src":"جامع ترمذی، مسند احمد (بعض محدثین نے سند پر کلام کیا، متعدد سندوں سے معتبر مانا گیا)","g":"h","sup":""},{"id":"h6","n":6,"ar":"اَلْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ","ur":"قرآن تیرے حق میں گواہی دے گا یا تیرے خلاف۔","t":"جو قرآن کو پڑھتی، سمجھتی اور اس پر عمل کرتی ہے، قرآن قیامت کے دن اس کے حق میں گواہی دے گا۔ جو اسے چھوڑ دے اس کے خلاف دلیل بن جائے گا۔","a":"روزانہ تھوڑا قرآن ترجمے کے ساتھ پڑھیں اور اس پر عمل کریں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h7","n":7,"ar":"اَلْمُسْلِمُ أَخُو الْمُسْلِمِ","ur":"مسلمان مسلمان کا بھائی ہے۔","t":"بھائی بھائی ایک دوسرے پر ظلم نہیں کرتے، مصیبت میں ساتھ دیتے ہیں اور ایک دوسرے کی عزت کی حفاظت کرتے ہیں۔ مسلمانوں کا آپس کا رشتہ ایمان کا رشتہ ہے۔","a":"سہیلیوں اور ہم جماعتوں کی مدد کریں، کسی کو تنگ نہ کریں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h8","n":8,"ar":"اَلْكَاسِبُ حَبِيبُ اللَّهِ","ur":"محنت کرنے والا اللہ کا دوست ہے۔","t":"حلال کمانے کے لیے محنت کرنا بہت اچھا کام ہے۔ جو اپنے ہاتھ کی محنت سے روزی کماتا ہے وہ کسی کے آگے ہاتھ نہیں پھیلاتا۔","a":"حلال کمائی کی قدر کریں اور گھر کے کام میں ہاتھ بٹائیں۔","src":"مشہور جملہ؛ سند پر محدثین نے کلام کیا ہے","g":"w","sup":"یہ مفہوم صحیح بخاری کی حدیث سے ثابت ہے: «اپنے ہاتھ کی کمائی سے بہتر کھانا کسی نے نہیں کھایا، اور اللہ کے نبی داؤد علیہ السلام اپنے ہاتھ سے کما کر کھاتے تھے۔»"},{"id":"h9","n":9,"ar":"اَلْبِرُّ حُسْنُ الْخُلُقِ","ur":"نیکی اچھے اخلاق کا نام ہے۔","t":"نیکی صرف نماز روزے کا نام نہیں۔ اچھی بات کرنا، نرمی سے پیش آنا، سچ بولنا اور دوسروں کا خیال رکھنا بھی نیکی ہے۔ اچھا اخلاق دین کا بہت بڑا حصہ ہے۔","a":"سلام کریں، مسکرا کر ملیں، شکریہ اور معاف کیجیے کہنا سیکھیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h10","n":10,"ar":"أَكْمَلُ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا","ur":"کامل مومن وہ ہے جس کا اخلاق اچھا ہو۔","t":"ایمان صرف زبان کا دعویٰ نہیں، کردار میں بھی نظر آتا ہے۔ جس کا اخلاق جتنا اچھا ہوتا ہے اس کا ایمان اتنا ہی مکمل سمجھا جاتا ہے۔","a":"گھر والوں اور چھوٹوں کے ساتھ خاص طور پر نرمی رکھیں۔","src":"سنن ابوداؤد، جامع ترمذی (حسن صحیح)","g":"h","sup":""},{"id":"h11","n":11,"ar":"خَيْرُ النَّاسِ مَنْ يَنْفَعُ النَّاسَ","ur":"لوگوں میں اچھا وہ ہے جو دوسروں کو نفع پہنچائے۔","t":"سب سے اچھا انسان وہ ہے جس سے دوسروں کو فائدہ پہنچے: علم سکھائے، مدد کرے، خوشی دے۔ جس سے لوگ تنگ ہوں وہ اچھا نہیں۔","a":"روزانہ کسی ایک کی مدد کرنے کی نیت کریں۔","src":"معجم اوسط طبرانی (بعض محدثین نے متعدد سندوں کی وجہ سے حسن کہا)","g":"h","sup":""},{"id":"h12","n":12,"ar":"اَلْحَيَاءُ لَا يَأْتِي إِلَّا بِخَيْرٍ","ur":"حیاء بہتری ہی لاتی ہے۔","t":"حیاء وہ احساس ہے جو انسان کو برے کام اور بری بات سے روکتا ہے۔ حیاء والا شخص گناہ سے بھی بچتا ہے اور لوگوں کے ساتھ بھی بھلائی سے پیش آتا ہے۔","a":"لباس، نظر اور بات چیت میں حیاء کا خیال رکھیں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h13","n":13,"ar":"سِبَابُ الْمُسْلِمِ فُسُوقٌ","ur":"مسلمان کو گالی دینا گناہ ہے۔","t":"کسی مسلمان کو گالی دینا یا برے نام سے پکارنا اللہ کی نافرمانی ہے۔ زبان سے دوسروں کو تکلیف دینا بھی ایک بڑا گناہ ہے۔","a":"کسی کو برے نام یا مذاق اڑانے والے نام سے نہ پکاریں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h14","n":14,"ar":"لَا يَكُونُ الْمُؤْمِنُ لَعَّانًا","ur":"مومن لعنت کرنے والا نہیں ہوتا۔","t":"لعنت کا مطلب ہے کسی کو اللہ کی رحمت سے دور ہونے کی بددعا دینا۔ مومن کی زبان پر دعا اور اچھے الفاظ ہونے چاہییں، بددعا اور لعنت نہیں۔","a":"غصے میں بھی کسی کو لعنت یا بددعا نہ دیں۔","src":"جامع ترمذی، صحیح مسلم (الفاظ میں معمولی فرق کے ساتھ)","g":"h","sup":""},{"id":"h15","n":15,"ar":"لَا يَدْخُلُ الْجَنَّةَ نَمَّامٌ","ur":"چغل خور جنت میں داخل نہیں ہوگا۔","t":"چغلی یہ ہے کہ ایک کی بات دوسرے تک اس لیے پہنچائی جائے کہ ان میں لڑائی ہو جائے۔ یہ بہت بڑا گناہ ہے، اور توبہ کیے بغیر اس پر سخت وعید آئی ہے۔","a":"کسی کی بات دوسرے کو لگا کر لڑائی نہ ڈالیں، صلح کرائیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h16","n":16,"ar":"اَلْمُؤْمِنُ مِرْآةُ الْمُؤْمِنِ","ur":"مومن مومن کا آئینہ ہے۔","t":"آئینہ چہرے کا داغ دکھا دیتا ہے مگر کسی کو بتاتا نہیں۔ اسی طرح اچھا مسلمان دوسرے کی غلطی اکیلے میں نرمی سے بتاتا ہے اور سب کے سامنے شرمندہ نہیں کرتا۔","a":"سہیلی کی غلطی اکیلے میں پیار سے بتائیں۔","src":"سنن ابوداؤد (حسن)","g":"h","sup":""},{"id":"h17","n":17,"ar":"اَلدُّعَاءُ مُخُّ الْعِبَادَةِ","ur":"دعا عبادت کا مغز ہے۔","t":"مغز کسی چیز کا اصل حصہ ہوتا ہے۔ دعا مانگنے کا مطلب ہے کہ ہم اللہ کے محتاج ہیں اور وہی دینے والا ہے۔ یہی عبادت کی اصل روح ہے۔","a":"ہر چھوٹی بڑی ضرورت اللہ سے مانگیں۔","src":"جامع ترمذی (سند پر محدثین نے کلام کیا ہے)","g":"w","sup":"اسی مفہوم کی صحیح حدیث: «اَلدُّعَاءُ هُوَ الْعِبَادَةُ» (دعا ہی عبادت ہے)، ترمذی، ابوداؤد۔"},{"id":"h18","n":18,"ar":"اَلطُّهُورُ شَطْرُ الْإِيمَانِ","ur":"صفائی نصف ایمان ہے۔","t":"اسلام میں پاکی اور صفائی بہت ضروری ہے: وضو، غسل، لباس اور گھر کی صفائی۔ اللہ پاک صاف رہنے والوں کو پسند کرتا ہے۔","a":"روزانہ جسم، کپڑوں اور اپنی جگہ کو صاف رکھیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h19","n":19,"ar":"اِتَّقِ اللَّهَ حَيْثُمَا كُنْتَ","ur":"تو جہاں کہیں بھی ہو اللہ سے ڈر۔","t":"اللہ ہر جگہ دیکھ رہا ہے، اکیلے ہوں یا لوگوں میں۔ اس لیے ہر جگہ گناہ سے بچنا چاہیے، چاہے کوئی دیکھ نہ رہا ہو۔","a":"جب اکیلی ہوں تب بھی وہی کام کریں جو سب کے سامنے کرتی ہیں۔","src":"جامع ترمذی (حسن)","g":"h","sup":""},{"id":"h20","n":20,"ar":"اَلصَّلَاةُ عِمَادُ الدِّينِ","ur":"نماز دین کا ستون ہے۔","t":"ستون کے بغیر چھت کھڑی نہیں رہتی۔ اسی طرح نماز کے بغیر دین مضبوط نہیں رہتا۔ نماز ہر مسلمان پر روزانہ پانچ وقت فرض ہے۔","a":"پانچوں نمازیں وقت پر پڑھنے کی کوشش کریں۔","src":"مشہور جملہ؛ حدیث کی معتبر کتب میں اس کی پکی سند نہیں ملتی","g":"w","sup":"نماز کی اہمیت صحیح حدیث سے ثابت ہے: «بندے اور کفر کے درمیان نماز چھوڑ دینا ہے» (صحیح مسلم)، اور حدیثِ جبریل میں نماز اسلام کے ارکان میں ہے (بخاری، مسلم)۔"},{"id":"h21","n":21,"ar":"إِنَّمَا أَنَا قَاسِمٌ وَاللَّهُ يُعْطِي","ur":"میں تقسیم کرنے والا ہوں اور اللہ عطا کرتا ہے۔","t":"نبی ﷺ کا فرمانا ہے کہ دینے والا حقیقت میں اللہ ہے، میں تو اللہ کا دیا ہوا مال لوگوں میں بانٹتا ہوں۔ اس سے ہم سیکھتے ہیں کہ ہر نعمت اللہ کی طرف سے ہے۔","a":"ہر نعمت پر «الحمد للہ» کہیں۔","src":"صحیح بخاری، صحیح مسلم","g":"s","sup":""},{"id":"h22","n":22,"ar":"إِنَّمَا بُعِثْتُ مُعَلِّمًا","ur":"بے شک مجھے استاد بنا کر بھیجا گیا ہے۔","t":"نبی ﷺ لوگوں کو سکھانے والے بن کر آئے۔ آپ ﷺ نے علم اور اچھی باتیں نرمی اور محبت سے سکھائیں۔ استاد کا ادب اور علم سیکھنا اسی لیے ضروری ہے۔","a":"استاد کا ادب کریں اور سیکھی ہوئی بات دوسروں کو بھی بتائیں۔","src":"سنن ابن ماجہ (سند پر محدثین نے کلام کیا ہے)","g":"w","sup":"اسی مفہوم کی صحیح حدیث: «اللہ نے مجھے سختی کرنے والا بنا کر نہیں بھیجا بلکہ سکھانے والا اور آسانی کرنے والا بنا کر بھیجا» (صحیح مسلم)۔"},{"id":"h23","n":23,"ar":"اَلرَّاشِي وَالْمُرْتَشِي كِلَاهُمَا فِي النَّارِ","ur":"رشوت دینے والا اور رشوت لینے والا دونوں جہنمی ہیں۔","t":"رشوت یہ ہے کہ کسی کا حق مارنے یا ناجائز کام کرانے کے لیے پیسے یا تحفہ دیا جائے۔ دینے والا اور لینے والا دونوں گناہ گار ہیں۔","a":"ہمیشہ جائز طریقے سے کام کروائیں اور رشوت سے دور رہیں۔","src":"مشہور جملہ؛ ان الفاظ کی سند پر کلام ہے","g":"w","sup":"صحیح حدیث: «اللہ نے رشوت دینے والے اور رشوت لینے والے پر لعنت کی» (سنن ابوداؤد، جامع ترمذی)۔"},{"id":"h24","n":24,"ar":"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ","ur":"تم میں بہتر وہ شخص ہے جو قرآن سیکھے اور سکھائے۔","t":"قرآن سیکھنا اور دوسروں کو سکھانا سب سے بہترین کاموں میں سے ہے۔ ایسی سیکھنے سکھانے والی مائیں، بہنیں اور استانیاں بہت خوش نصیب ہیں۔","a":"قرآن خود پڑھیں اور چھوٹے بہن بھائیوں کو بھی سکھائیں۔","src":"صحیح بخاری","g":"s","sup":""},{"id":"h25","n":25,"ar":"حُبُّ الدُّنْيَا رَأْسُ كُلِّ خَطِيئَةٍ","ur":"دنیا کی محبت ہر خطا کی جڑ ہے۔","t":"جب دنیا کی چیزوں سے حد سے زیادہ محبت ہو جائے تو انسان انھیں پانے کے لیے جھوٹ، لالچ اور ناجائز کام کرنے لگتا ہے۔ ضرورت کے مطابق دنیا ٹھیک ہے مگر دل کو اس کا غلام نہ بنائیں۔","a":"چیزوں کے پیچھے نہ بھاگیں، جو اللہ نے دیا اس پر شکر کریں۔","src":"یہ بزرگوں (حسن بصری رحمہ اللہ) کا قول مشہور ہے، نبی ﷺ کی مرفوع حدیث کے طور پر سند کمزور ہے","g":"w","sup":"دنیا کی محبت کے بارے میں قرآن (سورۃ آلِ عمران، آیت ۱۴) اور صحیح حدیث «کُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ» (صحیح بخاری) سے رہنمائی ملتی ہے۔"},{"id":"h26","n":26,"ar":"اَلدَّالُّ عَلَى الْخَيْرِ كَفَاعِلِهِ","ur":"نیکی کی راہ دکھانے والا نیکی کرنے والے کی طرح ہے۔","t":"اگر آپ کسی کو اچھے کام کی طرف بلائیں یا بتائیں تو جب وہ کرے گا آپ کو بھی ویسا ہی ثواب ملے گا، اور اس کے ثواب میں کمی بھی نہیں ہوگی۔","a":"کسی کو نماز، قرآن یا اچھی بات کی طرف بلائیں۔","src":"جامع ترمذی، صحیح مسلم (مفہوم)","g":"h","sup":""},{"id":"h27","n":27,"ar":"اَلتَّائِبُ مِنَ الذَّنْبِ كَمَنْ لَا ذَنْبَ لَهُ","ur":"گناہ سے توبہ کرنے والا ایسا ہے جیسے اس نے گناہ کیا ہی نہ ہو۔","t":"اللہ بہت معاف کرنے والا ہے۔ جب بندہ سچے دل سے توبہ کرے، شرمندہ ہو اور دوبارہ نہ کرنے کا ارادہ کرے تو اللہ اس کا گناہ معاف کر دیتا ہے۔","a":"غلطی ہو جائے تو فوراً «استغفر اللہ» کہیں اور توبہ کریں۔","src":"سنن ابن ماجہ (متعدد سندوں کی وجہ سے حسن)","g":"h","sup":""},{"id":"h28","n":28,"ar":"إِنَّ الصَّدَقَةَ لَتُطْفِئُ غَضَبَ الرَّبِّ","ur":"بے شک صدقہ اللہ تعالیٰ کے غصے کو ٹھنڈا کرتا ہے۔","t":"صدقہ دینے سے اللہ ناراضی ختم کر دیتا ہے اور بلاؤں کو ٹال دیتا ہے۔ چھوٹا سا صدقہ بھی اللہ کے ہاں بہت قیمتی ہے۔","a":"روزانہ تھوڑا سا صدقہ ضرور دیں، چاہے ایک روپیہ ہی ہو۔","src":"جامع ترمذی (حسن غریب)","g":"h","sup":""},{"id":"h29","n":29,"ar":"إِنَّ اللَّهَ جَمِيلٌ يُحِبُّ الْجَمَالَ","ur":"اللہ تعالیٰ خوبصورت ہے، خوبصورتی کو پسند کرتا ہے۔","t":"اللہ کو صفائی، اچھا لباس، سلیقہ اور اچھے اخلاق پسند ہیں۔ اس میں غرور نہیں ہونا چاہیے۔ سادہ اور صاف ستھرا رہنا بھی خوبصورتی ہے۔","a":"صاف ستھرے اور باحیاء لباس میں رہیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h30","n":30,"ar":"أَوَّلُ مَا يُحَاسَبُ بِهِ الْعَبْدُ الصَّلَاةُ","ur":"بندے سے سب سے پہلے نماز کا حساب لیا جائے گا۔","t":"قیامت کے دن پہلا سوال نماز کا ہوگا۔ اگر نماز ٹھیک نکلی تو باقی اعمال بھی آسان ہو جائیں گے۔ اس لیے نماز کو سب سے زیادہ اہمیت دینی چاہیے۔","a":"نماز کبھی قضا نہ کریں اور گھر کی چھوٹی بچیوں کو بھی ساتھ پڑھائیں۔","src":"جامع ترمذی، سنن نسائی، سنن ابوداؤد (صحیح)","g":"s","sup":""},{"id":"h31","n":31,"ar":"اَلصِّدْقُ يُنْجِي وَالْكَذِبُ يُهْلِكُ","ur":"سچ نجات دیتا ہے اور جھوٹ ہلاک کرتا ہے۔","t":"سچ بولنے والا پریشانیوں اور گناہوں سے بچ جاتا ہے، لوگ اس پر بھروسا کرتے ہیں۔ جھوٹ بولنے والا ایک جھوٹ چھپانے کے لیے کئی جھوٹ بولتا ہے اور آخر پھنس جاتا ہے۔","a":"نقصان ہو تب بھی سچ بولیں۔","src":"مشہور جملہ؛ ان الفاظ کی سند کمزور ہے","g":"w","sup":"صحیح حدیث: «سچائی نیکی کی طرف لے جاتی ہے اور نیکی جنت کی طرف، اور جھوٹ گناہ کی طرف لے جاتا ہے» (صحیح بخاری، صحیح مسلم)۔"},{"id":"h32","n":32,"ar":"رَأْسُ الْحِكْمَةِ مَخَافَةُ اللَّهِ","ur":"دانائی کی بنیاد خوفِ خدا ہے۔","t":"اصل عقلمند وہ ہے جو اللہ سے ڈر کر گناہوں سے بچتا ہے، کیونکہ اسے معلوم ہے کہ سب کچھ اللہ کے سامنے پیش ہونا ہے۔","a":"کوئی کام کرنے سے پہلے سوچیں کہ اللہ اس سے راضی ہوگا یا نہیں۔","src":"مشہور جملہ؛ حدیث کے طور پر سند کمزور ہے","g":"w","sup":"قرآن میں ہے: «اللہ سے اس کے بندوں میں سے علم والے ہی ڈرتے ہیں» (سورۃ فاطر، آیت ۲۸)۔"},{"id":"h33","n":33,"ar":"اَلْمَجَالِسُ بِالْأَمَانَةِ","ur":"مجلس کی بات امانت ہوتی ہے۔","t":"جو بات کسی مجلس یا دوستوں میں ہو، اسے باہر لوگوں میں پھیلانا درست نہیں۔ کسی کا راز بتانا امانت میں خیانت ہے۔","a":"سہیلی کا راز دوسروں کو نہ بتائیں۔","src":"سنن ابوداؤد، جامع ترمذی (حسن)","g":"h","sup":""},{"id":"h34","n":34,"ar":"اَلدِّينُ النَّصِيحَةُ","ur":"دین خیرخواہی کا نام ہے۔","t":"نصیحت کا مطلب ہے خلوص سے بھلائی چاہنا: اللہ، اس کے رسول، کتاب، حکمرانوں اور سب مسلمانوں کے ساتھ۔ دین میں خیرخواہی اور سچائی سب سے اہم ہے۔","a":"کسی کو غلطی پر نرمی اور محبت سے سمجھائیں۔","src":"صحیح مسلم","g":"s","sup":""},{"id":"h35","n":35,"ar":"يَدُ اللَّهِ عَلَى الْجَمَاعَةِ","ur":"اللہ تعالیٰ کا ہاتھ جماعت پر ہے۔","t":"جو مسلمان مل جل کر اتفاق سے رہتے ہیں اللہ کی مدد ان کے ساتھ ہوتی ہے۔ اختلاف اور فرقہ بازی سے کمزوری آتی ہے۔","a":"سب کے ساتھ مل جل کر رہیں "},{"id":"m4","cat":"tahara","t":"غسل کب فرض ہوتا ہے؟","a":"جنابت (میاں بیوی کے تعلق یا احتلام کے بعد)، حیض اور نفاس ختم ہونے پر غسل فرض ہوتا ہے۔"},{"id":"m5","cat":"tahara","t":"تیمم کب جائز ہے؟","a":"جب پانی بالکل میسر نہ ہو، یا بیماری کی وجہ سے پانی کے استعمال سے نقصان یا بیماری بڑھنے کا غالب گمان ہو، تو وضو اور غسل کی جگہ تیمم جائز ہے۔ طریقہ: نیت کر کے پاک مٹی یا مٹی کی جنس پر دونوں ہاتھ مار کر چہرے پر پھیرنا، پھر دوبارہ ہاتھ مار کر کہنیوں سمیت دونوں ہاتھوں پر پھیرنا۔"},{"id":"m6","cat":"tahara","t":"موزوں پر مسح کتنے دن جائز ہے؟","a":"مقیم کے لیے ایک دن رات (24 گھنٹے) اور مسافر کے لیے تین دن رات۔ شرط یہ ہے کہ موزے وضو کر کے پہنے گئے ہوں۔ مدت پہلی بار وضو ٹوٹنے کے بعد سے شمار ہوتی ہے۔"},{"id":"m7","cat":"namaz","t":"نماز کے فرائض (شرائط اور ارکان) کیا ہیں؟","a":"نماز سے باہر کی شرائط چھ ہیں: بدن کی پاکی، کپڑوں کی پاکی، جگہ کی پاکی، ستر چھپانا، قبلہ رخ ہونا اور نیت۔ نماز کے اندر کے ارکان چھ ہیں: تکبیرِ تحریمہ، قیام، قراءت، رکوع، سجدے اور قعدۂ اخیرہ۔"},{"id":"m8","cat":"namaz","t":"عورت کے لیے ستر کتنا ہے اور نماز میں کیا چھپانا ہے؟","a":"نماز میں عورت کے لیے چہرے، دونوں ہتھیلیوں اور دونوں پاؤں کے سوا پورا بدن ستر ہے، لہٰذا سر، گردن، کلائیاں اور بال بھی چھپے ہوں۔ اگر ستر کا چوتھائی حصہ ایک رکن کی مقدار کھلا رہے تو نماز نہیں ہوتی۔"},{"id":"m9","cat":"namaz","t":"پانچ نمازوں کی رکعتیں کتنی ہیں؟","a":"فجر: 2 سنت اور 2 فرض۔ ظہر: 4 سنت، 4 فرض، 2 سنت اور 2 نفل۔ عصر: 4 فرض (4 سنتِ غیر مؤکدہ پڑھنا بہتر ہے)۔ مغرب: 3 فرض، 2 سنت اور 2 نفل۔ عشاء: 4 سنتِ غیر مؤکدہ، 4 فرض، 2 سنت، 2 نفل، پھر 3 وتر واجب اور 2 نفل۔"},{"id":"m10","cat":"namaz","t":"عورت کی نماز میں مرد سے فرق","a":"عورت تکبیرِ تحریمہ میں ہاتھ کندھوں تک اٹھاتی ہے، سینے پر ہاتھ باندھتی ہے، رکوع میں کم جھکتی ہے، سجدے میں سمٹ کر بازو پیٹ سے ملا کر سجدہ کرتی ہے اور بیٹھتے وقت دونوں پاؤں دائیں جانب نکال کر بائیں کولھے پر بیٹھتی ہے۔ یہ حنفی فقہ کی کتابوں میں مذکور ہے۔"},{"id":"m11","cat":"namaz","t":"سجدۂ سہو کب لازم ہوتا ہے؟","a":"جب نماز میں کوئی واجب بھول کر چھوٹ جائے، مثلاً سورۃ الفاتحہ کے بعد سورت ملانا یا قعدۂ اولیٰ بھول جانا، تو آخر میں سلام پھیر کر دو سجدے کیے جاتے ہیں، پھر تشہد، درود اور دعا پڑھ کر سلام پھیرا جاتا ہے۔ فرض چھوٹ جائے تو نماز دوبارہ پڑھنی ہوگی۔"},{"id":"m12","cat":"namaz","t":"قضا نماز کا حکم","a":"جو نماز چھوٹ جائے اس کی قضا فرض ہے۔ فجر، ظہر، عصر، مغرب اور عشاء کی قضا اسی رکعت کے ساتھ ہے جتنی اس کی ادا میں ہیں، اور وتر کی قضا بھی واجب ہے۔ سستی سے چھوڑنے پر توبہ بھی لازم ہے۔"},{"id":"m13","cat":"namaz","t":"سفر میں نماز کا حکم (قصر)","a":"جو شخص تقریباً 48 میل (شرعی میل، قریباً 77 کلومیٹر) یا اس سے زیادہ سفر کی نیت سے اپنے شہر کی حدود سے نکل جائے وہ مسافر ہے اور چار رکعت والی فرض نماز میں دو رکعت پڑھے گا۔ اگر کسی جگہ پندرہ دن یا اس سے زیادہ ٹھہرنے کی نیت کر لے تو مقیم ہو جاتا ہے۔"},{"id":"m14","cat":"namaz","t":"مکروہ اوقات","a":"سورج نکلتے وقت، ٹھیک دوپہر (زوال کے وقت) اور سورج ڈوبتے وقت نفل نماز اور سجدۂ تلاوت جائز نہیں۔ فجر کے بعد سورج بلند ہونے تک اور عصر کے بعد غروب تک نفل نماز مکروہ ہے۔"},{"id":"m15","cat":"roza","t":"روزہ کن چیزوں سے ٹوٹ جاتا ہے؟","a":"جان بوجھ کر کھانا پینا، میاں بیوی کا تعلق، جان بوجھ کر منہ بھر قے کرنا، ناک یا کان میں دوا ڈالنا اور سگریٹ وغیرہ کا دھواں اندر لینا — ان سے روزہ ٹوٹ جاتا ہے۔ بھول کر کھانے پینے سے روزہ نہیں ٹوٹتا۔"},{"id":"m16","cat":"roza","t":"روزے کی قضا اور کفارہ","a":"کسی عذر (بیماری، سفر، حیض و نفاس) سے روزہ چھوٹ جائے تو رمضان کے بعد اس کی قضا ایک روزہ کے بدلے ایک روزہ ہے۔ بغیر عذر جان بوجھ کر کھا پی کر روزہ توڑنے پر قضا کے ساتھ کفارہ بھی لازم ہے: مسلسل ساٹھ روزے، یا ساٹھ مسکینوں کو کھانا کھلانا۔"},{"id":"m17","cat":"roza","t":"حیض والی عورت روزہ اور نماز کا کیا کرے؟","a":"حیض اور نفاس کے دنوں میں نماز اور روزہ دونوں معاف ہیں۔ نماز کی قضا نہیں، مگر رمضان کے چھوٹے ہوئے روزوں کی قضا بعد میں رکھنی لازم ہے۔ پاک ہونے کے بعد غسل کر کے نماز شروع کی جائے۔"},{"id":"m18","cat":"roza","t":"فدیہ کس پر لازم ہے؟","a":"جو شخص بہت بوڑھا ہو یا ایسی دائمی بیماری میں ہو کہ روزہ رکھنے کی طاقت نہیں اور آئندہ بھی امید نہیں، وہ ہر روزے کے بدلے ایک مسکین کو دو وقت کا کھانا یا اس کی قیمت (صدقۂ فطر کی مقدار) فدیہ دے۔"},{"id":"m19","cat":"zakat","t":"زکوٰۃ کس پر فرض ہے؟","a":"جس مسلمان عاقل بالغ کے پاس ضرورتِ اصلیہ اور قرض سے زائد نصاب کی مقدار مال ایک سال تک رہے اس پر زکوٰۃ فرض ہے۔ چاندی کا نصاب 52.5 تولہ (612.36 گرام) اور سونے کا 7.5 تولہ (87.48 گرام) ہے۔"},{"id":"m20","cat":"zakat","t":"زکوٰۃ کی شرح کیا ہے؟","a":"سونا، چاندی، نقدی اور مالِ تجارت پر چالیسواں حصہ یعنی ڈھائی فیصد (2.5%) زکوٰۃ ہے۔"},{"id":"m21","cat":"zakat","t":"زیور پر زکوٰۃ","a":"احناف کے نزدیک عورت کے استعمال کے سونے چاندی کے زیور پر بھی زکوٰۃ واجب ہے، اگر وہ نصاب کو پہنچ جائے۔ زکوٰۃ سونے چاندی کی موجودہ قیمت کے حساب سے ادا کی جائے گی۔"},{"id":"m22","cat":"zakat","t":"زکوٰۃ کے مستحق کون ہیں؟","a":"قرآن (سورۃ التوبہ: 60) میں آٹھ مصارف بیان ہوئے ہیں: فقیر، مسکین، زکوٰۃ وصول کرنے والے عاملین، تالیفِ قلب، غلام آزاد کرانا، قرض دار، فی سبیل اللہ اور مسافر۔ والدین، اولاد اور میاں بیوی ایک دوسرے کو زکوٰۃ نہیں دے سکتے، نہ سید خاندان کو دی جا سکتی ہے۔"},{"id":"m23","cat":"zakat","t":"صدقۂ فطر کتنا اور کس پر ہے؟","a":"ہر صاحبِ نصاب مسلمان پر اپنی اور اپنی نابالغ اولاد کی طرف سے عید کی صبح صادق کے وقت واجب ہوتا ہے۔ مقدار نصف صاع گندم (تقریباً 2 کلو 47 گرام) یا اس کی قیمت ہے۔ عید کی نماز سے پہلے ادا کرنا مستحب ہے۔"},{"id":"m24","cat":"hajj","t":"حج کس پر فرض ہے؟","a":"جو مسلمان عاقل بالغ صاحبِ استطاعت ہو، یعنی سفر کے اخراجات، واپسی تک گھر والوں کا خرچ اور راستے کی امن کا سامان رکھتا ہو، اس پر عمر میں ایک بار حج فرض ہے۔ عورت کے لیے محرم یا شوہر کا ساتھ ہونا شرط ہے۔"},{"id":"m25","cat":"hajj","t":"حج کے فرائض","a":"احناف کے نزدیک حج کے تین فرائض ہیں: احرام باندھنا، نو ذوالحجہ کو عرفات میں ٹھہرنا (وقوفِ عرفہ)، اور طوافِ زیارت۔"},{"id":"m26","cat":"muamlat","t":"سود کا حکم","a":"قرآن (سورۃ البقرہ: 275–279) میں سود کو حرام قرار دیا گیا ہے اور سود لینے والے کے خلاف اللہ اور اس کے رسول ﷺ کی طرف سے جنگ کا اعلان ہے۔ سود دینا، لینا، لکھنا اور اس کی گواہی دینا سب گناہ ہیں۔"},{"id":"m27","cat":"muamlat","t":"خرید و فروخت کی بنیادی شرائط","a":"چیز اور قیمت دونوں متعین اور معلوم ہوں، فریقین رضامند ہوں، چیز بیچنے والے کی ملکیت یا قبضے میں ہو اور حلال ہو۔ دھوکا، ملاوٹ اور جھوٹ بول کر بیچنا ناجائز ہے۔"},{"id":"m28","cat":"muamlat","t":"قرض کا حکم","a":"قرض لینا اور دینا جائز ہے مگر قرض پر اضافی نفع شرط کرنا سود ہے۔ جب قرض ادا کرنے کی استطاعت ہو تو تاخیر ظلم ہے۔ قرض لکھ لینا اور گواہ بنانا مسنون ہے (سورۃ البقرہ: 282)۔"},{"id":"m29","cat":"nikah","t":"نکاح کے صحیح ہونے کی بنیادی شرائط","a":"ایجاب و قبول، دو عاقل بالغ مسلمان گواہوں کی موجودگی، اور مہر کا مقرر ہونا (نہ بھی مقرر ہو تو مہرِ مثل لازم آتا ہے)۔ ولی کی اجازت سے نکاح مسنون اور بہتر ہے۔ عورت کی رضامندی ضروری ہے، جبراً نکاح درست نہیں۔"},{"id":"m30","cat":"nikah","t":"مہر کیا ہے؟","a":"مہر وہ مال ہے جو نکاح کی وجہ سے شوہر پر بیوی کا حق بن جاتا ہے۔ یہ عورت کی ملکیت ہے، ماں باپ یا کسی اور کا حق نہیں۔ کم از کم مہر حنفی فقہ میں دس درہم (قریباً 30.618 گرام چاندی) ہے۔ مہر ادا کرنے میں سہولت اور حسبِ استطاعت رکھنا بہتر ہے۔"},{"id":"m31","cat":"nikah","t":"عدت کے احکام","a":"طلاق کی عدت تین ماہواریاں ہے؛ وفات کی عدت چار مہینے دس دن ہے؛ حاملہ کی عدت بچہ پیدا ہونے تک ہے۔ عدتِ وفات میں عورت زیب و زینت اور بلا ضرورت گھر سے نکلنے سے رکتی ہے۔"},{"id":"m32","cat":"akhlaq","t":"پردے کا حکم","a":"قرآن میں سورۃ النور (آیت 31) اور سورۃ الاحزاب (آیت 59) میں عورتوں کو پردے اور زینت چھپانے کا حکم دیا گیا ہے۔ غیر محرم مردوں کے سامنے سر، بال اور جسم ڈھانپنا لازم ہے۔ چہرے کے پردے کے بارے میں علماء کی آراء میں تفصیل ہے، اس بارے میں اپنے معتمد عالم سے رجوع کریں۔"},{"id":"m33","cat":"akhlaq","t":"والدین کے حقوق","a":"قرآن میں اللہ کی عبادت کے فوراً بعد والدین کے ساتھ احسان کا حکم ہے (سورۃ الاسراء: 23)۔ انہیں \"اف\" تک نہ کہا جائے، نرمی سے بات کی جائے، ان کے لیے دعا کی جائے۔ جائز کاموں میں ان کی اطاعت لازم ہے، گناہ کے کام میں نہیں۔"},{"id":"m34","cat":"akhlaq","t":"غیبت اور جھوٹ","a":"غیبت یعنی کسی کے پیٹھ پیچھے ایسی بات کہنا جو اسے ناگوار ہو چاہے سچی ہو، حرام ہے۔ قرآن (الحجرات: 12) میں اسے مردہ بھائی کا گوشت کھانے سے تشبیہ دی گئی ہے۔ جھوٹ بولنا بھی گناہِ کبیرہ ہے۔ توبہ کے ساتھ اس شخص سے معافی بھی مانگی جائے۔"},{"id":"m35","cat":"janaza","t":"نمازِ جنازہ کا طریقہ","a":"جنازہ کی نماز فرضِ کفایہ ہے۔ اس میں قیام ہے، رکوع سجدہ نہیں۔ چار تکبیریں ہیں: پہلی کے بعد ثنا، دوسری کے بعد درودِ ابراہیمی، تیسری کے بعد میت کے لیے دعا، چوتھی کے بعد دونوں طرف سلام پھیر دیا جاتا ہے۔"},{"id":"m36","cat":"janaza","t":"میت کا غسل اور کفن","a":"میت کو غسل دینا اور کفن پہنانا فرضِ کفایہ ہے۔ مرد کو تین کپڑوں (ازار، قمیص اور لفافہ) اور عورت کو پانچ کپڑوں (ازار، قمیص، اوڑھنی، سینہ بند اور لفافہ) کا کفن مسنون ہے۔ عورت کو عورتیں اور مرد کو مرد غسل دیتے ہیں (میاں بیوی کا حکم الگ ہے، عالم سے پوچھ لیں)۔"}],"history":[{"id":"h1","era":"seerat","y":"570ء","t":"ولادتِ باسعادت","d":"مکہ مکرمہ میں رسول اللہ ﷺ کی ولادت۔","b":["رسول اللہ ﷺ کی ولادت مکہ مکرمہ میں قبیلۂ قریش کے خاندان بنو ہاشم میں ہوئی، یہ سال عام الفیل کے قریب کا ہے۔ آپ ﷺ کے والد حضرت عبداللہ آپ کی ولادت سے پہلے وفات پا چکے تھے۔","والدہ حضرت آمنہ اور دادا عبدالمطلب نے آپ کی پرورش کی۔ دودھ پلانے کے لیے آپ ﷺ کو بنو سعد کی حضرت حلیمہ سعدیہ کے سپرد کیا گیا۔ چھ برس کی عمر میں والدہ بھی وفات پا گئیں، دو برس بعد دادا کا بھی انتقال ہو گیا اور پھر چچا ابو طالب نے کفالت کی۔","آپ ﷺ بچپن ہی سے صادق اور امین کے لقب سے مشہور تھے۔"],"r":"ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h2","era":"seerat","y":"610ء","t":"پہلی وحی","d":"غارِ حرا میں پہلی وحی۔","b":["چالیس سال کی عمر میں رمضان المبارک کے مہینے میں غارِ حرا میں جبریل علیہ السلام پہلی وحی لے کر آئے۔ سب سے پہلے سورۃ العلق کی ابتدائی پانچ آیات: \"اقرأ باسم ربک الذی خلق…\" نازل ہوئیں۔","آپ ﷺ گھبرائی ہوئی حالت میں گھر تشریف لائے تو ام المومنین حضرت خدیجہ رضی اللہ عنہا نے تسلی دی اور فرمایا کہ اللہ آپ کو ضائع نہیں کرے گا کیونکہ آپ صلہ رحمی کرتے ہیں، سچ بولتے ہیں، کمزوروں کا بوجھ اٹھاتے ہیں اور مہمان نوازی کرتے ہیں۔ وہ آپ کو ورقہ بن نوفل کے پاس لے گئیں جنہوں نے بتایا کہ یہ وہی ناموس (فرشتہ) ہے جو موسیٰ علیہ السلام پر اترا تھا۔","عورتوں میں سب سے پہلے حضرت خدیجہ، مردوں میں حضرت ابو بکر، بچوں میں حضرت علی اور غلاموں میں حضرت زید بن حارثہ رضی اللہ عنہم ایمان لائے۔"],"r":"حوالہ: سورۃ العلق (1–5)؛ صحیح بخاری، بدء الوحی۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h3","era":"seerat","y":"613ء","t":"اعلانِ دعوت","d":"کوہِ صفا پر کھلی دعوت۔","b":["تین سال کی خفیہ دعوت کے بعد حکم ہوا: \"اپنے قریبی رشتہ داروں کو ڈرائیے\" (الشعراء: 214)۔ نبی ﷺ نے کوہِ صفا پر چڑھ کر قریش کو پکارا اور پوچھا کہ اگر میں کہوں کہ پہاڑ کے پیچھے دشمن کا لشکر ہے تو کیا مانو گے؟ سب نے کہا: ہم نے آپ کو ہمیشہ سچا پایا۔ پھر آپ ﷺ نے توحید کی دعوت دی۔","ابو لہب نے سخت مخالفت کی، جس پر سورۃ اللہب نازل ہوئی۔ اس کے بعد مشرکینِ مکہ نے مسلمانوں پر ظلم و ستم بڑھا دیا؛ حضرت بلال، حضرت خباب، حضرت عمار اور ان کے والدین حضرت یاسر و سمیہ رضی اللہ عنہم پر سخت تکالیف ڈھائی گئیں۔ حضرت سمیہ رضی اللہ عنہا اسلام میں پہلی شہید خاتون ہیں۔"],"r":"حوالہ: الشعراء (214)، سورۃ اللہب؛ صحیح بخاری۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h4","era":"seerat","y":"615ء","t":"ہجرتِ حبشہ","d":"صحابہ کی حبشہ کی طرف ہجرت۔","b":["قریش کے ظلم سے بچنے کے لیے نبی ﷺ نے صحابہ کو حبشہ جانے کی اجازت دی، جہاں کا بادشاہ نجاشی عادل تھا۔ پہلے گروہ میں حضرت عثمان اور ان کی اہلیہ حضرت رقیہ رضی اللہ عنہما شامل تھے۔ بعد میں حضرت جعفر بن ابی طالب کی قیادت میں بڑی تعداد میں صحابہ گئے۔","قریش نے سفیر بھیج کر انہیں واپس مانگا، مگر نجاشی کے دربار میں حضرت جعفر رضی اللہ عنہ نے سورۃ مریم کی تلاوت کی تو نجاشی اور اس کے درباری رو پڑے، اور اس نے مسلمانوں کو واپس کرنے سے انکار کر دیا۔"],"r":"ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h5","era":"seerat","y":"619ء","t":"عام الحزن (غم کا سال)","d":"ابو طالب اور خدیجہؓ کی وفات۔","b":["بعثت کے دسویں سال کے آس پاس نبی ﷺ کے چچا ابو طالب کا انتقال ہوا، جو کفر کی حالت میں بھی آپ ﷺ کی حمایت اور حفاظت کرتے رہے۔ چند دن بعد (روایات کے مطابق تین دن یا کچھ ہفتے) ام المومنین حضرت خدیجہ رضی اللہ عنہا بھی وفات پا گئیں، جو مشکل ترین وقت میں آپ ﷺ کی سب سے بڑی غم گسار رفیقہ تھیں۔","دو بڑے سہاروں کے اٹھنے کے بعد قریش کی ایذا رسانی اور بڑھ گئی۔ اسی لیے اس سال کو \"عام الحزن\" یعنی غم کا سال کہا گیا۔ اسی دور میں آپ ﷺ طائف تشریف لے گئے جہاں اہلِ طائف نے آپ پر پتھر برسائے، مگر آپ ﷺ نے ان کے لیے بددعا کے بجائے ہدایت کی دعا فرمائی۔","ان تکالیف کے بعد اللہ تعالیٰ نے آپ ﷺ کو معراج کے ذریعے خاص اعزاز بخشا۔"],"r":"حوالہ: صحیح بخاری (طائف کا واقعہ، بدء الخلق)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h6","era":"seerat","y":"620ء","t":"اسراء و معراج","d":"مسجدِ حرام سے مسجدِ اقصیٰ اور آسمانوں تک سفر۔","b":["ایک رات نبی ﷺ کو مسجدِ حرام سے مسجدِ اقصیٰ (اسراء) اور پھر آسمانوں اور سدرۃ المنتہیٰ تک (معراج) لے جایا گیا۔ قرآن میں اس کا ذکر سورۃ الاسراء (آیت 1) اور سورۃ النجم میں ہے۔","اس سفر میں پانچ وقت کی نماز فرض ہوئی (ابتدا میں پچاس، پھر تخفیف ہو کر پانچ، اجر پچاس کا)۔ صبح جب آپ ﷺ نے واقعہ بیان کیا تو مشرکین نے مذاق اڑایا، مگر حضرت ابو بکر رضی اللہ عنہ نے بلا تردد تصدیق کی اور \"صدیق\" کے لقب سے مشہور ہوئے۔"],"r":"حوالہ: الاسراء (1)، النجم (1–18)؛ صحیح بخاری و مسلم۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h7","era":"seerat","y":"621–622ء","t":"بیعتِ عقبہ","d":"اہلِ مدینہ کی بیعت۔","b":["حج کے موقع پر مدینہ (یثرب) کے اوس و خزرج کے لوگ نبی ﷺ سے ملے اور اسلام قبول کیا۔ اگلے سال بارہ اور پھر ستر سے زائد افراد نے عقبہ کے مقام پر بیعت کی کہ وہ نبی ﷺ کی ویسے ہی حفاظت کریں گے جیسے اپنے اہل و عیال کی کرتے ہیں۔","حضرت مصعب بن عمیر رضی اللہ عنہ کو معلم بنا کر مدینہ بھیجا گیا، جن کی کوششوں سے مدینہ کے گھر گھر اسلام پھیل گیا۔ یہی بیعتیں ہجرتِ مدینہ کی بنیاد بنیں۔"],"r":"ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h8","era":"seerat","y":"622ء / 1 ھ","t":"ہجرتِ مدینہ","d":"مکہ سے مدینہ ہجرت اور ہجری سنہ کی بنیاد۔","b":["قریش نے دارالندوہ میں مشورہ کر کے نبی ﷺ کے قتل کی سازش کی۔ اللہ کے حکم سے نبی ﷺ نے حضرت علی رضی اللہ عنہ کو اپنے بستر پر لٹایا، امانتیں ان کے سپرد کیں اور رات کو حضرت ابو بکر رضی اللہ عنہ کے ساتھ روانہ ہو گئے۔","تین دن غارِ ثور میں قیام فرمایا۔ جب دشمن غار کے دہانے تک پہنچ گیا تو آپ ﷺ نے حضرت ابو بکر کو تسلی دی: \"غم نہ کرو، اللہ ہمارے ساتھ ہے\" (التوبہ: 40)۔ پھر راستے میں قباء میں قیام فرما کر مدینہ پہنچے، جہاں انصار نے شاندار استقبال کیا۔","مدینہ میں سب سے پہلے مسجدِ نبوی کی تعمیر ہوئی، مہاجرین و انصار کے درمیان مواخات (بھائی چارہ) قائم کی گئی اور یہودی قبائل کے ساتھ \"میثاقِ مدینہ\" کا معاہدہ ہوا۔ حضرت عمر رضی اللہ عنہ کے دور میں اسی ہجرت کو اسلامی سنہ کی بنیاد بنایا گیا۔"],"r":"حوالہ: التوبہ (40)؛ صحیح بخاری (باب الہجرۃ)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h9","era":"seerat","y":"624ء / 2 ھ","t":"غزوۂ بدر","d":"حق و باطل کا پہلا بڑا معرکہ۔","b":["17 رمضان 2 ھ کو بدر کے مقام پر تقریباً 313 مسلمانوں کا مقابلہ قریش کے تقریباً ایک ہزار کے لشکر سے ہوا۔ مسلمانوں کے پاس سواریاں اور ہتھیار بہت کم تھے۔ نبی ﷺ نے رات بھر اللہ سے دعا کی، اور اللہ نے فرشتوں کے ذریعے مدد فرمائی۔","ابو جہل سمیت قریش کے بڑے سردار مارے گئے اور ستر کے قریب قیدی بنے۔ قیدیوں سے فدیہ لیا گیا، اور جو لکھنا جانتے تھے ان کا فدیہ یہ تھا کہ وہ مدینہ کے بچوں کو لکھنا پڑھنا سکھائیں۔ قرآن نے اس دن کو \"یوم الفرقان\" کہا ہے۔"],"r":"حوالہ: آل عمران (123)، الانفال (5–19, 41)؛ صحیح بخاری (کتاب المغازی)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h10","era":"seerat","y":"625ء / 3 ھ","t":"غزوۂ احد","d":"احد کا معرکہ اور ایک سبق۔","b":["بدر کا بدلہ لینے کے لیے قریش تین ہزار کا لشکر لے کر آئے۔ نبی ﷺ نے پچاس تیر انداز پہاڑی کے درے پر مقرر فرمائے اور ہدایت کی کہ چاہے ہماری فتح ہو یا شکست، یہاں سے نہ ہٹنا۔","ابتدا میں مسلمان غالب آ گئے، مگر بعض تیر اندازوں نے فتح سمجھ کر درہ چھوڑ دیا۔ خالد بن ولید (جو اس وقت مسلمان نہ ہوئے تھے) نے پیچھے سے حملہ کیا، جس سے مسلمانوں کو نقصان ہوا؛ ستر صحابہ شہید ہوئے جن میں سید الشہداء حضرت حمزہ رضی اللہ عنہ بھی تھے، اور نبی ﷺ زخمی ہوئے۔","اس واقعے سے سبق ملا کہ قیادت کی اطاعت اور دنیا کی لالچ سے بچنا کامیابی کی شرط ہے۔ اللہ نے اس پر سورۃ آل عمران میں تفصیلی ہدایات نازل فرمائیں۔"],"r":"حوالہ: آل عمران (121–175)؛ صحیح بخاری (غزوۂ احد)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h11","era":"seerat","y":"627ء / 5 ھ","t":"غزوۂ خندق (احزاب)","d":"مدینہ کے گرد خندق اور دس ہزار کے لشکر کی ناکامی۔","b":["قریش، غطفان اور دیگر قبائل دس ہزار کے قریب لشکر لے کر مدینہ پر چڑھ آئے۔ حضرت سلمان فارسی رضی اللہ عنہ کے مشورے سے مدینہ کے شمال میں خندق کھودی گئی۔ نبی ﷺ اور صحابہ نے خود مٹی کھودی اور بھوک میں پیٹ پر پتھر باندھے۔","تقریباً ایک ماہ محاصرہ رہا۔ پھر اللہ نے سخت آندھی بھیجی اور فرشتے اتارے، جس سے کفار کے خیمے اکھڑ گئے اور وہ ناکام لوٹ گئے۔ اس کے بعد نبی ﷺ نے فرمایا کہ اب ہم ان پر چڑھائی کریں گے، وہ ہم پر نہیں آ سکیں گے۔"],"r":"حوالہ: سورۃ الاحزاب (9–25)؛ صحیح بخاری (کتاب المغازی)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h12","era":"seerat","y":"628ء / 6 ھ","t":"صلحِ حدیبیہ","d":"فتحِ مبین کی تمہید۔","b":["نبی ﷺ تقریباً چودہ سو صحابہ کے ساتھ عمرہ کی نیت سے مکہ روانہ ہوئے۔ قریش نے حدیبیہ کے مقام پر روک دیا۔ اسی موقع پر \"بیعتِ رضوان\" ہوئی جس میں صحابہ نے درخت کے نیچے نبی ﷺ کے ہاتھ پر بیعت کی، اور اللہ نے ان سے اپنی رضا کا اعلان فرمایا۔","صلح کی بظاہر ایسی شرائط تھیں جو مسلمانوں کے خلاف نظر آتی تھیں (اس سال واپسی، قریش کے مسلمان ہونے والے کی واپسی وغیرہ) اور کئی صحابہ بے چین ہوئے، مگر نبی ﷺ نے اللہ کے حکم پر صلح قبول فرمائی۔ واپسی میں سورۃ الفتح نازل ہوئی: \"ہم نے آپ کو کھلی فتح عطا کی\"۔","اس صلح سے امن ملا، دعوت تیزی سے پھیلی، اور دو سال کے اندر مسلمانوں کی تعداد کئی گنا بڑھ گئی۔"],"r":"حوالہ: الفتح (1، 18)؛ صحیح بخاری (کتاب الشروط)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h13","era":"seerat","y":"628ء / 7 ھ","t":"غزوۂ خیبر","d":"یہودی قلعوں کی فتح۔","b":["خیبر کے یہودی مدینہ کے خلاف سازشوں اور دشمن قبائل کو اکسانے میں پیش پیش تھے۔ صلحِ حدیبیہ کے بعد نبی ﷺ نے خیبر کا رخ کیا۔ کئی قلعے فتح ہوئے؛ آخری اور مضبوط ترین قلعے کی فتح حضرت علی رضی اللہ عنہ کے ہاتھ پر ہوئی۔","فتح کے بعد زمین یہودیوں کے پاس بٹائی پر رہنے دی گئی۔ اسی غزوے کے بعد حضرت جعفر رضی اللہ عنہ حبشہ سے واپس آئے۔"],"r":"حوالہ: صحیح بخاری (غزوۂ خیبر)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h14","era":"seerat","y":"630ء / 8 ھ","t":"فتحِ مکہ","d":"دس ہزار صحابہ کے ساتھ مکہ میں داخلہ۔","b":["قریش نے صلحِ حدیبیہ کی خلاف ورزی کی تو نبی ﷺ دس ہزار صحابہ کے ساتھ مکہ کی طرف روانہ ہوئے۔ ابو سفیان نے اسلام قبول کر لیا اور آپ ﷺ نے اعلان فرمایا کہ جو ابو سفیان کے گھر میں پناہ لے یا اپنا دروازہ بند کر لے وہ محفوظ ہے۔","مکہ میں داخلے کے وقت نبی ﷺ نے سر جھکا رکھا تھا۔ کعبہ سے 360 بت گرائے گئے اور آپ ﷺ نے تلاوت فرمائی: \"حق آ گیا اور باطل مٹ گیا\" (الاسراء: 81)۔ جن لوگوں نے برسوں ظلم کیے تھے ان سے فرمایا: \"آج تم پر کوئی ملامت نہیں، جاؤ تم سب آزاد ہو۔\" یہ عام معافی انسانی تاریخ کی بے مثال مثال ہے۔"],"r":"حوالہ: الاسراء (81)، سورۃ النصر؛ صحیح بخاری (فتح مکہ)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h15","era":"seerat","y":"630ء / 8 ھ","t":"غزوۂ حنین","d":"ہوازن سے مقابلہ۔","b":["فتحِ مکہ کے بعد قبیلۂ ہوازن اور ثقیف نے مسلمانوں کے مقابلے کی تیاری کی۔ حنین کے مقام پر بارہ ہزار کا لشکر پہنچا؛ تعداد کی کثرت پر کچھ فخر ہوا تو ابتدا میں مسلمانوں کو دھچکا لگا۔ نبی ﷺ ثابت قدم رہے اور صحابہ کو پکارا۔ پھر اللہ کی مدد سے فتح ہوئی۔","اس کے بعد نبی ﷺ نے مالِ غنیمت نئے مسلمان ہونے والوں کی تالیفِ قلب کے لیے بھی تقسیم فرمایا، اور ہوازن کے قیدی ان کی درخواست پر آزاد کر دیے۔"],"r":"حوالہ: التوبہ (25–26)؛ صحیح بخاری۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h16","era":"seerat","y":"630ء / 9 ھ","t":"غزوۂ تبوک","d":"رومیوں کے مقابلے کے لیے سفر۔","b":["شام کی سرحد پر رومی لشکر کی تیاری کی خبر پر نبی ﷺ نے شدید گرمی اور قحط کے زمانے میں تیس ہزار صحابہ کے ساتھ تبوک کا رخ کیا۔ صحابہ نے دل کھول کر مالی تعاون کیا؛ حضرت عثمان رضی اللہ عنہ نے بہت بڑی رقم اور سامان پیش کیا اور حضرت ابو بکر رضی اللہ عنہ نے گھر کا سارا سامان لا کر رکھ دیا۔","رومی سامنے نہ آئے اور بغیر جنگ کے واپسی ہوئی۔ جو تین صحابہ (کعب بن مالک، ہلال بن امیہ، مرارہ بن ربیع) بلا عذر پیچھے رہ گئے تھے ان کا پچاس دن بائیکاٹ ہوا، پھر ان کی سچی توبہ قبول ہوئی (التوبہ: 118)۔"],"r":"حوالہ: التوبہ (38–42، 117–118)؛ صحیح بخاری۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h17","era":"seerat","y":"632ء / 10 ھ","t":"خطبۂ حجۃ الوداع","d":"آخری حج اور عالمگیر خطبہ۔","b":["10 ہجری میں نبی ﷺ نے ایک لاکھ سے زائد صحابہ کے ساتھ حج ادا فرمایا۔ عرفات کے میدان میں آپ ﷺ نے فرمایا: تمہارے خون، مال اور عزتیں ایک دوسرے پر حرام ہیں؛ جاہلیت کا سود اور خون کے بدلے ختم کیے جاتے ہیں؛ عورتوں کے بارے میں اللہ سے ڈرو؛ کسی عربی کو عجمی پر اور عجمی کو عربی پر کوئی فضیلت نہیں سوائے تقویٰ کے۔","فرمایا کہ میں تم میں دو چیزیں چھوڑ رہا ہوں: اللہ کی کتاب اور میری سنت، جب تک انہیں تھامے رکھو گے گمراہ نہ ہو گے۔ اسی موقع پر یہ آیت نازل ہوئی: \"آج میں نے تمہارے لیے تمہارا دین مکمل کر دیا\" (المائدہ: 3)۔"],"r":"حوالہ: المائدہ (3)؛ صحیح مسلم (حدیث جابر)، صحیح بخاری۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h18","era":"seerat","y":"632ء / 11 ھ","t":"وفاتِ نبی ﷺ","d":"رسول اللہ ﷺ کا وصال۔","b":["صفر کے آخر میں نبی ﷺ بیمار ہوئے۔ مرض کے ایام ام المومنین حضرت عائشہ رضی اللہ عنہا کے حجرے میں گزارے۔ بیماری میں آپ ﷺ نے حضرت ابو بکر رضی اللہ عنہ کو نماز کی امامت کا حکم دیا۔ 12 ربیع الاول 11 ہجری (روایت مشہور) کو آپ ﷺ کا وصال ہوا۔","حضرت عمر رضی اللہ عنہ شدتِ صدمہ میں انکار کرتے رہے، مگر حضرت ابو بکر رضی اللہ عنہ نے خطبہ دیا: \"جو محمد ﷺ کی عبادت کرتا تھا وہ جان لے کہ محمد ﷺ وفات پا گئے، اور جو اللہ کی عبادت کرتا تھا وہ جان لے کہ اللہ زندہ ہے اور اسے موت نہیں\" اور آیت پڑھی (آل عمران: 144)۔ آپ ﷺ حجرۂ عائشہ میں دفن ہوئے جو آج مسجدِ نبوی میں شامل ہے۔"],"r":"حوالہ: آل عمران (144)، الزمر (30)؛ صحیح بخاری (کتاب المغازی)۔ ماخذ: قرآنِ مجید، صحیح بخاری و صحیح مسلم، سیرت ابن ہشام؛ اردو میں: سیرت المصطفیٰ (مولانا محمد ادریس کاندھلوی ؒ)، سیرتِ خاتم الانبیاء (مفتی محمد شفیع ؒ)۔"},{"id":"h19","era":"khilafat","y":"632ء / 11 ھ","t":"سقیفۂ بنی ساعدہ اور خلافتِ ابو بکر ؓ","d":"پہلے خلیفہ کا انتخاب۔","b":["نبی ﷺ کی وفات کے فوراً بعد انصار سقیفۂ بنی ساعدہ میں جمع ہوئے۔ حضرت ابو بکر، حضرت عمر اور حضرت ابو عبیدہ رضی اللہ عنہم وہاں پہنچے۔ حضرت ابو بکر کی حکمت و دلائل سے بات واضح ہو گئی کہ خلافت قریش میں رہے گی، اور حضرت عمر رضی اللہ عنہ نے سب سے پہلے ان کے ہاتھ پر بیعت کی، پھر سب نے بیعت کی۔","یہ امت کے اتفاق (اجماع) کی پہلی بڑی مثال ہے، اور اہلِ سنت کے نزدیک ابو بکر صدیق رضی اللہ عنہ انبیاء کے بعد امت کے افضل ترین انسان ہیں۔"],"r":"ماخذ: صحیح بخاری، تاریخ الطبری، البدایہ والنہایہ (ابن کثیر)؛ اردو میں: تاریخِ اسلام (شاہ معین الدین ندوی)، اور علماءِ دیوبند کی سیرتِ صحابہ و خلفائے راشدین پر کتب۔"},{"id":"h20","era":"khilafat","y":"632–633ء / 11–12 ھ","t":"فتنۂ ارتداد اور منکرینِ زکوٰۃ","d":"دین کی حفاظت کی بڑی مہم۔","b":["نبی ﷺ کی وفات کے بعد کئی قبائل زکوٰۃ دینے سے انکاری ہو گئے اور کچھ نے مسیلمہ کذاب، اسود عنسی اور طلیحہ جیسے جھوٹے مدعیانِ نبوت کی پیروی کی۔ بعض صحابہ نے مصلحتاً نرمی کا مشورہ دیا، مگر حضرت ابو بکر رضی اللہ عنہ نے
