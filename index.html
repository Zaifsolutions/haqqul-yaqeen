<script type="application/json" id="hy-data">{"site":{"tagline":"ہر بہن اور ہر بیٹی کے لیے دین سیکھنے کا آسان، مستند اور خوبصورت ٹھکانہ","about":"حق الیقین انسٹیٹیوٹ ایک تعلیمی پلیٹ فارم ہے جہاں خواتین اور بچیاں ہر عمر میں قرآن، سیرتِ انبیاء اور دینی علم آسان اردو میں سیکھ سکتی ہیں۔ ہمارا مقصد یہ ہے کہ دین کی بات سادہ زبان میں، ترتیب کے ساتھ اور محبت سے پہنچائی جائے۔","contact":""},"lectures":[],"stories":[{"cat":"anbiya","id":"p-adam","title":"حضرت آدم علیہ السلام","sub":"پہلے انسان اور پہلے نبی","ref":"البقرہ 30–39، الاعراف 11–25","body":"اللہ تعالیٰ نے فرشتوں سے فرمایا کہ میں زمین میں ایک خلیفہ بنانے والا ہوں۔ پھر اللہ نے آدمؑ کو مٹی سے پیدا کیا، ان میں روح پھونکی اور انہیں چیزوں کے نام سکھائے۔ جب فرشتوں سے پوچھا گیا تو انہوں نے اپنی لاعلمی کا اعتراف کیا، اور آدمؑ نے وہ نام بتا دیے۔ یوں علم کی فضیلت ظاہر ہوئی۔\n\nاللہ کے حکم سے فرشتوں نے آدمؑ کے سامنے سجدہ کیا، مگر ابلیس نے تکبر کی وجہ سے انکار کیا۔ آدمؑ اور ان کی بیوی حضرت حواؑ کو جنت میں رہنے کی جگہ دی گئی اور ایک درخت کے قریب جانے سے منع کیا گیا۔ شیطان نے وسوسہ ڈالا اور دونوں سے لغزش ہو گئی۔\n\nآدمؑ اور حواؑ نے فوراً کہا: \"اے ہمارے رب! ہم نے اپنی جانوں پر ظلم کیا، اگر تو نے ہمیں معاف نہ کیا اور ہم پر رحم نہ کیا تو ہم نقصان اٹھانے والوں میں ہوں گے۔\" اللہ نے ان کی توبہ قبول فرمائی۔","lessons":["علم انسان کی سب سے بڑی فضیلت ہے۔","تکبر سب سے پہلا گناہ تھا، اور عاجزی سے توبہ سب سے پہلی نیکی۔","غلطی ہو جائے تو شیطان کی طرح اڑ جانے کے بجائے آدمؑ کی طرح فوراً توبہ کرنی چاہیے۔"]},{"cat":"anbiya","id":"p-nuh","title":"حضرت نوح علیہ السلام","sub":"صبر کے پیکر","ref":"ہود 25–48، نوح","body":"حضرت نوحؑ اپنی قوم کو ساڑھے نو سو سال تک اللہ کی طرف بلاتے رہے۔ قوم بتوں کی پوجا کرتی تھی۔ آپؑ نے دن رات، چھپ کر اور کھل کر سمجھایا، مگر تھوڑے سے لوگوں کے سوا کوئی ایمان نہ لایا۔\n\nپھر اللہ نے حکم دیا کہ ایک کشتی بناؤ۔ قوم اس پر ہنستی اور مذاق اڑاتی تھی۔ جب اللہ کا حکم آیا تو زمین سے پانی ابل پڑا اور آسمان سے موسلا دھار بارش ہوئی۔ نوحؑ اپنے ایمان والے ساتھیوں کے ساتھ کشتی میں سوار ہوئے اور اللہ کے حکم سے ہر جانور کا ایک ایک جوڑا بھی ساتھ لیا گیا۔\n\nنوحؑ کا ایک بیٹا ایمان نہ لایا اور وہ بھی طوفان میں ڈوب گیا۔ اللہ نے سمجھایا کہ نجات کا تعلق نسب سے نہیں، ایمان اور نیک عمل سے ہے۔ آخر کشتی جودی پہاڑ پر ٹھہری۔","lessons":["دعوت کے راستے میں صبر اور استقامت چاہیے، چاہے نتیجہ دیر سے ملے۔","اللہ کے حکم پر عمل کرنا چاہیے چاہے لوگ مذاق اڑائیں۔","رشتہ دار ہونا نجات کی ضمانت نہیں، ایمان ضروری ہے۔"]},{"id":"p-hud","cat":"anbiya","title":"حضرت ہود علیہ السلام","sub":"قومِ عاد کی طرف بھیجے گئے نبی","ref":"الاعراف 65–72، ہود 50–60، الاحقاف 21–26، الحاقہ 6–8","body":"قومِ عاد، حضرت نوح علیہ السلام کے بعد آنے والی ایک طاقتور قوم تھی۔ اللہ نے انہیں مضبوط جسم، بڑی بڑی عمارتیں اور بے شمار نعمتیں دیں۔ مگر وہ اللہ کو بھول گئے، بتوں کو پوجنے لگے اور طاقت کے گھمنڈ میں کہتے تھے: \"ہم سے زیادہ طاقتور کون ہے؟\"\n\nاللہ نے انہی میں سے حضرت ہود علیہ السلام کو بھیجا۔ انہوں نے فرمایا: \"اے میری قوم! اللہ کی عبادت کرو، اس کے سوا تمہارا کوئی معبود نہیں۔ اپنے رب سے معافی مانگو اور اس کی طرف لوٹ آؤ، وہ تم پر خوب بارشیں برسائے گا اور تمہاری طاقت میں اور اضافہ کرے گا۔\" قوم کے سرداروں نے الٹا ان کا مذاق اڑایا اور کہا: \"ہم تمہاری بات نہیں مانیں گے، ہم اپنے معبودوں کو نہیں چھوڑ سکتے۔\"\n\nحضرت ہودؑ نے صاف کہہ دیا کہ میں تم سے کوئی اجر نہیں مانگتا اور میرا بھروسہ اللہ پر ہے۔ جب قوم نے سرکشی نہ چھوڑی تو اللہ کا عذاب آیا۔ پھر ایک دن انہوں نے آسمان پر بادل دیکھا اور خوش ہوئے کہ بارش آ رہی ہے۔ مگر وہ عذاب کی آندھی تھی۔ قرآن کے مطابق سات راتیں اور آٹھ دن مسلسل تیز ہوا چلی، جس نے طاقتور لوگوں کو اس طرح گرا دیا جیسے کھجور کے کھوکھلے تنے پڑے ہوں۔ حضرت ہودؑ اور ان کے ساتھ ایمان لانے والوں کو اللہ نے بچا لیا۔","lessons":["طاقت اور دولت اللہ کی نعمت ہیں، ان پر گھمنڈ تباہی لاتا ہے۔","استغفار اور توبہ سے رزق اور طاقت میں اضافہ ہوتا ہے۔","نبی کی دعوت بے لوث ہوتی ہے، دین کا کام کر کے دنیا کا اجر نہیں مانگنا چاہیے۔"]},{"id":"p-salih","cat":"anbiya","title":"حضرت صالح علیہ السلام","sub":"قومِ ثمود اور اللہ کی اونٹنی","ref":"الاعراف 73–79، ہود 61–68، الشعراء 141–159، الشمس 11–15","body":"قومِ ثمود حجر کے علاقے میں رہتی تھی۔ وہ پہاڑوں کو تراش کر گھر بناتے اور کھیتوں اور باغوں میں خوش حال زندگی گزارتے تھے۔ اس خوش حالی میں وہ اللہ کو بھول کر بتوں کی پوجا کرنے لگے۔ اللہ نے ان کی طرف حضرت صالح علیہ السلام کو بھیجا، جو اسی قوم کے ایک سچے اور امانت دار آدمی تھے۔\n\nقوم نے مطالبہ کیا کہ کوئی نشانی دکھاؤ۔ اللہ نے ایک پہاڑ کی چٹان سے ایک اونٹنی نکالی اور حضرت صالحؑ نے فرمایا: \"یہ اللہ کی اونٹنی ہے، تمہارے لیے نشانی ہے۔ اسے زمین میں چرنے دو اور اسے برا ارادے سے نہ چھونا۔ کنویں کے پانی کی ایک دن باری اس کی ہے اور ایک دن تمہاری۔\" مگر ان کے بدبخت لوگوں نے مل کر اس اونٹنی کی کونچیں کاٹ دیں اور اسے مار ڈالا، اور مذاق میں بولے: \"صالح! جس عذاب کی دھمکی دیتے تھے وہ لے آؤ۔\"\n\nحضرت صالحؑ نے فرمایا: \"اپنے گھروں میں تین دن مزے کر لو، یہ وعدہ جھوٹا نہیں۔\" تین دن بعد ایک ہولناک چیخ اور زلزلے نے انہیں پکڑ لیا اور وہ اپنے گھروں میں اوندھے پڑے رہ گئے۔ ایمان لانے والوں کو اللہ نے بچا لیا۔\n\nصحیح بخاری میں ہے کہ غزوۂ تبوک کے سفر میں جب نبی کریم ﷺ حجر کے علاقے سے گزرے تو فرمایا: \"ان عذاب پانے والوں کی بستیوں میں روتے ہوئے ہی داخل ہو، اگر رو نہ سکو تو داخل نہ ہو، کہیں تم پر بھی وہی عذاب نہ آ جائے۔\"","lessons":["اللہ کی نشانی اور اس کے حکم کی بے ادبی بہت بڑی ہلاکت کا سبب ہے۔","ایک بدبخت کے کیے پر پوری قوم خوش یا خاموش رہے تو سب عذاب میں شریک ہوتے ہیں۔","عذاب والی جگہوں سے عبرت لی جاتی ہے، تفریح نہیں۔"]},{"cat":"anbiya","id":"p-ibrahim","title":"حضرت ابراہیم علیہ السلام","sub":"خلیل اللہ","ref":"الانبیاء 51–73، الصافات 83–113","body":"حضرت ابراہیمؑ نے بچپن سے سوچ سمجھ کر توحید کو پہچانا۔ انہوں نے اپنی قوم سے پوچھا کہ یہ مورتیاں کیا ہیں جن کے آگے تم جھکتے ہو؟ ایک دن موقع پا کر انہوں نے بتوں کو توڑ دیا اور بڑے بت کے گلے میں کلہاڑی لٹکا دی تاکہ قوم خود سوچے کہ جو بت اپنی حفاظت نہیں کر سکتے وہ کسی کی مدد کیا کریں گے۔\n\nقوم نے آپؑ کو آگ میں ڈالنے کا فیصلہ کیا۔ اللہ نے حکم دیا: \"اے آگ! ابراہیم پر ٹھنڈی اور سلامتی والی بن جا۔\" آگ نے آپؑ کو کوئی نقصان نہ پہنچایا۔\n\nبعد میں اللہ نے آپؑ کو بڑھاپے میں بیٹے حضرت اسماعیلؑ عطا فرمائے۔ پھر خواب میں انہیں قربان کرنے کا حکم ملا۔ باپ اور بیٹا دونوں اللہ کے حکم پر راضی ہو گئے، تو اللہ نے ایک بڑی قربانی کا فدیہ عطا فرما دیا۔ باپ بیٹے نے مل کر کعبہ کی بنیادیں بھی اٹھائیں۔","lessons":["حق کی بات کے لیے عقل اور دلیل کے ساتھ ڈٹ جانا چاہیے۔","اللہ پر بھروسا کرنے والے کو وہ ایسی جگہ سے بچاتا ہے جہاں سے خیال بھی نہ ہو۔","اللہ کی رضا کے لیے سب سے عزیز چیز بھی قربان کرنے کو تیار رہنا چاہیے۔"]},{"id":"p-lut","cat":"anbiya","title":"حضرت لوط علیہ السلام","sub":"حیا اور پاکیزگی کی دعوت","ref":"الاعراف 80–84، ہود 77–83، الحجر 57–77، النمل 54–58","body":"حضرت لوط علیہ السلام، حضرت ابراہیم علیہ السلام کے بھتیجے تھے اور سدوم کی بستیوں کی طرف نبی بنا کر بھیجے گئے۔ یہ لوگ ایسی بے حیائی میں مبتلا تھے جو ان سے پہلے دنیا میں کسی نے نہیں کی تھی۔ حضرت لوطؑ نے فرمایا: \"کیا تم ایسی بے حیائی کرتے ہو جو تم سے پہلے کسی نے نہیں کی؟ اللہ سے ڈرو اور میری بات مانو۔\" جواب میں قوم نے بدتمیزی سے کہا: \"ان لوگوں کو اپنی بستی سے نکال دو، یہ بڑے پاکباز بنتے ہیں۔\"\n\nایک دن اللہ کے بھیجے ہوئے فرشتے خوبصورت مہمانوں کی صورت میں حضرت لوطؑ کے پاس آئے۔ وہ پریشان ہو گئے کہ قوم انہیں تنگ کرے گی۔ جب قوم کے لوگ دوڑتے ہوئے آئے تو حضرت لوطؑ نے ان کے سامنے عزت اور حیا کی بات رکھی مگر وہ باز نہ آئے۔ تب فرشتوں نے اپنی حقیقت بتائی اور کہا: \"ہم آپ کے رب کے بھیجے ہوئے ہیں، یہ لوگ آپ تک نہیں پہنچ سکیں گے۔ رات کے آخری حصے میں اپنے گھر والوں کے ساتھ نکل جائیں اور کوئی پیچھے مڑ کر نہ دیکھے۔\"\n\nصبح ہوتے ہی اللہ نے ان بستیوں کو الٹ دیا اور ان پر پتھروں کی بارش برسائی۔ حضرت لوطؑ اور ان کے ماننے والے محفوظ رہے، مگر ان کی بیوی، جو قوم کے ساتھ تھی، ہلاک ہونے والوں میں رہی۔","lessons":["حیا اور پاکیزگی ایمان کا حصہ ہیں، بے حیائی قوموں کو تباہ کرتی ہے۔","نبی کی بیوی بھی ہو تو ایمان کے بغیر نجات نہیں، ہر ایک اپنے عمل کا ذمہ دار ہے۔","مہمان کی عزت اور اس کی حفاظت نبیوں کی سنت ہے۔"]},{"id":"p-ismail","cat":"anbiya","title":"حضرت اسماعیل علیہ السلام اور حضرت ہاجرہ","sub":"مکہ کی آبادی، زمزم اور قربانی","ref":"صحیح بخاری (کتاب احادیث الانبیاء)، البقرہ 125–129، الصافات 100–111","body":"حضرت ابراہیم علیہ السلام اللہ کے حکم سے اپنی بیوی حضرت ہاجرہ اور شیر خوار بیٹے حضرت اسماعیل کو ایک بے آب و گیاہ وادی میں چھوڑ گئے، جہاں آج مکہ مکرمہ ہے۔ ساتھ کھجوریں اور مشکیزہ بھر پانی تھا۔ جاتے وقت حضرت ہاجرہ نے پوچھا: \"کیا اللہ نے آپ کو یہ حکم دیا ہے؟\" فرمایا: \"ہاں۔\" تو بولیں: \"پھر اللہ ہمیں ضائع نہیں کرے گا۔\"\n\nجب پانی ختم ہو گیا اور بچہ پیاس سے تڑپنے لگا تو حضرت ہاجرہ بچے کو چھوڑ کر پانی کی تلاش میں صفا اور مروہ کی پہاڑیوں کے درمیان سات بار دوڑیں۔ ساتویں بار انہوں نے ایک آواز سنی۔ حضرت جبرائیل علیہ السلام نے حضرت اسماعیلؑ کے پاس زمین کو ایڑی یا پر مارا تو پانی ابل پڑا۔ حضرت ہاجرہ اس کے گرد حوض بناتی گئیں اور فرماتی رہیں: \"زم زم\" یعنی رک جا۔ نبی کریم ﷺ نے فرمایا: \"اللہ اسماعیل کی ماں پر رحم کرے، اگر وہ زمزم کو یوں ہی چھوڑ دیتیں تو وہ بہتا ہوا چشمہ بن جاتا۔\" صفا و مروہ کی سعی انہی کی سنت ہے۔\n\nبعد میں قبیلہ جرہم وہاں آ کر بسا اور مکہ آباد ہوا۔ حضرت اسماعیلؑ جوان ہوئے تو حضرت ابراہیمؑ نے خواب میں انہیں ذبح کرتے دیکھا۔ بیٹے سے ذکر کیا تو انہوں نے فرمایا: \"ابا جان! جو حکم ملا ہے کر گزریں، ان شاء اللہ آپ مجھے صبر کرنے والوں میں پائیں گے۔\" جب باپ نے بیٹے کو لٹا دیا تو اللہ نے آواز دی: \"اے ابراہیم! تم نے خواب سچ کر دکھایا۔\" اور ذبح کے بدلے ایک بڑا مینڈھا فدیے میں دے دیا۔ پھر دونوں باپ بیٹے نے مل کر بیت اللہ (کعبہ) کی بنیادیں اٹھائیں اور دعا کی: \"اے ہمارے رب! ہم سے قبول فرما۔\"","lessons":["اللہ پر مکمل بھروسہ کرنے والوں کو اللہ ضائع نہیں کرتا۔","حج کے بہت سے اعمال ایک ماں کی ہمت اور اللہ پر یقین کی یادگار ہیں۔","اللہ کے حکم کے آگے ہر محبت قربان کی جا سکتی ہے، اور اللہ اس سے بہتر بدلہ دیتا ہے۔"]},{"cat":"anbiya","id":"p-yusuf","title":"حضرت یوسف علیہ السلام","sub":"قرآن کا سب سے خوبصورت قصہ","ref":"سورۃ یوسف","body":"حضرت یوسفؑ نے بچپن میں خواب دیکھا کہ گیارہ ستارے اور سورج اور چاند انہیں سجدہ کر رہے ہیں۔ والد حضرت یعقوبؑ نے کہا کہ یہ خواب اپنے بھائیوں کو نہ بتانا۔ مگر بھائی حسد میں مبتلا ہو گئے، اور انہوں نے یوسفؑ کو کنویں میں ڈال دیا۔\n\nایک قافلے نے انہیں نکالا اور مصر میں بیچ دیا۔ وہاں عزیزِ مصر کے گھر میں پرورش پائی۔ ایک موقع پر آپؑ کو گناہ کی طرف بلایا گیا، مگر آپؑ نے اللہ کے خوف سے صاف انکار کیا۔ اس کے باوجود آپؑ کو برسوں قید میں رہنا پڑا۔\n\nقید میں آپؑ نے خوابوں کی تعبیر بتائی، اور بعد میں بادشاہ کے خواب کی تعبیر سے مصر کو قحط سے بچانے کا منصوبہ دیا۔ آپؑ کو خزانوں کا ذمہ دار بنایا گیا۔ جب بھائی غلہ لینے آئے تو آپؑ نے انہیں پہچان لیا، اور آخر میں سب کو معاف کر دیا۔ والدین اور بھائی مصر آئے تو بچپن کے خواب کی تعبیر پوری ہو گئی۔","lessons":["حسد انسان کو ظلم تک لے جاتا ہے۔","پاکدامنی اور اللہ کا خوف سب سے بڑی حفاظت ہے۔","معاف کرنا طاقت اور بڑائی ہے۔","اللہ کی تدبیر دیر سے سہی، مگر ہمیشہ بہترین ہوتی ہے۔"]},{"cat":"anbiya","id":"p-ayyub","title":"حضرت ایوب علیہ السلام","sub":"صبرِ جمیل کی مثال","ref":"الانبیاء 83–84، ص 41–44","body":"حضرت ایوبؑ اللہ کے نیک نبی تھے۔ انہیں مال، اولاد اور صحت جیسی نعمتیں حاصل تھیں۔ پھر اللہ نے انہیں آزمایا، اور وہ ایک طویل اور سخت بیماری میں مبتلا ہو گئے۔\n\nان کی بیوی نے ان کی بہت خدمت کی اور ہر حال میں ساتھ دیا۔ ایوبؑ نے کبھی شکوہ نہیں کیا۔ آخر انہوں نے نہایت ادب سے اللہ کو پکارا: \"مجھے تکلیف پہنچی ہے اور تو سب رحم کرنے والوں سے بڑھ کر رحم کرنے والا ہے۔\"\n\nاللہ نے دعا قبول کی، انہیں شفا دی اور اپنی رحمت سے انہیں پہلے سے زیادہ عطا فرمایا۔ قرآن نے انہیں \"بہترین بندہ\" کہا۔","lessons":["آزمائش میں شکوے کے بجائے اللہ سے دعا کرنی چاہیے۔","صبر کرنے والوں کے ساتھ اللہ کی خاص رحمت ہوتی ہے۔","مشکل وقت میں ساتھ دینے والا گھر والا بہت بڑی نعمت ہے۔"]},{"id":"p-shuaib","cat":"anbiya","title":"حضرت شعیب علیہ السلام","sub":"ناپ تول میں ایمانداری کی دعوت","ref":"الاعراف 85–93، ہود 84–95، الشعراء 176–191","body":"اہلِ مدین ایک تجارت پیشہ قوم تھی۔ ان میں شرک بھی تھا اور ایک بڑی برائی یہ تھی کہ ناپ تول میں کمی کرتے تھے، لوگوں کا حق مارتے تھے اور راستوں میں بیٹھ کر لوگوں کو ڈراتے تھے۔ اللہ نے انہی میں حضرت شعیب علیہ السلام کو بھیجا۔\n\nانہوں نے فرمایا: \"اے میری قوم! اللہ کی عبادت کرو، اس کے سوا تمہارا کوئی معبود نہیں۔ ناپ اور تول پورا کرو، لوگوں کی چیزوں میں کمی نہ کرو اور زمین میں فساد نہ پھیلاؤ۔ میں تمہارا خیرخواہ ہوں۔\" قوم نے جواب دیا: \"کیا تمہاری نماز تمہیں یہ سکھاتی ہے کہ ہم اپنے باپ دادا کے معبودوں کو چھوڑ دیں اور اپنے مال میں اپنی مرضی سے تصرف نہ کریں؟\" انہوں نے حضرت شعیبؑ کو دھمکی دی کہ ہم تمہیں بستی سے نکال دیں گے۔\n\nحضرت شعیبؑ نے ہر طرح سمجھایا، مگر قوم باز نہ آئی۔ پھر ایک سخت زلزلے اور ہولناک آواز نے انہیں پکڑ لیا اور وہ اپنے گھروں میں مردہ پڑے رہ گئے۔ سورۃ الشعراء میں ہے کہ \"اصحاب الایکہ\" کو ایک سایہ دار بادل کے دن عذاب نے آ لیا۔ حضرت شعیبؑ اور مومنین بچا لیے گئے۔ یہ وہی حضرت شعیبؑ ہیں جن کی بیٹی سے حضرت موسیٰ علیہ السلام کا نکاح ہوا (القصص 22–28)۔","lessons":["ناپ تول اور لین دین میں دیانت داری عبادت کا حصہ ہے۔","دین، نماز اور معاملات الگ الگ نہیں، نماز انسان کو ایمانداری بھی سکھاتی ہے۔","حق بات کہنے والے کو ڈرایا جائے تو بھی ثابت قدم رہنا چاہیے۔"]},{"cat":"anbiya","id":"p-musa","title":"حضرت موسیٰ علیہ السلام","sub":"فرعون کے مقابلے میں حق کی آواز","ref":"القصص 1–43، طٰہٰ 9–98","body":"جب فرعون نے بنی اسرائیل کے بچوں کو قتل کرنے کا حکم دیا تو اللہ نے موسیٰؑ کی والدہ کے دل میں ڈالا کہ بچے کو صندوق میں رکھ کر دریا میں ڈال دو، ہم اسے تمہارے پاس لوٹا دیں گے۔ وہی بچہ فرعون کے محل میں پلا۔ بعد میں اللہ نے والدہ کے پاس دودھ پلانے کے لیے انہیں لوٹا دیا۔\n\nجوان ہو کر موسیٰؑ مدین گئے، وہاں کئی سال رہے اور پھر واپسی پر وادیٔ طویٰ میں اللہ نے انہیں نبوت عطا کی۔ انہیں فرعون کے پاس جا کر نرمی سے بات کرنے کا حکم ہوا۔ فرعون نے تکبر کیا، لیکن اللہ نے موسیٰؑ کو معجزات عطا کیے۔\n\nآخر موسیٰؑ بنی اسرائیل کو لے کر نکلے۔ آگے سمندر اور پیچھے فرعون کا لشکر تھا۔ اللہ کے حکم سے سمندر پھٹ گیا، بنی اسرائیل پار ہو گئے اور فرعون اپنے لشکر سمیت غرق ہو گیا۔","lessons":["اللہ اپنے بندوں کی حفاظت ایسی جگہ سے کرتا ہے جہاں سے وہم و گمان بھی نہ ہو۔","ظالم کتنا ہی طاقتور ہو، انجام اللہ کے ہاتھ میں ہے۔","بات کرنے میں نرمی اختیار کرنی چاہیے، فرعون سے بھی نرمی کا حکم تھا۔"]},{"id":"p-dawud","cat":"anbiya","title":"حضرت داؤد علیہ السلام","sub":"نبوت اور بادشاہت، زبور اور شکر گزاری","ref":"البقرہ 246–251، ص 17–25، سبا 10–13، صحیح بخاری و مسلم","body":"حضرت داؤد علیہ السلام ایک نوجوان کے طور پر بنی اسرائیل کے لشکر میں شامل ہوئے۔ بنی اسرائیل کے لشکر کا مقابلہ ظالم بادشاہ جالوت کی فوج سے تھا جو بہت طاقتور تھا۔ قرآن بتاتا ہے کہ \"داؤد نے جالوت کو قتل کیا\" (البقرہ 251)، اور اللہ نے انہیں بادشاہت اور حکمت عطا فرمائی اور جو چاہا سکھایا۔\n\nاللہ نے انہیں زبور عطا کی اور ان کی آواز اتنی دل کش تھی کہ جب وہ تسبیح پڑھتے تو پہاڑ اور پرندے بھی ان کے ساتھ تسبیح کرتے (ص 18–19)۔ اللہ نے ان کے لیے لوہے کو نرم کر دیا تاکہ وہ زرہیں بنائیں، اور آپ نے فرمایا کہ اپنے ہاتھوں کی کمائی سے کھانا بہتر ہے۔ نبی کریم ﷺ نے فرمایا: \"کسی نے اس سے بہتر کھانا نہیں کھایا کہ اپنے ہاتھ کی کمائی سے کھائے، اور اللہ کے نبی داؤد علیہ السلام اپنے ہاتھ کی کمائی سے کھاتے تھے۔\" (صحیح بخاری)\n\nعبادت میں ان کا طریقہ بہت پسندیدہ تھا۔ نبی کریم ﷺ نے فرمایا: \"اللہ کو سب سے پسندیدہ نماز داؤدؑ کی نماز ہے، اور سب سے پسندیدہ روزہ داؤدؑ کا روزہ ہے۔ وہ آدھی رات سوتے، تہائی رات نماز پڑھتے اور چھٹا حصہ سوتے تھے، اور ایک دن روزہ رکھتے اور ایک دن نہ رکھتے۔\" (صحیح بخاری و مسلم) اللہ نے فرمایا: \"اے آلِ داؤد! شکر گزاری کے ساتھ عمل کرو\" (سبا 13)۔","lessons":["بادشاہی ملنے کے بعد بھی ہاتھ کی کمائی اور محنت سنت ہے۔","اعتدال کی عبادت ہمیشگی کی عبادت سے بہتر ہے۔","اللہ کی دی ہوئی طاقت اور حکمت پر شکر ادا کرنا چاہیے۔"]},{"id":"p-sulaiman","cat":"anbiya","title":"حضرت سلیمان علیہ السلام","sub":"ہدہد، چیونٹی اور ملکہ سبا","ref":"النمل 15–44، سبا 12–14، ص 30–40","body":"حضرت سلیمان علیہ السلام، حضرت داؤد علیہ السلام کے بیٹے اور وارث تھے۔ اللہ نے انہیں ایسی بادشاہت دی جو کسی اور کو نہ ملی: ہوا، جن اور پرندے ان کے تابع تھے، اور وہ پرندوں اور چیونٹیوں کی بولی بھی سمجھتے تھے۔ مگر وہ ہر نعمت کو اللہ کا فضل کہتے اور شکر کرتے تھے۔\n\nایک بار ان کا لشکر ایک وادی سے گزرا تو ایک چیونٹی نے کہا: \"اے چیونٹیو! اپنے بلوں میں گھس جاؤ، کہیں سلیمان اور ان کا لشکر بے خبری میں تمہیں روند نہ دے۔\" حضرت سلیمانؑ اس بات پر مسکرائے اور دعا کی: \"اے میرے رب! مجھے توفیق دے کہ میں تیری اس نعمت کا شکر ادا کروں جو تو نے مجھ پر اور میرے والدین پر کی۔\"\n\nایک دن ہدہد (پرندہ) غائب تھا۔ وہ لوٹا تو بتایا کہ میں سبا کی بستی سے خبر لایا ہوں جہاں ایک عورت حکومت کرتی ہے اور وہ سورج کو سجدہ کرتے ہیں۔ حضرت سلیمانؑ نے خط بھیجا جس میں \"بسم اللہ الرحمن الرحیم\" سے شروع کر کے اللہ کی طرف بلایا۔ ملکہ نے اپنے درباریوں سے مشورہ کیا اور تحفے بھیجے، مگر حضرت سلیمانؑ نے فرمایا کہ اللہ نے مجھے جو دیا ہے وہ تمہارے تحفوں سے بہتر ہے۔ آخرکار ملکہ خود حاضر ہوئی، حضرت سلیمانؑ کی نشانیاں دیکھ کر مسلمان ہو گئی اور کہا: \"میں سلیمان کے ساتھ اللہ رب العالمین کی فرماں بردار ہوتی ہوں۔\"\n\nحضرت سلیمانؑ کی وفات بھی عجیب تھی۔ وہ لاٹھی کے سہارے کھڑے تھے کہ فوت ہو گئے، اور جنات کو کافی دیر تک خبر نہ ہوئی۔ جب گھن کے کیڑے نے لاٹھی کھا لی اور جسم گرا تو جنات پر ظاہر ہوا کہ وہ غیب نہیں جانتے (سبا 14)۔","lessons":["طاقت اور بادشاہت ملنے پر عاجزی اور شکر گزاری اختیار کرنی چاہیے۔","اللہ کی دعوت دانائی اور نرمی سے دی جاتی ہے۔","غیب صرف اللہ جانتا ہے، جنات اور کوئی بھی مخلوق غیب نہیں جانتی۔"]},{"cat":"anbiya","id":"p-yunus","title":"حضرت یونس علیہ السلام","sub":"مچھلی کے پیٹ میں دعا","ref":"الانبیاء 87–88، الصافات 139–148","body":"حضرت یونسؑ کو اللہ نے نینویٰ کی قوم کی طرف بھیجا۔ قوم نے ماننے سے انکار کیا تو آپؑ ناراض ہو کر اللہ کے حکم کا انتظار کیے بغیر وہاں سے چلے گئے۔\n\nآپؑ کشتی میں سوار ہوئے۔ طوفان آیا اور قرعہ آپؑ کے نام نکلا۔ آپؑ سمندر میں گرے تو ایک بڑی مچھلی نے انہیں نگل لیا۔ اندھیروں میں آپؑ نے دعا کی: \"تیرے سوا کوئی معبود نہیں، تو پاک ہے، بے شک میں ہی ظالموں میں سے تھا۔\"\n\nاللہ نے دعا قبول کی، مچھلی نے انہیں کنارے پر ڈال دیا۔ ادھر قوم نے ایمان قبول کر لیا اور اللہ نے ان سے عذاب ٹال دیا۔","lessons":["غلطی کا احساس ہو جائے تو سچے دل سے اللہ کی طرف لوٹ آنا چاہیے۔","اندھیروں میں بھی اللہ کو پکارنے والے کی دعا سنی جاتی ہے۔","یہ دعا ہر پریشانی میں پڑھی جا سکتی ہے۔"]},{"id":"p-zakariyya","cat":"anbiya","title":"حضرت زکریا اور حضرت یحییٰ علیہما السلام","sub":"بڑھاپے کی دعا اور ایک نیک بیٹا","ref":"آل عمران 37–41، مریم 1–15، الانبیاء 89–90","body":"حضرت زکریا علیہ السلام بیت المقدس کے خادم اور اللہ کے نبی تھے۔ حضرت مریم علیہا السلام ان کی کفالت میں تھیں۔ وہ جب بھی ان کے عبادت خانے میں جاتے تو مریمؑ کے پاس بے موسم کے پھل دیکھتے اور پوچھتے: \"یہ کہاں سے آیا؟\" وہ جواب دیتیں: \"یہ اللہ کی طرف سے ہے، بے شک اللہ جسے چاہے بے حساب رزق دیتا ہے۔\"\n\nیہ دیکھ کر حضرت زکریاؑ کے دل میں آیا کہ جو اللہ بے موسم کے پھل دے سکتا ہے وہ بڑھاپے میں بھی اولاد دے سکتا ہے۔ انہوں نے چپکے چپکے دعا کی: \"اے میرے رب! میری ہڈیاں کمزور ہو گئی ہیں، سر بڑھاپے سے سفید ہو گیا ہے، اور اے رب! میں تجھ سے مانگ کر کبھی محروم نہیں رہا۔ مجھے اپنی طرف سے ایک وارث عطا فرما۔\" (سورۃ مریم)\n\nاللہ نے ان کی دعا قبول کی اور خوش خبری دی: \"ہم تمہیں ایک بیٹے کی خوش خبری دیتے ہیں جس کا نام یحییٰ ہے۔\" زکریاؑ نے حیرت سے کہا: \"میرے ہاں بیٹا کیسے ہوگا جبکہ میں بوڑھا ہوں اور میری بیوی بانجھ ہے؟\" فرمایا: \"اسی طرح، تیرا رب فرماتا ہے یہ مجھ پر آسان ہے۔\" نشانی کے طور پر انہیں تین دن تک لوگوں سے اشارے کے سوا بات کرنے سے روک دیا گیا۔\n\nحضرت یحییٰؑ کو اللہ نے بچپن ہی میں حکمت دی۔ قرآن ان کی تعریف میں فرماتا ہے: \"وہ نرم دل، پاکیزہ اور پرہیزگار تھے، اور اپنے والدین کے ساتھ نیکی کرنے والے تھے، سرکش اور نافرمان نہ تھے۔\"","lessons":["اللہ سے مانگنے میں کبھی مایوس نہ ہوں، چاہے اسباب کتنے ہی کمزور ہوں۔","اولاد کی دعا نیک اور دین دار اولاد کی ہونی چاہیے۔","والدین کے ساتھ نیکی اور نرمی نبیوں کی صفت ہے۔"]},{"id":"p-isa","cat":"anbiya","title":"حضرت عیسیٰ علیہ السلام","sub":"بغیر باپ کے پیدا ہونے والے نبی","ref":"آل عمران 42–59، مریم 16–36، المائدہ 110–118، النساء 157–159، صحیح بخاری و مسلم","body":"حضرت مریم علیہا السلام ایک نیک اور پاک باز خاتون تھیں۔ فرشتے نے آ کر انہیں خوش خبری دی کہ اللہ تمہیں ایک بیٹا دے گا جس کا نام مسیح عیسیٰ ابن مریم ہوگا۔ مریمؑ نے حیرت سے کہا: \"مجھے کوئی انسان چھوتا نہیں، میرا بیٹا کیسے ہوگا؟\" فرمایا گیا: \"اسی طرح، اللہ جو چاہتا ہے پیدا کرتا ہے۔\" قرآن کہتا ہے کہ عیسیٰؑ کی مثال اللہ کے نزدیک آدمؑ جیسی ہے جسے مٹی سے بنایا گیا (آل عمران 59)۔\n\nجب مریمؑ بچے کو لے کر قوم کے پاس آئیں تو لوگوں نے برا بھلا کہا۔ مریمؑ نے بچے کی طرف اشارہ کیا۔ نومولود عیسیٰؑ نے جھولے میں بات کی: \"میں اللہ کا بندہ ہوں، اس نے مجھے کتاب دی ہے اور مجھے نبی بنایا ہے، اور جہاں بھی میں ہوں مجھے بابرکت بنایا ہے۔\"\n\nبنی اسرائیل کے لیے اللہ نے انہیں معجزے عطا کیے: اللہ کے حکم سے مٹی کی چڑیا میں پھونک کر اسے زندہ پرندہ بنانا، پیدائشی اندھے اور کوڑھی کو شفا دینا اور مردوں کو زندہ کرنا۔ حضرت عیسیٰؑ نے ہر معجزے کے ساتھ فرمایا: \"اللہ کے حکم سے۔\" انہوں نے لوگوں کو توحید کی طرف بلایا اور حواریوں نے کہا: \"ہم اللہ کے مددگار ہیں۔\" لیکن بنی اسرائیل کے بہت لوگ ان کے دشمن ہو گئے۔\n\nقرآن بتاتا ہے کہ نہ انہوں نے عیسیٰؑ کو قتل کیا نہ سولی دی، بلکہ اللہ نے انہیں اپنی طرف اٹھا لیا (النساء 157–158)۔ صحیح احادیث کے مطابق قیامت سے پہلے وہ دوبارہ زمین پر نازل ہوں گے، دجال کو قتل کریں گے، صلیب توڑیں گے اور نبی کریم ﷺ کی شریعت کے مطابق حکومت کریں گے۔ عیسائیوں کا انہیں خدا یا خدا کا بیٹا کہنا درست نہیں، وہ اللہ کے بندے اور رسول ہیں۔","lessons":["اللہ کے لیے کچھ مشکل نہیں، وہ جیسے چاہے پیدا کرتا ہے۔","معجزے نبی کی اپنی طاقت نہیں، اللہ کے حکم سے ہوتے ہیں۔","حضرت مریم اور حضرت عیسیٰ دونوں اللہ کے بندے ہیں، اور ان کی شان میں غلو سے بچنا چاہیے۔"]},{"id":"p-muhammad","cat":"anbiya","title":"سیدنا محمد ﷺ کی ہجرت","sub":"طائف کی آزمائش سے مدینہ کی منزل تک","ref":"صحیح بخاری (کتاب بدء الخلق، مناقب الانصار)، سیرت ابن ہشام، التوبہ 40","body":"مکہ میں دعوت دیتے برسوں گزر گئے تو آپ ﷺ ایک بار طائف تشریف لے گئے کہ شاید وہ لوگ اسلام قبول کر لیں۔ مگر طائف کے سرداروں نے بدتمیزی کی اور شہر کے آوارہ لڑکوں کو پیچھے لگا دیا جنہوں نے پتھر مارے۔ آپ ﷺ کے قدم مبارک زخمی ہو گئے۔ ام المومنین حضرت عائشہ رضی اللہ عنہا نے پوچھا: \"کیا آپ پر احد کے دن سے بھی سخت دن آیا؟\" فرمایا: \"ہاں، طائف کا دن۔\" جب پہاڑوں کے فرشتے نے عرض کیا کہ اگر آپ فرمائیں تو میں ان پر دونوں پہاڑ گرا دوں، تو فرمایا: \"نہیں، مجھے امید ہے کہ اللہ ان کی نسلوں سے ایسے لوگ پیدا کرے گا جو صرف ایک اللہ کی عبادت کریں گے اور کسی کو اس کا شریک نہیں ٹھہرائیں گے۔\" (صحیح بخاری و مسلم)\n\nآخرکار قریش نے آپ ﷺ کے قتل کی سازش کی۔ اللہ کے حکم سے آپ ﷺ نے ہجرت کا ارادہ کیا۔ آپ ﷺ نے حضرت علی رضی اللہ عنہ کو اپنے بستر پر لٹایا، لوگوں کی امانتیں انہیں سونپیں، اور حضرت ابوبکر صدیق رضی اللہ عنہ کو ساتھ لے کر رات کو نکلے۔ دونوں نے غارِ ثور میں تین راتیں پناہ لی۔ کھوجی غار کے منہ تک پہنچ گئے تو حضرت ابوبکرؓ گھبرائے کہ اگر کوئی نیچے دیکھ لے تو ہمیں دیکھ لے گا۔ آپ ﷺ نے فرمایا: \"ابوبکر! ان دو کے بارے میں تمہارا کیا خیال ہے جن کا تیسرا اللہ ہے؟\" قرآن میں ہے: \"غم نہ کرو، بے شک اللہ ہمارے ساتھ ہے\" (التوبہ 40)۔\n\nحضرت اسماء بنت ابی بکر رضی اللہ عنہا خفیہ طور پر کھانا پہنچاتی رہیں، اور سفر کے توشے کا ایک بندھن اپنی اوڑھنی کو پھاڑ کر باندھا، اسی وجہ سے \"ذات النطاقین\" کہلائیں۔ بالآخر آپ ﷺ مدینہ پہنچے تو اہلِ مدینہ نے بے حد خوشی اور محبت سے استقبال کیا۔ یہیں سے اسلامی ریاست کی بنیاد پڑی، اور اسی ہجرت سے ہجری سن کا آغاز مانا جاتا ہے۔","lessons":["سخت ترین ظلم کے جواب میں بھی آپ ﷺ نے بد دعا نہیں کی، بلکہ ہدایت کی دعا کی۔","اللہ پر بھروسہ اور اسباب کی تدبیر دونوں ساتھ ضروری ہیں۔","صحابہ اور صحابیات نے دین کی خاطر گھر، وطن اور مال سب قربان کیا۔"]},{"id":"s-khadija","cat":"sahaba","title":"ام المومنین حضرت خدیجہ رضی اللہ عنہا","sub":"پہلی ایمان لانے والی، نبی ﷺ کی غم گسار","ref":"صحیح بخاری (کتاب بدء الوحی، مناقب الانصار)، صحیح مسلم","src":"صحیح بخاری (کتاب بدء الوحی، مناقب الانصار)، صحیح مسلم","body":"حضرت خدیجہ بنت خویلد رضی اللہ عنہا مکہ کی ایک معزز، دانا اور کامیاب تاجرہ تھیں۔ انہوں نے نبی کریم ﷺ کی امانت اور سچائی کے بارے میں سنا تو اپنا تجارتی مال دے کر انہیں شام بھیجا، پھر نکاح کا پیغام دیا۔ یوں وہ ام المومنین بنیں۔\n\nجب غارِ حرا میں پہلی وحی اتری تو آپ ﷺ گھبرائے ہوئے گھر آئے اور فرمایا: \"مجھے چادر اوڑھا دو۔\" حضرت خدیجہؓ نے تسلی دی اور کہا: \"اللہ کی قسم! اللہ آپ کو کبھی رسوا نہیں کرے گا، آپ صلہ رحمی کرتے ہیں، کمزوروں کا بوجھ اٹھاتے ہیں، محتاجوں کو کما کر دیتے ہیں، مہمان کی خدمت کرتے ہیں اور مصیبت زدوں کی مدد کرتے ہیں۔\" پھر وہ آپ ﷺ کو اپنے چچازاد ورقہ بن نوفل کے پاس لے گئیں۔ سب سے پہلے ایمان لانے والوں میں وہ شامل تھیں۔\n\nشعبِ ابی طالب کے تین سالہ بائیکاٹ میں انہوں نے آپ ﷺ کے ساتھ بھوک اور سختی برداشت کی۔ ان کی وفات کے بعد بھی نبی کریم ﷺ انہیں یاد کرتے رہتے تھے۔ حضرت عائشہؓ فرماتی ہیں کہ مجھے کسی عورت پر اتنا رشک نہیں آیا جتنا خدیجہؓ پر آتا تھا، حالانکہ میں نے انہیں دیکھا بھی نہیں تھا۔ ایک بار حضرت جبرائیل علیہ السلام نے آ کر کہا: \"اے اللہ کے رسول! خدیجہ آ رہی ہیں، انہیں ان کے رب کی طرف سے اور میری طرف سے سلام کہیے اور جنت میں موتیوں کے گھر کی خوش خبری دیجیے۔\"","lessons":["ایک نیک بیوی شوہر کی سب سے بڑی ڈھارس ہوتی ہے۔","اپنے مال کو دین کی خدمت اور نیک مقصد میں لگانا بہترین عمل ہے۔","مشکل وقت میں صبر، تسلی اور ساتھ دینا ایمان کی علامت ہے۔"]},{"id":"s-abubakr","cat":"sahaba","title":"حضرت ابوبکر صدیق رضی اللہ عنہ","sub":"یارِ غار اور پہلے خلیفہ","ref":"صحیح بخاری، جامع ترمذی، سنن ابی داود، التوبہ 40","src":"صحیح بخاری، جامع ترمذی، سنن ابی داود، التوبہ 40","body":"حضرت ابوبکر صدیق رضی اللہ عنہ مردوں میں سب سے پہلے ایمان لانے والوں میں سے تھے۔ جب نبی کریم ﷺ نے معراج کا واقعہ بیان کیا تو کفار نے انہیں بتایا۔ انہوں نے فرمایا: \"اگر آپ نے یہ کہا ہے تو سچ کہا ہے، میں تو اس سے بھی بڑی بات پر آپ کی تصدیق کرتا ہوں۔\" اسی دن سے وہ \"صدیق\" کہلائے۔\n\nانہوں نے اپنا مال اسلام پر خرچ کیا اور حضرت بلالؓ جیسے ستائے ہوئے غلاموں کو خرید کر آزاد کیا۔ غزوۂ تبوک کے موقع پر نبی کریم ﷺ نے صدقہ کی ترغیب دی تو حضرت عمرؓ آدھا مال لائے، اور حضرت ابوبکرؓ اپنا سارا مال لے آئے۔ آپ ﷺ نے پوچھا: \"گھر والوں کے لیے کیا چھوڑا؟\" عرض کیا: \"ان کے لیے اللہ اور اس کا رسول چھوڑا ہے۔\" (جامع ترمذی)\n\nہجرت میں وہ نبی کریم ﷺ کے یارِ غار بنے۔ غارِ ثور میں فرمایا گیا: \"غم نہ کرو، اللہ ہمارے ساتھ ہے۔\" جب نبی کریم ﷺ کی وفات کی خبر آئی تو لوگ سکتے میں تھے۔ حضرت ابوبکرؓ نے خطبہ دیا: \"جو محمد ﷺ کی عبادت کرتا تھا وہ جان لے کہ محمد ﷺ وفات پا گئے، اور جو اللہ کی عبادت کرتا تھا وہ جان لے کہ اللہ زندہ ہے، اسے کبھی موت نہیں آئے گی۔\" پھر قرآن کی آیت پڑھی: \"محمد ﷺ تو ایک رسول ہی ہیں\" (آل عمران 144)۔ ان کے خلافت کے دو سال میں مرتدین اور منکرینِ زکوٰۃ کے فتنے کو ختم کیا اور قرآن کو ایک جگہ جمع کرنے کا کام شروع کرایا۔","lessons":["صدق اور تصدیق، یعنی سچائی اور نبی ﷺ کی بات پر مکمل اعتماد، ایمان کی بنیاد ہے۔","دین کی خاطر مال لٹا دینا اور اللہ و رسول پر بھروسہ کرنا ابوبکر صدیقؓ کا طریقہ تھا۔","مشکل وقت میں اللہ کے دین کے لیے ثابت قدمی بڑی خدمت ہے۔"]},{"id":"s-umar","cat":"sahaba","title":"حضرت عمر فاروق رضی اللہ عنہ","sub":"عدل کے پیکر","ref":"صحیح بخاری، صحیح مسلم، طبقات ابن سعد","src":"صحیح بخاری، صحیح مسلم، طبقات ابن سعد","body":"حضرت عمر بن خطاب رضی اللہ عنہ پہلے اسلام کے سخت مخالف تھے۔ سیرت کی کتابوں میں آتا ہے کہ وہ نبی کریم ﷺ کے قتل کے ارادے سے نکلے، مگر راستے میں معلوم ہوا کہ ان کی بہن فاطمہ اور بہنوئی مسلمان ہو چکے ہیں۔ گھر پہنچ کر انہوں نے قرآن کی آیات سنیں تو دل نرم ہو گیا اور وہ اسلام لے آئے۔ نبی کریم ﷺ نے ان کے لیے دعا فرمائی تھی کہ اللہ اسلام کو عمر بن خطاب یا ابو جہل میں سے ایک کے ذریعے قوت دے۔\n\nان کا ایمان بہت مضبوط تھا۔ ایک بار انہوں نے نبی کریم ﷺ سے کہا: \"اے اللہ کے رسول! آپ مجھے اپنی جان کے علاوہ ہر چیز سے زیادہ محبوب ہیں۔\" آپ ﷺ نے فرمایا: \"نہیں، اس ذات کی قسم جس کے ہاتھ میں میری جان ہے، جب تک میں تمہیں تمہاری جان سے بھی زیادہ محبوب نہ ہو جاؤں۔\" حضرت عمرؓ نے کہا: \"اب اللہ کی قسم آپ مجھے اپنی جان سے بھی زیادہ محبوب ہیں۔\" فرمایا: \"اب اے عمر!\" (صحیح بخاری)\n\nخلیفہ بننے کے بعد انہوں نے رعایا کی خبر گیری میں رات دن ایک کر دیے۔ روایات میں آتا ہے کہ وہ راتوں کو گلیوں میں گشت کرتے، قحط کے سال انہوں نے گھی اور گوشت کھانا چھوڑ دیا کہ جب تک رعایا کو نہ ملے وہ نہیں کھائیں گے۔ ان کے دور میں عدل کا نظام قائم ہوا، دیوان بنے اور اسلامی سلطنت کی وسعت ہوئی۔ نبی کریم ﷺ نے فرمایا: \"اگر میرے بعد کوئی نبی ہوتا تو عمر ہوتے۔\" (جامع ترمذی)","lessons":["اسلام میں حق قبول کرنے والا دل سب سے بڑی دولت ہے۔","رسول اللہ ﷺ سے محبت ایمان کا حصہ ہے۔","حکمران ہو یا گھر کی سربراہ، سب سے پہلے اپنی ذمہ داری پر جواب دہ ہے۔"]},{"id":"s-uthman","cat":"sahaba","title":"حضرت عثمان بن عفان رضی اللہ عنہ","sub":"غنی اور ذوالنورین","ref":"صحیح بخاری، جامع ترمذی، مسند احمد","src":"صحیح بخاری، جامع ترمذی، مسند احمد","body":"حضرت عثمانؓ بڑے حیادار اور سخی تھے۔ نبی کریم ﷺ نے فرمایا: \"کیا میں اس شخص سے حیا نہ کروں جس سے فرشتے بھی حیا کرتے ہیں؟\" (صحیح مسلم) انہوں نے نبی کریم ﷺ کی دو بیٹیوں (حضرت رقیہ اور بعد میں ام کلثوم رضی اللہ عنہما) سے یکے بعد دیگرے نکاح کیا، اسی لیے \"ذوالنورین\" (دو نوروں والے) کہلائے۔\n\nمدینہ میں میٹھے پانی کا کنواں \"بئر رومہ\" ایک یہودی کی ملکیت تھا جو پانی بیچتا تھا۔ نبی کریم ﷺ نے فرمایا: \"جو اسے خرید کر مسلمانوں کے لیے وقف کر دے اس کے لیے جنت ہے۔\" حضرت عثمانؓ نے اسے خرید کر وقف کر دیا (جامع ترمذی)۔ غزوۂ تبوک کے وقت، جب مسلمانوں کو بہت تنگی تھی، انہوں نے لشکر کے ایک بڑے حصے کا سامان اپنے مال سے تیار کیا۔ نبی کریم ﷺ نے فرمایا: \"آج کے بعد عثمان کو کوئی عمل نقصان نہیں دے گا۔\" (جامع ترمذی)\n\nاپنے دورِ خلافت میں انہوں نے قرآن مجید کو ایک ہی رسم الخط میں لکھوا کر مختلف شہروں میں بھیجا تاکہ امت میں قراءت پر اختلاف نہ ہو۔ آج جو \"مصحفِ عثمانی\" کہلاتا ہے وہ انہی کی کوشش ہے۔ آخر میں باغیوں نے ان کے گھر کا محاصرہ کر لیا، مگر انہوں نے مسلمانوں کا خون بہانے کی اجازت نہ دی اور قرآن کی تلاوت کرتے ہوئے شہید ہو گئے۔","lessons":["حیا ایمان کی نشانی اور فرشتوں کی پسند ہے۔","مال کو اللہ کے راستے میں لگانا اصل دولت ہے۔","امت کو اختلاف سے بچانے کے لیے قرآن کی حفاظت بڑا کارنامہ ہے۔"]},{"id":"s-ali","cat":"sahaba","title":"حضرت علی بن ابی طالب رضی اللہ عنہ","sub":"بہادری، علم اور سادگی","ref":"صحیح بخاری، صحیح مسلم، جامع ترمذی","src":"صحیح بخاری، صحیح مسلم، جامع ترمذی","body":"حضرت علیؓ نبی کریم ﷺ کے چچازاد بھائی تھے اور بچپن ہی سے انہی کی گود میں پلے۔ نوجوانوں میں سب سے پہلے اسلام لانے والوں میں سے تھے۔ ہجرت کی رات جب قریش کے لوگ نبی کریم ﷺ کے گھر کا محاصرہ کیے ہوئے تھے، تو حضرت علیؓ آپ ﷺ کے بستر پر لیٹے رہے تاکہ دشمن کو دھوکا رہے، اور آپ ﷺ کے پاس رکھی لوگوں کی امانتیں بعد میں ان کے مالکوں تک پہنچائیں۔\n\nغزوۂ خیبر کے موقع پر جب قلعہ فتح نہیں ہو رہا تھا تو نبی کریم ﷺ نے فرمایا: \"کل میں جھنڈا اس شخص کو دوں گا جو اللہ اور اس کے رسول سے محبت کرتا ہے اور اللہ اور اس کا رسول اس سے محبت کرتے ہیں، اللہ اس کے ہاتھ پر فتح دے گا۔\" لوگ رات بھر سوچتے رہے کہ کسے ملے گا۔ صبح آپ ﷺ نے حضرت علیؓ کو بلوایا جن کی آنکھیں دُکھ رہی تھیں۔ نبی کریم ﷺ نے ان کی آنکھوں میں لعابِ دہن لگایا تو وہ ٹھیک ہو گئیں اور انہیں جھنڈا دیا گیا۔ (صحیح بخاری و مسلم)\n\nان کا نکاح نبی کریم ﷺ کی صاحبزادی حضرت فاطمہؓ سے ہوا۔ بہت سادہ زندگی تھی، گھر میں چکی چلانے والا اور پانی بھرنے والا کوئی نہ تھا۔ علم اور فہم میں وہ بہت مشہور تھے اور حضرت عمرؓ جیسے خلیفہ بھی مشکل مسائل میں ان سے مشورہ کرتے تھے۔ ان کی خلافت کا دور فتنوں سے بھرا رہا، مگر انہوں نے ہر حال میں حق اور سادگی کا دامن نہ چھوڑا۔","lessons":["اللہ اور اس کے رسول سے سچی محبت ہی اصل کامیابی ہے۔","سادگی، علم اور بہادری کا حسین امتزاج مومن کا زیور ہے۔","نبی ﷺ کی حفاظت کے لیے اپنی جان خطرے میں ڈالنا ایمان کا تقاضا ہے۔"]},{"id":"s-fatima","cat":"sahaba","title":"حضرت فاطمہ الزہراء رضی اللہ عنہا","sub":"نبی ﷺ کی لاڈلی صاحبزادی","ref":"صحیح بخاری، صحیح مسلم، سنن ابی داود","src":"صحیح بخاری، صحیح مسلم، سنن ابی داود","body":"حضرت فاطمہؓ نبی کریم ﷺ کی سب سے چھوٹی صاحبزادی تھیں۔ نبی کریم ﷺ نے فرمایا: \"فاطمہ میرے جسم کا حصہ ہے، جس نے اسے ناراض کیا اس نے مجھے ناراض کیا۔\" (صحیح بخاری) مکہ میں ایک بار جب نبی کریم ﷺ سجدے میں تھے اور مشرکین نے آپ ﷺ کی پیٹھ پر اونٹ کی اوجھڑی ڈال دی تو حضرت فاطمہؓ نے آ کر اسے ہٹایا اور ظالموں کو ڈانٹا (صحیح بخاری)۔ غزوۂ احد میں بھی انہوں نے نبی کریم ﷺ کے زخم دھوئے۔\n\nجب وہ ملنے آتیں تو نبی کریم ﷺ کھڑے ہو کر استقبال کرتے، ان کا ہاتھ پکڑ کر بوسہ دیتے اور اپنی جگہ پر بٹھاتے تھے (سنن ابی داود)۔ مگر دنیاوی آرام انہیں نصیب نہ تھا۔ گھر کا سارا کام اپنے ہاتھ سے کرتیں، چکی پیستے پیستے ہاتھوں میں چھالے پڑ گئے، مشکیزہ بھرتے بھرتے سینے پر نشان پڑ گئے۔ ایک بار انہوں نے خادم مانگنے کی غرض سے نبی کریم ﷺ کے پاس جانا چاہا۔ نبی کریم ﷺ گھر پر نہ تھے۔ رات کو آپ ﷺ ان کے گھر تشریف لائے اور فرمایا: \"کیا میں تمہیں اس سے بہتر چیز نہ بتا دوں جو تم نے مانگی؟ جب بستر پر جاؤ تو ۳۳ بار سبحان اللہ، ۳۳ بار الحمد للہ اور ۳۴ بار اللہ اکبر پڑھ لیا کرو، یہ تمہارے لیے خادم سے بہتر ہے۔\" (صحیح بخاری و مسلم) یہی \"تسبیحِ فاطمہ\" ہے۔\n\nنبی کریم ﷺ کی وفات کے چھ ماہ بعد حضرت فاطمہؓ بھی دنیا سے رخصت ہو گئیں۔ نبی کریم ﷺ نے انہیں جنتی خواتین کی سردار فرمایا۔","lessons":["گھر کے کام کاج اپنے ہاتھ سے کرنا ایک نیک بیٹی اور بیوی کی شان ہے۔","تنگی کے وقت ذکر و تسبیح سب سے بڑی دولت ہے۔","والد کا ادب اور خدمت بیٹی کے لیے جنت کا راستہ ہے۔"]},{"id":"s-aisha","cat":"sahaba","title":"ام المومنین حضرت عائشہ صدیقہ رضی اللہ عنہا","sub":"علم و فقہ کا سرچشمہ","ref":"صحیح بخاری، صحیح مسلم، النور 11–20","src":"صحیح بخاری، صحیح مسلم، النور 11–20","body":"حضرت عائشہؓ حضرت ابوبکر صدیقؓ کی بیٹی اور نبی کریم ﷺ کی زوجہ تھیں۔ وہ بے حد ذہین اور حافظہ والی تھیں۔ انہوں نے نبی کریم ﷺ سے دو ہزار سے زائد احادیث روایت کیں۔ بڑے بڑے صحابہؓ جب کسی مسئلے میں الجھ جاتے تو ان سے رجوع کرتے۔ حضرت ابو موسیٰ اشعریؓ فرماتے ہیں: \"جب بھی ہمیں کوئی مشکل پیش آئی اور ہم نے عائشہؓ سے پوچھا تو ان کے پاس اس کا علم پایا۔\" (جامع ترمذی)\n\nان کی زندگی کا ایک بڑا امتحان \"واقعۂ افک\" ہے، جب منافقوں نے ان پر جھوٹی تہمت لگائی۔ وہ ایک مہینے تک پریشان رہیں، مگر انہوں نے صبر کیا اور کہا: \"اللہ ہی مدد گار ہے۔\" آخرکار اللہ تعالیٰ نے سورۃ النور کی آیات نازل فرما کر ان کی پاک دامنی کی گواہی دی۔ اس پر ان کی والدہ نے کہا کہ اٹھو اور نبی کریم ﷺ کا شکریہ ادا کرو، تو انہوں نے کہا: \"نہیں، اللہ کی قسم میں صرف اللہ کا شکر ادا کروں گی۔\"\n\nوہ نبی کریم ﷺ کی بیماری کے ایام میں آخر تک خدمت کرتی رہیں اور آپ ﷺ نے انہی کے حجرے میں، ان کی گود میں سر رکھے ہوئے وفات پائی۔ انہوں نے بعد کے زمانے میں مدینہ میں علم کی مجلس سجائی اور بہت سی خواتین اور مرد ان سے دین سیکھتے تھے۔","lessons":["علم حاصل کرنا اور بانٹنا عورت کی بھی شان ہے۔","جھوٹی تہمت پر صبر اور اللہ پر بھروسہ آخرکار سرخ رو کرتا ہے۔","نیکی کے کام میں شکر صرف اللہ کا ہے، وہی دلوں کو پھیرنے والا ہے۔"]},{"id":"s-bilal","cat":"sahaba","title":"حضرت بلال بن رباح رضی اللہ عنہ","sub":"پہلے مؤذنِ اسلام","ref":"صحیح بخاری، سیرت ابن ہشام، مسند احمد","src":"صحیح بخاری، سیرت ابن ہشام، مسند احمد","body":"حضرت بلالؓ حبشہ کے رہنے والے اور مکہ کے سردار امیہ بن خلف کے غلام تھے۔ جب انہوں نے اسلام قبول کیا تو امیہ نے انہیں سخت سزائیں دیں۔ گرمی میں دوپہر کو انہیں تپتی ریت پر لٹا دیتا اور سینے پر بھاری پتھر رکھ دیتا کہ اسلام چھوڑ دو۔ مگر بلالؓ کی زبان پر ایک ہی کلمہ تھا: \"احد، احد\" یعنی اللہ ایک ہے۔\n\nحضرت ابوبکر صدیقؓ نے انہیں خرید کر آزاد کر دیا۔ حضرت عمرؓ فرمایا کرتے تھے: \"ابوبکر ہمارے سردار ہیں اور انہوں نے ہمارے سردار (بلالؓ) کو آزاد کیا۔\" (صحیح بخاری) مدینہ میں جب اذان مقرر ہوئی تو بلالؓ پہلے مؤذن بنے۔ فتحِ مکہ کے دن نبی کریم ﷺ نے انہیں حکم دیا تو انہوں نے کعبہ کی چھت پر چڑھ کر اذان دی۔\n\nایک دن فجر کی نماز کے بعد نبی کریم ﷺ نے ان سے فرمایا: \"بلال! مجھے بتاؤ اسلام کے بعد تم نے کون سا عمل سب سے زیادہ امید والا کیا؟ کیونکہ آج رات میں نے جنت میں اپنے آگے تمہارے جوتوں کی آہٹ سنی۔\" انہوں نے عرض کیا: \"میں نے ایسا کوئی خاص عمل نہیں کیا، بس جب بھی وضو کرتا ہوں تو اس کے بعد جتنی توفیق ہو نفل پڑھ لیتا ہوں۔\" (صحیح بخاری)","lessons":["ایمان کی خاطر سخت تکلیف برداشت کرنا بڑی کامیابی ہے۔","اللہ کے نزدیک رنگ، نسل اور حیثیت نہیں، تقویٰ بڑا ہے۔","وضو کے بعد دو رکعت پڑھنے کا ایسا عمل جنت تک پہنچا سکتا ہے۔"]},{"id":"s-musab","cat":"sahaba","title":"حضرت مصعب بن عمیر رضی اللہ عنہ","sub":"ناز و نعمت چھوڑ کر ایمان کی راہ","ref":"صحیح بخاری، سیرت ابن ہشام، طبقات ابن سعد","src":"صحیح بخاری، سیرت ابن ہشام، طبقات ابن سعد","body":"حضرت مصعب بن عمیرؓ مکہ کے نہایت خوش حال گھرانے کے نوجوان تھے، جو بہت قیمتی لباس اور خوشبو استعمال کرتے تھے۔ جب انہوں نے اسلام قبول کیا تو ان کی ماں نے ان کا سارا عیش بند کر دیا اور انہیں سخت سزائیں دیں۔ وہ ہر چیز چھوڑ کر نبی کریم ﷺ کے ساتھ ہو گئے۔ ایک بار نبی کریم ﷺ نے انہیں پرانے کپڑوں میں دیکھا تو فرمایا: \"میں نے اسے اس حال میں دیکھا ہے جب مکہ میں اس سے زیادہ ناز و نعمت والا کوئی نہ تھا۔\"\n\nبیعتِ عقبہ کے بعد نبی کریم ﷺ نے انہیں مدینہ بھیجا کہ وہاں لوگوں کو قرآن اور دین سکھائیں۔ ان کی نرمی، علم اور اخلاق سے مدینہ کے بڑے بڑے سردار حضرت سعد بن معاذ اور حضرت اسید بن حضیر رضی اللہ عنہما مسلمان ہوئے، اور مدینہ کے گھر گھر میں اسلام پھیل گیا۔\n\nغزوۂ احد میں وہ نبی کریم ﷺ کا جھنڈا لیے ہوئے تھے اور شہید ہو گئے۔ حضرت خبابؓ فرماتے ہیں کہ ان کے پاس کفن کے لیے صرف ایک چادر تھی۔ سر ڈھانپتے تو پاؤں کھل جاتے اور پاؤں ڈھانپتے تو سر کھل جاتا۔ نبی کریم ﷺ نے فرمایا: \"چادر سے سر ڈھانپ دو اور پاؤں پر اذخر گھاس ڈال دو۔\" (صحیح بخاری)","lessons":["دین کی خاطر دنیا کی آرائش چھوڑنا اصل بہادری ہے۔","اچھے اخلاق اور نرمی سے دین سکھانا دلوں کو فتح کرتا ہے۔","آخرت کی کامیابی دنیاوی مال و دولت سے نہیں، ایمان اور عمل سے ہے۔"]},{"id":"s-salman","cat":"sahaba","title":"حضرت سلمان فارسی رضی اللہ عنہ","sub":"سچ کی تلاش میں نکلنے والا مسافر","ref":"صحیح بخاری، مسند احمد، سیرت ابن ہشام","src":"صحیح بخاری، مسند احمد، سیرت ابن ہشام","body":"حضرت سلمانؓ فارس (ایران) کے رہنے والے تھے اور اپنے باپ دادا کے مجوسی دین سے مطمئن نہ تھے۔ وہ سچائی کی تلاش میں گھر چھوڑ کر نکلے، کئی عیسائی عالموں کی خدمت میں رہے۔ آخری عالم نے انہیں بتایا کہ ایک نبی آنے والا ہے جو عرب میں کھجوروں کی زمین کی طرف ہجرت کرے گا۔ اس کی تین نشانیاں بتائیں: وہ ہدیہ کھائے گا مگر صدقہ نہیں کھائے گا، اور اس کے کندھوں کے درمیان مہرِ نبوت ہوگی۔\n\nراستے میں ایک قافلے نے انہیں غلام بنا کر مدینہ کے ایک یہودی کے ہاتھ بیچ دیا۔ مدینہ میں جب نبی کریم ﷺ ہجرت کر کے آئے تو سلمانؓ نے آپ ﷺ کو صدقہ اور ہدیہ پیش کیا۔ صدقہ آپ ﷺ نے نہ کھایا اور ہدیہ قبول فرمایا، اور مہرِ نبوت بھی دیکھی۔ تب وہ ایمان لائے۔ نبی کریم ﷺ نے ان کی آزادی کے لیے ان کی مدد کی۔\n\nغزوۂ احزاب (خندق) میں انہوں نے مدینہ کے گرد خندق کھودنے کا مشورہ دیا، جو عربوں میں نیا طریقہ تھا۔ نبی کریم ﷺ نے اسے پسند فرمایا۔ وہ بہت زاہد، عالم اور حق کے متلاشی تھے۔","lessons":["سچ کی تلاش میں سخت محنت اور قربانی اللہ کو پسند ہے۔","مشورہ دینے والے کی بات اگر درست ہو تو اسے اپنانا چاہیے، چاہے وہ کسی بھی قوم کا ہو۔","دین میں نسب نہیں، ایمان اور تقویٰ اصل مقام ہے۔"]},{"id":"s-abdurrahman","cat":"sahaba","title":"حضرت عبدالرحمن بن عوف رضی اللہ عنہ","sub":"دولت مند، مگر دل میں آخرت","ref":"صحیح بخاری، جامع ترمذی","src":"صحیح بخاری، جامع ترمذی","body":"حضرت عبدالرحمن بن عوفؓ ان دس صحابہ میں سے ہیں جنہیں دنیا ہی میں جنت کی خوش خبری ملی۔ جب وہ ہجرت کر کے مدینہ پہنچے تو نبی کریم ﷺ نے انہیں حضرت سعد بن ربیعؓ کا بھائی بنایا۔ سعدؓ نے کہا: \"میں انصار میں سب سے زیادہ مال والا ہوں، آدھا مال آپ کو دیتا ہوں، اور میری دو بیویاں ہیں، جو پسند ہو میں اسے طلاق دے دیتا ہوں تاکہ آپ نکاح کر لیں۔\" عبدالرحمنؓ نے کہا: \"اللہ آپ کے مال اور گھر میں برکت دے، مجھے بازار کا راستہ بتا دیجیے۔\" (صحیح بخاری)\n\nوہ بازار گئے اور تجارت کی۔ اللہ نے ان کے مال میں اتنی برکت دی کہ وہ مدینہ کے بڑے مالدار بن گئے۔ مگر دولت نے ان کے دل کو سخت نہ کیا۔ انہوں نے سات سو اونٹوں کا قافلہ مدینہ آیا تو سارا اللہ کی راہ میں وقف کر دیا۔ غزوۂ تبوک میں بہت بڑا مال دیا۔ ایک دن روزے سے تھے اور کھانا آیا تو رو پڑے اور فرمایا کہ مصعب بن عمیرؓ شہید ہوئے اور ان کے پاس کفن بھی پورا نہ تھا، اور ہمیں دنیا کی اتنی کشادگی ملی، مجھے ڈر ہے کہ ہماری نیکیوں کا بدلہ ہمیں دنیا ہی میں نہ دے دیا گیا ہو۔ (صحیح بخاری)","lessons":["محنت سے کمانا اور مانگنے سے بچنا مومن کا طریقہ ہے۔","مال ملنے پر شکر اور سخاوت اختیار کرنی چاہیے۔","دنیا کی کشادگی پر بھی آخرت کا فکر مند رہنا ایمان کی علامت ہے۔"]},{"id":"s-khalid","cat":"sahaba","title":"حضرت خالد بن ولید رضی اللہ عنہ","sub":"سیف اللہ، اللہ کی تلوار","ref":"صحیح بخاری، طبقات ابن سعد","src":"صحیح بخاری، طبقات ابن سعد","body":"حضرت خالد بن ولیدؓ قریش کے نامور سپہ سالار تھے۔ احد کے دن مسلمانوں کے خلاف ان کی چال کامیاب ہوئی تھی۔ مگر صلحِ حدیبیہ کے بعد اللہ نے ان کا دل اسلام کے لیے کھول دیا۔ وہ آٹھ ہجری میں مدینہ آ کر مسلمان ہوئے۔\n\nغزوۂ موتہ میں جب تین سپہ سالار یکے بعد دیگرے شہید ہوئے تو انہوں نے جھنڈا سنبھالا۔ نبی کریم ﷺ نے مدینہ میں بیٹھے وحی کی خبر سے صحابہ کو بتایا: \"پھر اللہ کی تلواروں میں سے ایک تلوار نے جھنڈا اٹھایا، یہاں تک کہ اللہ نے ان کے ہاتھ پر فتح دی۔\" (صحیح بخاری) اسی دن سے وہ \"سیف اللہ\" کہلائے۔ انہوں نے حکمتِ عملی سے مسلمانوں کے لشکر کو بچا کر نکالا۔\n\nان کے بعد کے معرکوں، مرتدین سے جنگ، عراق اور شام کی فتوحات میں ان کی قیادت مثالی رہی۔ روایت ہے کہ وفات کے وقت انہوں نے فرمایا کہ مجھے ہر جگہ جنگ کے زخم لگے، مگر اللہ کی راہ میں شہادت نہ ملی اور میں اپنے بستر پر مر رہا ہوں۔ بزدلوں کی آنکھیں کبھی نہ سوئیں۔","lessons":["ماضی کی غلطیاں توبہ کے بعد مٹ جاتی ہیں اور انسان نئے سرے سے سرفراز ہو سکتا ہے۔","بہادری کے ساتھ حکمت اور سمجھداری ضروری ہے۔","اللہ کے راستے کا عمل ہی اصل مقصد ہے، لقب اور شہرت نہیں۔"]},{"id":"s-kaab","cat":"sahaba","title":"حضرت کعب بن مالک رضی اللہ عنہ","sub":"سچ بولنے اور توبہ کی مثال","ref":"صحیح بخاری، صحیح مسلم، التوبہ 117–119","src":"صحیح بخاری، صحیح مسلم، التوبہ 117–119","body":"غزوۂ تبوک کا موقع تھا۔ شدید گرمی، فصل کا موسم اور لمبا سفر تھا، مگر نبی کریم ﷺ نے سب مسلمانوں کو نکلنے کا حکم دیا۔ حضرت کعب بن مالکؓ کے پاس سواری اور وسائل سب تھے، مگر وہ روز سوچتے رہے کہ کل تیاری کر لوں گا، اور رہ گئے۔\n\nجب نبی کریم ﷺ لوٹ کر آئے تو منافقوں نے آ کر بہانے بنا لیے اور آپ ﷺ نے قبول فرما لیے۔ کعبؓ نے سچ بولنے کا فیصلہ کیا اور کہا: \"میرے پاس کوئی عذر نہ تھا، بس سستی ہوئی۔\" نبی کریم ﷺ نے فرمایا: \"جاؤ، اللہ کا فیصلہ آنے تک انتظار کرو۔\" انہیں اور دو اور ساتھیوں (ہلال بن امیہ اور مرارہ بن ربیع رضی اللہ عنہما) کا مقاطعہ کر دیا گیا۔ پچاس دن تک کوئی ان سے بات نہ کرتا۔ زمین اپنی کشادگی کے باوجود ان پر تنگ ہو گئی۔ کعبؓ فرماتے ہیں کہ جب میں رو رو کر تھک گیا تو بھی میں مسجد میں آ کر نبی کریم ﷺ کو سلام کرتا اور دیکھتا کہ ہونٹ ہلتے ہیں یا نہیں۔\n\nبالآخر پچاسویں رات فجر کے بعد انہوں نے کسی کی پکار سنی: \"کعب! خوش خبری ہو!\" اللہ تعالیٰ نے ان کی توبہ قبول فرما لی اور سورۃ التوبہ کی آیات نازل فرمائیں۔ کعبؓ نے کہا: \"اے اللہ کے رسول! میں اپنی توبہ کے شکرانے میں اپنا سارا مال صدقہ کرتا ہوں۔\" آپ ﷺ نے فرمایا: \"کچھ مال اپنے پاس رکھو، یہ تمہارے لیے بہتر ہے۔\" اور فرمایا کہ \"اے ایمان والو! اللہ سے ڈرو اور سچوں کے ساتھ رہو۔\" (التوبہ 119)","lessons":["سچ بولنا مشکل ہو تو بھی آخرکار نجات سچ ہی میں ہے۔","کام کو کل پر ٹالنا نقصان کا سبب بنتا ہے۔","سچی توبہ کو اللہ قبول فرماتا ہے، اور توبہ قبول ہونے پر شکر ادا کرنا چاہیے۔"]},{"id":"s-sumayya","cat":"sahaba","title":"حضرت سمیہ رضی اللہ عنہا","sub":"اسلام کی پہلی شہیدہ","ref":"مستدرک حاکم، طبقات ابن سعد، سیرت ابن ہشام","src":"مستدرک حاکم، طبقات ابن سعد، سیرت ابن ہشام","body":"حضرت سمیہ بنت خیاطؓ ابتدائی مسلمانوں میں سے تھیں، جو اپنے شوہر حضرت یاسرؓ اور بیٹے حضرت عمارؓ کے ساتھ ایمان لائیں۔ یہ گھرانہ مکہ میں کمزور سمجھا جاتا تھا اور ان کا کوئی قبیلہ ان کی حفاظت کرنے والا نہ تھا۔ اس لیے مشرکین ان پر ظلم کے پہاڑ توڑتے۔\n\nانہیں مکہ کی تپتی ریت پر لٹا کر کڑی دھوپ میں سزا دی جاتی تاکہ وہ اسلام چھوڑ دیں۔ نبی کریم ﷺ ان کے پاس سے گزرتے تو فرماتے: \"اے آلِ یاسر! صبر کرو، تمہارا ٹھکانا جنت ہے۔\" (مستدرک حاکم) حضرت سمیہؓ نے ایمان نہ چھوڑا۔ سیرت کی کتابوں میں آتا ہے کہ ابو جہل نے غصے میں انہیں نیزہ مار کر شہید کر دیا۔ وہ اسلام میں سب سے پہلی شہید ہونے والی خاتون ہیں۔ ان کے شوہر یاسرؓ بھی ظلم کے دوران شہید ہوئے۔\n\nان کے بیٹے عمارؓ کی ان سے بے پناہ محبت تھی۔ آگے چل کر اللہ نے ان کی ماں کے قتل کا بدلہ بدر کے دن لیا جب ابو جہل مارا گیا۔","lessons":["ایمان کے راستے میں ثابت قدمی کا بدلہ جنت ہے۔","اسلام میں عورت بھی دین کی خاطر قربانی دینے میں مرد کے برابر ہے۔","ظالم کا انجام ضرور آتا ہے، چاہے دیر سے آئے۔"]},{"id":"s-ummsulaim","cat":"sahaba","title":"حضرت ام سلیم رضی اللہ عنہا","sub":"صبر، ایمان اور مہمان نوازی","ref":"صحیح بخاری، صحیح مسلم، سنن نسائی","src":"صحیح بخاری، صحیح مسلم، سنن نسائی","body":"حضرت ام سلیم بنت ملحانؓ مدینہ کی انصاری صحابیہ تھیں۔ جب ابو طلحہ، جو ابھی مسلمان نہ ہوئے تھے، نے ان کو نکاح کا پیغام دیا تو انہوں نے جواب دیا: \"اے ابو طلحہ! کیا تمہیں معلوم نہیں کہ تم جس معبود کو پوجتے ہو وہ زمین سے اگی ہوئی لکڑی ہے؟ اگر تم اسلام قبول کر لو تو میں اسی کو اپنا مہر بنا لوں گی۔\" ابو طلحہؓ مسلمان ہو گئے اور حضرت انسؓ فرماتے ہیں کہ میں نے ان سے بہتر مہر نہیں سنا۔ (سنن نسائی)\n\nان کا ایک چھوٹا بیٹا بیمار ہو کر فوت ہو گیا جب ابو طلحہؓ گھر پر نہ تھے۔ حضرت ام سلیمؓ نے سب گھر والوں کو منع کر دیا کہ ابو طلحہ کو خود نہ بتانا۔ رات کو وہ آئے تو کھانا دیا، خود کو سنوارا، ان کے ساتھ رہیں، پھر صبح کو آہستہ سے کہا: \"اگر کچھ لوگ کسی کو عاریتاً کوئی چیز دیں اور پھر واپس مانگیں تو کیا اس پر ناراض ہونا چاہیے؟\" انہوں نے کہا: نہیں۔ تب انہوں نے بیٹے کی وفات کی خبر دی۔ ابو طلحہؓ نبی کریم ﷺ کے پاس گئے تو آپ ﷺ نے فرمایا: \"اللہ نے تمہاری اس رات میں برکت دے دی۔\" بعد میں انہیں ایک اور بیٹا عبداللہ ملا۔ (صحیح بخاری و مسلم)\n\nایک بار نبی کریم ﷺ کے پاس ایک مہمان آیا اور گھر میں کچھ نہ تھا۔ ایک انصاری (ابو طلحہؓ) نے اسے لے جا کر گھر والوں سے کہا کہ بچوں کو بہلا کر سلا دو۔ دونوں میاں بیوی نے چراغ بجھا دیا اور خود بھوکے رہ کر مہمان کو کھلایا۔ اس پر یہ آیت نازل ہوئی: \"اور وہ اپنے آپ پر دوسروں کو ترجیح دیتے ہیں خواہ انہیں تنگی ہو\" (الحشر 9)۔ (صحیح بخاری)","lessons":["شادی میں سب سے پہلے دین کو دیکھنا چاہیے۔","مصیبت پر صبر اور حکمت سے کام لینا بہترین ایمان ہے۔","مہمان کی خدمت اور ایثار اللہ کو بہت پسند ہے۔"]},{"id":"s-abuayyub","cat":"sahaba","title":"حضرت ابو ایوب انصاری رضی اللہ عنہ","sub":"نبی ﷺ کے میزبان","ref":"صحیح مسلم، سنن ابی داود، جامع ترمذی، سیرت ابن ہشام","src":"صحیح مسلم، سنن ابی داود، جامع ترمذی، سیرت ابن ہشام","body":"جب نبی کریم ﷺ ہجرت کر کے مدینہ پہنچے تو ہر انصاری کی خواہش تھی کہ آپ ﷺ اسی کے گھر ٹھہریں۔ آپ ﷺ نے فرمایا کہ میری اونٹنی اللہ کے حکم پر چل رہی ہے، جہاں بیٹھے گی وہیں ٹھہروں گا۔ اونٹنی حضرت ابو ایوب خالد بن زید انصاریؓ کے گھر کے آگے بیٹھی۔ وہ خوشی سے سامان اٹھا کر اندر لے گئے۔\n\nان کا گھر دو منزلہ تھا۔ انہوں نے آپ ﷺ سے اوپر والی منزل پر ٹھہرنے کی درخواست کی، مگر آپ ﷺ نے نیچے ٹھہرنا پسند فرمایا تاکہ ملاقاتیوں کو آسانی ہو۔ ایک رات ان کے اوپر والے کمرے میں پانی کا ایک مٹکا ٹوٹ گیا تو وہ اور ان کی اہلیہ اپنی چادر سے پانی خشک کرنے لگے کہ نیچے نبی کریم ﷺ پر نہ ٹپک جائے۔ سات مہینے تک آپ ﷺ کا قیام ان کے گھر رہا۔ حضرت ابو ایوبؓ اور ان کی اہلیہ کھانا بنا کر بھیجتے، جو بچ جاتا اسے برکت کے لیے تلاش کرتے۔\n\nحضرت ابو ایوبؓ آخر تک جہاد کے شوق میں رہے۔ نبی کریم ﷺ کے بعد کئی غزوات میں شریک ہوئے۔ جب ان کی عمر ۸۰ سال کے قریب تھی تو قسطنطنیہ کے لشکر میں شریک ہوئے اور وہیں بیمار ہو کر انتقال فرمایا۔ وصیت کی کہ مجھے دشمن کی سرزمین میں جہاں تک ممکن ہو آگے دفن کرنا۔ وہ آج بھی استنبول میں مدفون ہیں۔","lessons":["اللہ کے رسول ﷺ کی میزبانی کا شرف ایمان اور محبت کا انعام تھا۔","مہمان کا خیال رکھنا اور اس کی آسانی دیکھنا انصار کا شعار تھا۔","دین کی خدمت میں بڑھاپا بھی رکاوٹ نہیں ہونا چاہیے۔"]},{"id":"s-asma","cat":"sahaba","title":"حضرت اسماء بنت ابی بکر رضی اللہ عنہا","sub":"ذات النطاقین","ref":"صحیح بخاری، صحیح مسلم","src":"صحیح بخاری، صحیح مسلم","body":"حضرت اسماءؓ حضرت ابوبکر صدیقؓ کی بیٹی تھیں اور ہجرت کے وقت جوان تھیں۔ جب نبی کریم ﷺ اور حضرت ابوبکرؓ غارِ ثور میں چھپے تھے تو یہی تھیں جو چپکے چپکے ان کے لیے کھانا اور پانی لے کر جاتیں۔ جب سفر کا توشہ باندھنے کے لیے رسی نہ ملی تو انہوں نے اپنا نطاق (کمر کی پٹی) پھاڑ کر دو ٹکڑے کیے، ایک سے توشہ باندھا اور دوسرا خود باندھ لیا۔ نبی کریم ﷺ نے انہیں \"ذات النطاقین\" کا لقب دیا۔ (صحیح بخاری)\n\nابو جہل نے ان کے گھر آ کر پوچھا کہ تمہارے والد کہاں ہیں؟ انہوں نے کہا: \"مجھے معلوم نہیں۔\" اس نے تھپڑ مارا کہ ان کی بالی گر گئی، مگر انہوں نے راز نہ کھولا۔ ان کے شوہر حضرت زبیر بن عوامؓ بہت غریب تھے، گھر میں ایک گھوڑا ہی ان کا کل اثاثہ تھا۔ حضرت اسماءؓ کھجوروں کی گٹھلیاں دو میل دور سے سر پر لاد کر لاتی تھیں اور گھوڑے کو کھلاتی تھیں۔ (صحیح بخاری)\n\nان کے بیٹے حضرت عبداللہ بن زبیرؓ کی شہادت پر وہ بہت بوڑھی ہو چکی تھیں مگر انہوں نے صبر کیا اور ان کے آخری لمحے میں انہیں ثابت قدم رہنے کا حوصلہ دیا۔ ان کی عمر تقریباً سو برس ہوئی۔","lessons":["اللہ کے دین اور رسول کے لیے راز داری اور ہمت دکھانا بڑی خدمت ہے۔","غربت اور محنت کے باوجود صبر اور شکر ایمان کی شان ہے۔","مشکل میں اولاد کو حق پر ثابت قدم رکھنا ماں کا اعلیٰ مقام ہے۔"]},{"id":"w-hasan","cat":"auliya","title":"حضرت حسن بصری رحمہ اللہ","sub":"تابعی، واعظ اور زاہد","ref":"حلیۃ الاولیاء، سیر اعلام النبلاء، طبقات ابن سعد","src":"حلیۃ الاولیاء، سیر اعلام النبلاء، طبقات ابن سعد","body":"حضرت حسن بصری (م ۱۱۰ ہجری) مدینہ میں پیدا ہوئے اور بصرہ کو اپنا وطن بنایا۔ ان کی والدہ ام المومنین حضرت ام سلمہ رضی اللہ عنہا کی خادمہ تھیں۔ روایات میں آتا ہے کہ جب بچپن میں وہ روتے تو ام سلمہؓ انہیں اپنی گود میں لے لیتیں اور دعا دیتیں۔ انہوں نے کئی صحابہ کرامؓ سے علم حاصل کیا۔\n\nوہ اپنے وعظ و نصیحت میں بہت مؤثر تھے۔ ان کا فرمان مشہور ہے: \"اے ابنِ آدم! تو چند دنوں کا مجموعہ ہے، جب ایک دن گزر جاتا ہے تو تیرا ایک حصہ چلا جاتا ہے۔\" وہ ہر وقت آخرت کی فکر میں رہتے تھے اور دنیا کی محبت سے خبردار کرتے تھے۔ لوگ ان سے مشورہ کرتے اور وہ سادہ لفظوں میں گہری بات سمجھا دیتے۔\n\nان کا ایک اور قول یہ ہے: \"مومن صبح و شام اس حال میں کرتا ہے کہ اسے اپنے گناہوں کا خوف رہتا ہے۔ منافق کو اپنے گناہوں کا کوئی ڈر نہیں ہوتا۔\" انہوں نے لوگوں کو علم، زہد اور اخلاص کی طرف بلایا اور ایک بڑی تعداد ان کے ذریعے دین سے وابستہ ہوئی۔","lessons":["وقت بہت قیمتی ہے، گزرا ہوا دن واپس نہیں آتا۔","ایک سچا مومن اپنے گناہوں پر ڈرتا ہے اور توبہ میں جلدی کرتا ہے۔","نیک صحبت اور علم انسان کو بلند مقام پر پہنچاتے ہیں۔"]},{"id":"w-rabia","cat":"auliya","title":"حضرت رابعہ بصریہ رحمہا اللہ","sub":"اللہ کی محبت میں فنا ہونے والی عبادت گزار خاتون","ref":"سیر اعلام النبلاء، وفیات الاعیان","src":"سیر اعلام النبلاء، وفیات الاعیان","body":"حضرت رابعہ بصریہ (م تقریباً ۱۸۵ ہجری) بصرہ کی ایک نیک اور عبادت گزار خاتون تھیں۔ تذکروں میں آتا ہے کہ وہ ایک غریب گھرانے میں پیدا ہوئیں اور بچپن میں مشکلات دیکھیں، مگر انہوں نے اپنی زندگی اللہ کی عبادت اور ذکر کے لیے وقف کر دی۔ وہ راتیں نماز میں گزارتی تھیں اور دنیا کی چیزوں سے بے نیاز رہتی تھیں۔\n\nان کے اقوال میں اللہ کی محبت، خوف اور امید تینوں کا حسین امتزاج ملتا ہے۔ ان سے منقول ہے کہ وہ دعا کرتیں: \"اے اللہ! اگر میں تجھے جہنم کے خوف سے پوجتی ہوں تو مجھے جہنم میں جلا دے، اور اگر جنت کی لالچ میں پوجتی ہوں تو مجھے جنت سے محروم کر دے، لیکن اگر صرف تیرے لیے پوجتی ہوں تو اپنے ازلی جمال سے مجھے محروم نہ فرما۔\" یہ قول اخلاص کی تعلیم ہے، اس کا مطلب یہی ہے کہ بندے کی اصل منزل رضائے الٰہی ہے۔\n\nعلماء نے ان کے واقعات کو تذکروں میں لکھا ہے، اور ان کی بہت سی روایات تاریخی طور پر مضبوط نہیں۔ اس لیے ان کی زندگی کو عبرت اور اخلاص کی مثال کے طور پر سمجھنا چاہیے۔","lessons":["عبادت کا اصل مقصد اللہ کی رضا ہو، صرف جنت کی طلب یا جہنم کا خوف نہیں۔","خواتین بھی علم، زہد اور عبادت میں بلند مقام پا سکتی ہیں۔","دنیا کی کمی اللہ سے تعلق میں رکاوٹ نہیں بنتی۔"]},{"id":"w-ibrahim","cat":"auliya","title":"حضرت ابراہیم بن ادہم رحمہ اللہ","sub":"بادشاہت چھوڑ کر اللہ کے بندے بننے والے","ref":"حلیۃ الاولیاء، سیر اعلام النبلاء","src":"حلیۃ الاولیاء، سیر اعلام النبلاء","body":"حضرت ابراہیم بن ادہم (م تقریباً ۱۶۱ ہجری) بلخ کے امیر خاندان سے تعلق رکھتے تھے اور ایک خوشحال زندگی گزار رہے تھے۔ تذکروں میں آتا ہے کہ ایک دن شکار پر نکلے تو انہیں اپنے دل میں ایک تنبیہ محسوس ہوئی کہ تمہیں اس مقصد کے لیے نہیں پیدا کیا گیا۔ اس سے ان کا دل بدل گیا۔ انہوں نے توبہ کی، شاہی زندگی ترک کی اور مکہ کی طرف روانہ ہوئے، جہاں انہوں نے علماء اور صالحین کی صحبت پائی۔\n\nآگے چل کر انہوں نے محنت مزدوری سے رزقِ حلال کمایا۔ کبھی باغوں کی رکھوالی کی، کبھی فصل کاٹی، اور کسی سے کچھ مانگا نہیں۔ انہیں حرام کے ایک لقمے سے بھی بہت ڈر لگتا تھا اور وہ حلال کمائی پر بہت زور دیتے۔ ان کے ہاں ورع (پرہیزگاری) اور توکل نمایاں تھے۔\n\nوہ جہاد اور سفر میں بھی شریک رہے اور بالآخر شام کے سرحدی علاقے میں وفات پائی۔ علماء ان کی زندگی کو اس مثال کے طور پر پیش کرتے ہیں کہ سچی توبہ کیسے انسان کی دنیا بدل دیتی ہے۔ ان کے واقعات کی تفصیلات میں راویوں کا اختلاف ہے، اس لیے بنیادی بات یعنی دنیا ترک کر کے آخرت اور حلال کمائی کو اپنانا ہی یاد رکھیں۔","lessons":["سچی توبہ زندگی بدل دیتی ہے۔","رزقِ حلال ہی اصل کمائی ہے، اس میں محنت کرنے میں عزت ہے۔","دنیا کی نعمتوں کے ہوتے ہوئے بھی آخرت کو ترجیح دینا کمال ہے۔"]},{"id":"w-fudayl","cat":"auliya","title":"حضرت فضیل بن عیاض رحمہ اللہ","sub":"ایک آیت جس نے زندگی بدل دی","ref":"حلیۃ الاولیاء، سیر اعلام النبلاء، تہذیب الکمال","src":"حلیۃ الاولیاء، سیر اعلام النبلاء، تہذیب الکمال","body":"حضرت فضیل بن عیاض (م ۱۸۷ ہجری) کے بارے میں مشہور ہے کہ نوجوانی میں وہ راستے کے ایک بااثر مجرم تھے۔ تذکروں میں آتا ہے کہ ایک رات وہ کسی عورت سے ناجائز تعلق کے لیے دیوار پر چڑھ رہے تھے کہ انہوں نے کسی کو قرآن کی یہ آیت پڑھتے سنا: \"کیا ایمان والوں کے لیے ابھی وہ وقت نہیں آیا کہ ان کے دل اللہ کے ذکر کے آگے جھک جائیں؟\" (الحدید 16)\n\nیہ آیت سن کر وہ دیوار سے اتر آئے اور کہنے لگے: \"کیوں نہیں، اے میرے رب! وقت آ گیا۔\" انہوں نے اس رات ایک ویران جگہ پناہ لی جہاں کچھ مسافر ٹھہرے ہوئے تھے اور آپس میں کہہ رہے تھے کہ فضیل راستے میں ہے، ہمیں مارے گا۔ فضیلؓ نے انہیں امان دی اور توبہ کی۔ پھر مکہ جا کر علم حاصل کیا اور بڑے محدث اور عابد بنے۔ وہ حرم میں رہے اور ان کے علم و زہد کی شہرت ہوئی۔\n\nان کی تعلیم کا مرکز یہ تھا کہ علم کا مقصد عمل ہے اور عمل میں اخلاص ہونا چاہیے۔ انہوں نے لوگوں کو خوفِ خدا اور دنیا سے بے رغبتی کی تلقین کی۔","lessons":["ہدایت کی ایک آیت بھی دل بدل سکتی ہے، بشرطیکہ دل نرم ہو۔","گناہ سے توبہ میں دیر نہیں کرنی چاہیے، \"ابھی وقت ہے\" کہہ کر لوٹ آئیں۔","علم کا مقصد عمل ہے، صرف جاننا کافی نہیں۔"]},{"id":"w-junaid","cat":"auliya","title":"حضرت جنید بغدادی رحمہ اللہ","sub":"شریعت اور تصوف کا حسین امتزاج","ref":"حلیۃ الاولیاء، سیر اعلام النبلاء، تاریخ بغداد","src":"حلیۃ الاولیاء، سیر اعلام النبلاء، تاریخ بغداد","body":"حضرت جنید بغدادی (م ۲۹۷ ہجری) کو \"سید الطائفہ\" کہا جاتا ہے۔ وہ بغداد کے ایک بڑے عالم اور فقیہ تھے۔ وہ اپنے ماموں حضرت سری سقطیؒ اور حارث محاسبیؒ کی صحبت میں رہے۔ انہوں نے اپنی زندگی علمِ دین اور تزکیۂ نفس کے لیے وقف کی اور بہت سے لوگوں کی اصلاح کی۔\n\nان کی تعلیم کی خاص بات یہ تھی کہ وہ ہر بات کو کتاب و سنت کے ترازو پر تولتے تھے۔ ان کا مشہور قول ہے: \"ہمارا یہ علم کتاب و سنت کے ساتھ بندھا ہوا ہے۔ جس نے قرآن نہ پڑھا اور حدیث نہ لکھی، اس کی اقتداء نہ کی جائے۔\" انہوں نے کئی شطحیات (ظاہری شریعت کے خلاف باتوں) کو رد کیا اور لوگوں کو شریعت پر مضبوطی سے چلنے کی تلقین کی۔\n\nوہ بہت سادہ اور خاموش طبع تھے، مگر ان کی صحبت میں بڑے بڑے لوگ بدل جاتے۔ ان کی بات کو علماء بہت وزن دیتے ہیں کیونکہ وہ فقیہ بھی تھے اور صوفی بھی۔","lessons":["اللہ کا قرب شریعت پر چل کر ہی ملتا ہے۔","علم اور عمل، دونوں ساتھ چلیں تو انسان کامل بنتا ہے۔","سادگی اور خاموشی میں بھی بڑی تاثیر ہے۔"]},{"id":"w-jilani","cat":"auliya","title":"حضرت شیخ عبدالقادر جیلانی رحمہ اللہ","sub":"سچائی کا سبق دینے والے","ref":"غنیۃ الطالبین، قلائد الجواہر، سیر اعلام النبلاء","src":"غنیۃ الطالبین، قلائد الجواہر، سیر اعلام النبلاء","body":"حضرت شیخ عبدالقادر جیلانی (م ۵۶۱ ہجری) جیلان میں پیدا ہوئے اور نوجوانی میں بغداد علم حاصل کرنے آئے۔ وہ حنبلی فقیہ اور بڑے واعظ تھے، اور ان کی مجالس میں ہزاروں لوگ جمع ہوتے تھے۔ انہوں نے \"الغنیۃ لطالبی طریق الحق\" اور \"فتوح الغیب\" جیسی کتابیں لکھیں۔\n\nان کا ایک مشہور واقعہ تذکروں میں آتا ہے: جب وہ نوجوانی میں علم کے لیے بغداد جا رہے تھے تو ان کی ماں نے چالیس دینار ان کے کپڑوں میں سی دیے اور ان سے وعدہ لیا کہ ہر حال میں سچ بولنا۔ راستے میں ڈاکوؤں نے قافلے کو لوٹا۔ ایک ڈاکو نے پوچھا: \"تمہارے پاس کیا ہے؟\" انہوں نے سچ سچ بتایا کہ میرے پاس چالیس دینار ہیں۔ ڈاکو نے مذاق سمجھا، مگر سردار کے پاس لے گیا تو وہاں بھی یہی کہا۔ سردار نے وجہ پوچھی تو بتایا کہ میری ماں نے مجھ سے سچ بولنے کا عہد لیا ہے۔ یہ سن کر ڈاکوؤں کا سردار رو پڑا اور اس نے توبہ کی، اور اس کے ساتھیوں نے بھی لوٹا ہوا مال لوٹا دیا۔\n\nان کی تعلیمات میں شریعت کی پابندی، اخلاص اور توبہ پر خاص زور ہے۔ انہوں نے سادگی اور حلم کی مثال قائم کی۔ ان کے نام سے بہت سی کرامتیں مشہور ہیں جن میں سے بہت سی سند کے لحاظ سے مضبوط نہیں، اس لیے ان کے اصل پیغام یعنی سچائی، علم اور اخلاص کو یاد رکھیں۔","lessons":["سچ بولنا انسان کو نجات دیتا ہے، چاہے ڈر کا موقع ہو۔","ماں کی نصیحت اور وعدے کی پاسداری بہت بڑی چیز ہے۔","سچا اثر وہ ہے جو دلوں کو اللہ کی طرف موڑ دے۔"]},{"id":"w-moinuddin","cat":"auliya","title":"حضرت خواجہ معین الدین چشتی اجمیری رحمہ اللہ","sub":"برصغیر میں اسلام کی روشنی","ref":"سیر الاولیاء، تاریخِ مشائخ چشت","src":"سیر الاولیاء، تاریخِ مشائخ چشت","body":"حضرت خواجہ معین الدین چشتی (م ۶۳۳ ہجری) سجستان میں پیدا ہوئے۔ نوجوانی میں ہی دنیا کی طرف سے بے رغبتی ہو گئی اور وہ علم اور اللہ کی تلاش میں نکل پڑے۔ انہوں نے سمرقند اور بخارا میں علم حاصل کیا اور بعد میں حضرت شیخ عثمان ہارونیؒ کے ہاتھ پر بیعت کی۔ ایک طویل عرصہ ان کی خدمت میں رہے اور سفر کیے۔\n\nوہ برصغیر آئے اور اجمیر میں مقیم ہوئے۔ تذکرہ نگار لکھتے ہیں کہ ان کی سادگی، خدمتِ خلق اور اعلیٰ اخلاق دیکھ کر بہت سے لوگ اسلام کی طرف مائل ہوئے۔ وہ غریبوں اور مسافروں کی خدمت کرتے اور لنگر چلاتے تھے۔ ان کا پیغام محبت، امن اور اللہ کی بندگی تھا۔\n\nان کے بارے میں بہت سی روایات مشہور ہیں جو تاریخی طور پر یکساں مضبوط نہیں۔ البتہ اس بات پر اتفاق ہے کہ ان کی کوشش سے سلسلۂ چشتیہ ہندوستان میں پھیلا اور دین کی دعوت میں اخلاق اور خدمت کا کردار نمایاں رہا۔ وہی چراغ آگے چل کر حضرت قطب الدین بختیار کاکیؒ اور حضرت فرید الدین گنج شکرؒ کے ذریعے دور دور تک روشن ہوا۔","lessons":["اچھے اخلاق اور خدمتِ خلق دین کی سب سے مؤثر دعوت ہیں۔","مسافروں اور غریبوں کی خدمت اللہ کی رضا کا ذریعہ ہے۔","دین کا کام اخلاص اور سادگی کے ساتھ ہو تو دلوں میں جگہ بناتا ہے۔"]},{"id":"w-nizamuddin","cat":"auliya","title":"حضرت خواجہ نظام الدین اولیاء رحمہ اللہ","sub":"دہلی کے محبوبِ الٰہی","ref":"فوائد الفواد (امیر حسن سجزی)، سیر الاولیاء","src":"فوائد الفواد (امیر حسن سجزی)، سیر الاولیاء","body":"حضرت نظام الدین اولیاء (م ۷۲۵ ہجری) بدایوں میں پیدا ہوئے۔ بچپن میں والد کا سایہ اٹھ گیا اور ان کی نیک ماں نے سخت غربت میں ان کی تربیت کی۔ وہ فرمایا کرتے کہ ماں کہتی تھیں: \"آج فاقہ ہے، آج ہم اللہ کے مہمان ہیں۔\" وہ دہلی آ کر علم حاصل کرتے رہے اور بعد میں حضرت بابا فرید الدین گنج شکرؒ کے ہاتھ پر بیعت کی۔\n\nدہلی میں ان کی خانقاہ میں ہر وقت لنگر جاری رہتا، چاہے بادشاہ ہو یا فقیر، سب کی ایک ساتھ خاطر ہوتی۔ آپ فرماتے: \"عبادت کی دو قسمیں ہیں: ایک لازم، جس کا فائدہ صرف عبادت کرنے والے کو ہوتا ہے، جیسے نماز اور روزہ۔ دوسری متعدی، جس کا فائدہ دوسروں تک پہنچتا ہے، جیسے خدمتِ خلق، اور اس کا ثواب بہت زیادہ ہے۔\" (فوائد الفواد)\n\nانہوں نے لوگوں کے دلوں میں محبت اور نرمی پیدا کی۔ دربار سے دور رہنے کو ترجیح دی اور بادشاہوں کے عطیات سے بچتے رہے۔ ان کے مریدوں میں امیر خسروؒ جیسے بڑے لوگ بھی تھے۔","lessons":["دوسروں کو فائدہ پہنچانے والی عبادت کا اجر بہت بڑا ہے۔","بدی کا جواب نیکی اور نرمی سے دینا اخلاق کی انتہا ہے۔","غربت اور تنگی میں بھی صبر اور شکر مومن کی شان ہے۔"]},{"id":"w-mujaddid","cat":"auliya","title":"حضرت مجدد الف ثانی شیخ احمد سرہندی رحمہ اللہ","sub":"دین کی تجدید کرنے والے","ref":"مکتوباتِ امام ربانی، تذکرہ مجدد الف ثانی","src":"مکتوباتِ امام ربانی، تذکرہ مجدد الف ثانی","body":"حضرت شیخ احمد سرہندیؒ (م ۱۰۳۴ ہجری) سرہند میں پیدا ہوئے اور بچپن میں ہی قرآن حفظ کیا۔ وہ بہت بڑے عالم، محدث اور صوفی تھے۔ جب وہ زندہ تھے تو مغل بادشاہ اکبر کے دور کے اثرات سے برصغیر میں دین میں بدعات اور گمراہ کن عقائد کا فتنہ پھیل چکا تھا، جسے \"دینِ الٰہی\" کہا گیا، اور عوام اور خواص میں دینی کمزوری بڑھ رہی تھی۔\n\nانہوں نے اپنے مکتوبات (خطوط) کے ذریعے علماء اور امراء کو شریعت اور سنت کی طرف بلایا۔ انہوں نے واضح کیا کہ تصوف شریعت کی پابندی کا ہی نام ہے اور شریعت کے بغیر کوئی طریقت قابلِ قبول نہیں۔ انہیں \"مجدد الف ثانی\" یعنی دوسرے ہزار سال کا مجدد کہا گیا۔ حکمران جہانگیر کے زمانے میں ان پر کچھ سختی کی گئی اور انہیں گوالیار کے قلعے میں قید رکھا گیا، مگر انہوں نے صبر کیا اور وہاں بھی لوگوں کی اصلاح کرتے رہے۔\n\nان کی کوششوں سے امت میں دوبارہ سنت کی طرف رجحان بڑھا اور بدعات کمزور پڑیں۔ ان کا مقام علماء کے ہاں بہت بلند ہے۔","lessons":["دین میں نئی باتیں نکالنے کے بجائے سنت پر مضبوطی سے قائم رہنا ضروری ہے۔","حق کی دعوت کے لیے آزمائشوں پر صبر کرنا چاہیے۔","علم اور عمل جب ملتے ہیں تو دین کی تجدید ہوتی ہے۔"]},{"id":"w-waliullah","cat":"auliya","title":"حضرت شاہ ولی اللہ محدث دہلوی رحمہ اللہ","sub":"علمِ حدیث اور تفسیر کے امام","ref":"حجۃ اللہ البالغہ، ازالۃ الخفاء، تذکرہ علماء","src":"حجۃ اللہ البالغہ، ازالۃ الخفاء، تذکرہ علماء","body":"حضرت شاہ ولی اللہ دہلویؒ (م ۱۱۷۶ ہجری) دہلی میں پیدا ہوئے۔ انہوں نے بہت چھوٹی عمر میں قرآن حفظ کیا اور اپنے والد شاہ عبدالرحیمؒ سے علم حاصل کیا۔ بعد میں مکہ اور مدینہ جا کر بڑے محدثین سے حدیث پڑھی۔ جب وہ ہندوستان لوٹے تو انہوں نے دین کی خدمت کو اپنا مقصد بنایا۔\n\nاس زمانے میں مغلیہ سلطنت کمزور ہو چکی تھی اور مسلمان فرقہ بندی، بدعات اور جہالت میں پڑے تھے۔ شاہ صاحبؒ نے قرآن کا فارسی میں ترجمہ کیا تاکہ عام لوگ اسے سمجھ سکیں۔ اس پر بعض لوگوں نے ان کی مخالفت بھی کی، مگر انہوں نے ثابت قدمی دکھائی۔ انہوں نے \"حجۃ اللہ البالغہ\" جیسی عظیم کتاب لکھی جس میں شریعت کی حکمتیں بیان کیں۔\n\nان کے بیٹوں شاہ عبدالعزیز، شاہ رفیع الدین اور شاہ عبدالقادرؒ نے بھی بڑی خدمات دیں۔ شاہ عبدالقادرؒ نے قرآن کا بامحاورہ اردو ترجمہ \"موضح قرآن\" لکھا۔ شاہ ولی اللہ کے علمی سلسلے سے آگے دارالعلوم دیوبند کے علماء بھی فیض یاب ہوئے۔","lessons":["قرآن کو اپنی زبان میں سمجھنا ہر مسلمان کا حق ہے۔","علم کا فائدہ تب ہے جب وہ لوگوں تک پہنچے۔","اختلاف کی جگہ اتحاد اور سنت پر جمع ہونا بڑا مقصد ہے۔"]},{"id":"w-imdadullah","cat":"auliya","title":"حضرت حاجی امداد اللہ مہاجر مکی رحمہ اللہ","sub":"اکابرِ دیوبند کے شیخ","ref":"امداد المشتاق، سوانح قاسمی، ارواح ثلاثہ","src":"امداد المشتاق، سوانح قاسمی، ارواح ثلاثہ","body":"حضرت حاجی امداد اللہ مہاجر مکیؒ (م ۱۳۱۷ ہجری) تھانہ بھون میں پیدا ہوئے۔ وہ بہت بڑے صوفی اور اللہ والے تھے۔ ان کے ہاتھ پر مولانا محمد قاسم نانوتویؒ، مولانا رشید احمد گنگوہیؒ اور حکیم الامت مولانا اشرف علی تھانویؒ جیسے بڑے علماء نے بیعت کی، اسی لیے انہیں \"شیخ العرب والعجم\" اور اکابرِ دیوبند کا مرشد کہا جاتا ہے۔\n\nوہ ۱۸۵۷ء کی جدوجہدِ آزادی کے موقع پر شاملی کے میدان میں شریک رہے۔ انگریزوں کی سخت گرفت کے بعد انہیں ہجرت کر کے مکہ مکرمہ جانا پڑا، جہاں وہ آخر تک مقیم رہے اور سینکڑوں طالبانِ حق نے ان سے فیض پایا۔ ان کی سب سے نمایاں صفت عاجزی تھی۔ وہ اپنے آپ کو کچھ نہ سمجھتے تھے اور ہر ایک کے ساتھ نرمی سے پیش آتے۔\n\nان کی تعلیم کا خلاصہ یہ تھا کہ سنت کی پیروی کی جائے، فرقوں اور جھگڑوں سے بچا جائے اور ہر مسلمان کا احترام کیا جائے۔ ان کے شاگردوں میں علماء میں باہمی اختلاف ہوتا تو وہ محبت اور نرمی سے ان کے درمیان صلح کرا دیتے۔","lessons":["عاجزی بڑے لوگوں کی سب سے بڑی صفت ہے۔","علماء اور اہلِ اللہ کا آپس میں ادب اور محبت قائم رکھنا ضروری ہے۔","دین کی خاطر وطن چھوڑنا بھی سنتِ ہجرت کی مثال ہے۔"]},{"id":"w-nanotvi","cat":"auliya","title":"حضرت مولانا محمد قاسم نانوتوی رحمہ اللہ","sub":"بانی دارالعلوم دیوبند","ref":"سوانح قاسمی، تاریخ دارالعلوم دیوبند","src":"سوانح قاسمی، تاریخ دارالعلوم دیوبند","body":"حضرت مولانا محمد قاسم نانوتویؒ (م ۱۲۹۷ ہجری) سہارنپور کے قصبے نانوتہ میں پیدا ہوئے۔ انہوں نے دہلی اور دیوبند کے علماء سے علم حاصل کیا اور حاجی امداد اللہؒ سے بیعت کی۔ ۱۸۵۷ء کے بعد جب انگریزوں نے مسلمانوں کے دینی مدارس اور تعلیم کے نظام کو تباہ کر دیا تو وہ فکر مند ہوئے کہ دین کی حفاظت کیسے ہو۔\n\n۱۲۸۳ ہجری (۱۸۶۶ء) میں دیوبند کی چھتہ مسجد میں انار کے ایک درخت کے نیچے ایک استاد (ملا محمود) اور ایک شاگرد (محمود حسن، جو بعد میں شیخ الہند بنے) سے دارالعلوم دیوبند کی بنیاد پڑی۔ یہ بہت سادہ آغاز تھا مگر اللہ نے اس میں ایسی برکت دی کہ وہ دنیا بھر کے مسلمانوں کے لیے علم کا مرکز بن گیا۔ انہوں نے مدرسہ چلانے کے لیے عوام کے چندوں پر اعتماد کا اصول اختیار کیا تاکہ مدرسہ کسی حکومت کے زیرِ اثر نہ رہے۔\n\nوہ بہت گہرے عالم تھے اور علمِ کلام میں اسلامی عقائد کا مضبوط دفاع کیا۔ عیسائی اور ہندو علماء سے مناظرے کیے اور اسلام کی حقانیت ثابت کی۔ ان کی وفات صرف ۴۹ برس کی عمر میں ہوئی، مگر ان کا لگایا ہوا چراغ آج تک روشن ہے۔","lessons":["چھوٹا سا آغاز بھی اخلاص ہو تو بڑے پھل لاتا ہے۔","علمِ دین کی حفاظت امت کی بڑی ضرورت ہے۔","ادارے کی بنیاد اخلاص اور توکل پر ہو تو وہ ہمیشہ قائم رہتا ہے۔"]},{"id":"w-gangohi","cat":"auliya","title":"حضرت مولانا رشید احمد گنگوہی رحمہ اللہ","sub":"فقیہ، محدث اور اللہ والے","ref":"تذکرۃ الرشید، سوانح علماء دیوبند","src":"تذکرۃ الرشید، سوانح علماء دیوبند","body":"حضرت مولانا رشید احمد گنگوہیؒ (م ۱۳۲۳ ہجری) گنگوہ میں پیدا ہوئے۔ وہ مولانا محمد قاسم نانوتویؒ کے ساتھ اکٹھے پڑھے اور حاجی امداد اللہؒ سے بیعت ہوئے۔ علمِ حدیث اور فقہ کے ماہر تھے۔ ان کی درسِ حدیث کی مجلس میں سینکڑوں علماء پروان چڑھے، جن میں شیخ الہند مولانا محمود حسنؒ بھی شامل تھے۔\n\nان کے بارے میں مشہور ہے کہ وہ بہت سادہ مزاج اور شریعت کے سخت پابند تھے۔ لباس، کھانے پینے اور رہن سہن میں بالکل سادگی تھی۔ وہ فتوے میں بہت احتیاط کرتے اور اپنی رائے کے بجائے دلیل پر عمل کرتے۔ دنیا کی کوئی بھی لالچ انہیں حق بات سے نہ روک سکی۔\n\nانہوں نے کئی علمی خدمات انجام دیں، جن میں فتاویٰ رشیدیہ اور حدیث کی کتابوں کی شرحیں شامل ہیں۔ آخری عمر میں ان کی بینائی چلی گئی مگر وہ عبادت اور تدریس میں لگے رہے اور ذکر و تلاوت کی کثرت کرتے۔","lessons":["دین کی بات میں دلیل پر چلنا اور احتیاط کرنا علم کی شان ہے۔","سادگی علماء اور اولیاء کا زیور ہے۔","تکلیف اور کمزوری میں بھی عبادت اور علم کی خدمت جاری رکھنی چاہیے۔"]},{"id":"w-thanwi","cat":"auliya","title":"حضرت مولانا اشرف علی تھانوی رحمہ اللہ","sub":"حکیم الامت اور \"بہشتی زیور\" کے مصنف","ref":"بیان القرآن، بہشتی زیور، اشرف السوانح","src":"بیان القرآن، بہشتی زیور، اشرف السوانح","body":"حضرت مولانا اشرف علی تھانویؒ (م ۱۳۶۲ ہجری) تھانہ بھون میں پیدا ہوئے۔ انہوں نے دارالعلوم دیوبند میں تعلیم پائی اور حاجی امداد اللہ مہاجر مکیؒ سے بیعت ہوئے۔ ان کا شمار برصغیر کے سب سے زیادہ لکھنے والے علماء میں ہوتا ہے۔ انہوں نے سینکڑوں کتابیں لکھیں اور اپنے دور میں \"حکیم الامت\" کے لقب سے مشہور ہوئے، یعنی امت کے طبیب۔\n\nانہوں نے خواتین کی دینی تعلیم کے لیے \"بہشتی زیور\" لکھی، جو نماز، روزہ، طہارت، نکاح، گھر داری اور اخلاق کے مسائل پر مشتمل ہے۔ یہ کتاب آسان اردو میں ہے اور برصغیر کے لاکھوں گھروں میں بچیوں کو جہیز میں دی جاتی رہی۔ انہوں نے قرآن کا آسان اردو ترجمہ اور تفسیر \"بیان القرآن\" بھی لکھی۔\n\nان کی زندگی بہت منظم تھی۔ وقت کی پابندی، لوگوں کے حقوق کا خیال اور معاملات میں صفائی ان کی پہچان تھی۔ وہ اپنے مریدین کو نرمی کے ساتھ ان کی بیماریوں کی اصلاح کرنے کا طریقہ سکھاتے۔ ان کی خانقاہ تھانہ بھون میں سینکڑوں لوگوں کی اصلاح کا مرکز بنی۔","lessons":["خواتین کی دینی تعلیم اور تربیت کی بہت بڑی اہمیت ہے۔","وقت کی پابندی اور حقوق کی ادائیگی دین کا حصہ ہیں۔","دین کی بات آسان زبان میں پہنچانا بڑی خدمت ہے۔"]},{"id":"w-ilyas","cat":"auliya","title":"حضرت مولانا محمد الیاس کاندھلوی رحمہ اللہ","sub":"دعوت و تبلیغ کی تحریک کے بانی","ref":"سوانح مولانا محمد الیاس، ملفوظات","src":"سوانح مولانا محمد الیاس، ملفوظات","body":"حضرت مولانا محمد الیاس کاندھلویؒ (م ۱۳۶۳ ہجری) ایک علمی اور دینی گھرانے میں پیدا ہوئے۔ انہوں نے مولانا رشید احمد گنگوہیؒ اور شیخ الہند مولانا محمود حسنؒ سے فیض پایا اور مولانا خلیل احمد سہارنپوریؒ کے خلیفہ بنے۔ وہ حدیث پڑھانے والے استاد تھے۔\n\nان کے زمانے میں میوات کے علاقے کے مسلمان دین سے بہت دور ہو چکے تھے اور ہندو رسموں میں گم تھے۔ مولانا الیاسؒ کو اس کی بہت فکر تھی۔ انہوں نے سوچا کہ صرف مدرسے کافی نہیں، ہر مسلمان کو خود دین سیکھنے اور سکھانے کے لیے نکلنا ہوگا۔ چنانچہ انہوں نے عام مسلمانوں کو چھوٹی چھوٹی جماعتوں کی صورت میں گاؤں گاؤں جا کر لوگوں کو نماز، کلمہ اور دین کی بنیادی باتیں سکھانے کی تحریک شروع کی۔\n\nان کی دعوت کا خلاصہ یہ تھا کہ دین کا کام ہر مسلمان کی ذمہ داری ہے، صرف علماء کی نہیں۔ یہ تحریک آج \"تبلیغی جماعت\" کے نام سے پوری دنیا میں پھیلی ہوئی ہے۔ مولانا الیاسؒ دن رات امت کے دین سے جڑنے کی فکر میں رہتے۔ ان کی زندگی اخلاص، سادگی اور لوگوں کی ہمدردی کی مثال تھی۔","lessons":["دین سیکھنا اور دوسروں تک پہنچانا ہر مسلمان کی ذمہ داری ہے۔","امت کی فکر دل میں ہو تو چھوٹی کوشش بھی بڑی تحریک بن جاتی ہے۔","دعوت میں نرمی، سادگی اور ہمدردی ضروری ہے۔"]}],"articles":[{"id":"a-maqam","v":2,"title":"اسلام میں عورت کا مقام","cat":"خواتین","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اسلام نے عورت کو وہ عزت اور حقوق دیے جو اس سے پہلے کسی نظام نے نہیں دیے تھے۔ قرآنِ کریم میں مرد اور عورت دونوں کو ایمان اور نیک عمل کی بنیاد پر برابر اجر کا وعدہ دیا گیا ہے۔\n\n﴿ إِنَّ ٱلْمُسْلِمِينَ وَٱلْمُسْلِمَٰتِ وَٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ وَٱلْقَٰنِتِينَ وَٱلْقَٰنِتَٰتِ وَٱلصَّٰدِقِينَ وَٱلصَّٰدِقَٰتِ وَٱلصَّٰبِرِينَ وَٱلصَّٰبِرَٰتِ وَٱلْخَٰشِعِينَ وَٱلْخَٰشِعَٰتِ وَٱلْمُتَصَدِّقِينَ وَٱلْمُتَصَدِّقَٰتِ وَٱلصَّٰٓئِمِينَ وَٱلصَّٰٓئِمَٰتِ وَٱلْحَٰفِظِينَ فُرُوجَهُمْ وَٱلْحَٰفِظَٰتِ وَٱلذَّٰكِرِينَ ٱللَّهَ كَثِيرًا وَٱلذَّٰكِرَٰتِ أَعَدَّ ٱللَّهُ لَهُم مَّغْفِرَةً وَأَجْرًا عَظِيمًا ﴾\n(سورۃ الاحزاب، آیت ۳۵)\n\nاس آیت میں مسلمان مرد و عورت، ایمان والے مرد و عورت، فرمانبردار، سچے، صبر کرنے والے، خشوع کرنے والے، صدقہ دینے والے، روزہ رکھنے والے، شرمگاہ کی حفاظت کرنے والے اور اللہ کو کثرت سے یاد کرنے والے سب کے لیے مغفرت اور بڑے اجر کا وعدہ ہے۔\n\nعورت بیٹی کی صورت میں رحمت، بیوی کی صورت میں سکون اور ماں کی صورت میں سب سے زیادہ حسنِ سلوک کی حق دار ہے۔ نبی ﷺ نے فرمایا: \"علم حاصل کرنا ہر مسلمان پر فرض ہے\" (سنن ابن ماجہ)۔ اس حکم میں مرد اور عورت دونوں شامل ہیں۔ نبی ﷺ نے یہ بھی فرمایا: \"تم میں بہتر وہ ہے جو اپنے گھر والوں کے لیے بہتر ہو\" (جامع ترمذی)۔\n\nتاریخ گواہ ہے کہ ام المومنین حضرت خدیجہؓ نے سب سے پہلے ایمان قبول کیا اور ہر مشکل میں نبی ﷺ کا ساتھ دیا، اور حضرت عائشہؓ نے علمِ حدیث اور فقہ میں امت کی رہنمائی کی۔ آج بھی ہر بہن اپنے گھر، خاندان اور معاشرے میں علم اور کردار کے ذریعے یہی کردار ادا کر سکتی ہے۔\n\nنتیجہ: اسلام عورت کو عزت، حفاظت، علم اور وراثت کا حق دیتا ہے، اور اس کی ذمہ داریوں کے ساتھ اس کے حقوق بھی طے کرتا ہے۔\n\nاعتراض اور جواب: اعتراض: \"اسلام نے مرد کو عورت پر حاکم بنایا ہے۔\" جواب: قرآن میں مرد کو \"قوّام\" یعنی ذمہ دار اور نگران کہا گیا ہے (النساء ۳۴) کیونکہ وہ نان نفقہ اور حفاظت کا ذمہ دار ہے۔ یہ ذمہ داری کی تقسیم ہے، انسانی قدر و منزلت میں کمی نہیں۔ قرآن کہتا ہے کہ اللہ کے نزدیک سب سے زیادہ عزت والا وہ ہے جو سب سے زیادہ پرہیزگار ہے (الحجرات ۱۳)۔ نبی ﷺ نے فرمایا: \"عورتیں مردوں کی ہم مثل (دوسرا حصہ) ہیں\" (سنن ابوداؤد، جامع ترمذی)۔\n\nمزید تفصیل: عورت کے مالی حقوق بھی محفوظ ہیں۔ اسے مہر کا حق ہے، وراثت میں حصہ ہے، اپنی کمائی اور مال کی وہ خود مالک ہے، اور اس پر گھر کا خرچ اٹھانا فرض نہیں، یہ ذمہ داری شوہر یا باپ کی ہے۔ نکاح کے لیے اس کی رضامندی ضروری ہے۔ یہ سب حقوق اسلام نے اس وقت دیے جب دنیا کے بہت سے معاشروں میں عورت کو کوئی حق حاصل نہ تھا۔"},{"id":"a-namaz","v":2,"title":"نماز: دل کے سکون کی کنجی","cat":"عبادات","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نماز اسلام کا دوسرا رکن ہے اور بندے اور رب کے درمیان سب سے مضبوط رشتہ ہے۔\n\n﴿ ٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِنَ ٱلْكِتَٰبِ وَأَقِمِ ٱلصَّلَوٰةَ إِنَّ ٱلصَّلَوٰةَ تَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَلَذِكْرُ ٱللَّهِ أَكْبَرُ وَٱللَّهُ يَعْلَمُ مَا تَصْنَعُونَ ﴾\n(سورۃ العنکبوت، آیت ۴۵)\n\nاس آیت کا مفہوم ہے: \"بے شک نماز بے حیائی اور برائی سے روکتی ہے۔\" اور فرمایا: \"خبردار! اللہ کے ذکر ہی سے دلوں کو اطمینان ملتا ہے\" (الرعد ۲۸)۔\n\nنبی ﷺ نے فرمایا: \"بندے اور شرک و کفر کے درمیان نماز چھوڑ دینا ہے\" (صحیح مسلم)۔ ایک اور حدیث میں ہے کہ قیامت کے دن سب سے پہلے نماز کا حساب لیا جائے گا (جامع ترمذی، سنن نسائی)۔\n\nنماز کو بہتر بنانے کے لیے چند آسان باتیں مدد دیتی ہیں: وقت پر پڑھنے کی کوشش، وضو کو توجہ سے کرنا، اور نماز میں جو کچھ پڑھ رہے ہیں اس کا مطلب جاننا۔ جب بندہ سورۃ الفاتحہ کے معنی سمجھ کر پڑھتا ہے تو ہر رکعت میں اللہ سے دعا اور ہدایت مانگتا ہے۔\n\nشروع میں خشوع مشکل لگ سکتا ہے۔ اس کا آسان طریقہ یہ ہے کہ ایک وقت میں ایک چھوٹی سورت کا ترجمہ یاد کر لیں۔ آہستہ آہستہ نماز عادت سے بڑھ کر لذت بن جاتی ہے۔ نماز کا طریقہ اور مسائل کسی مستند عالمہ یا مفتی سے سیکھیں۔\n\nمزید تفصیل: پانچ نمازیں اور ان کی برکت۔ نبی ﷺ نے فرمایا: \"بتاؤ اگر تم میں سے کسی کے دروازے پر نہر ہو اور وہ اس میں روزانہ پانچ بار نہائے، کیا اس پر کوئی میل باقی رہے گا؟\" صحابہ نے کہا: نہیں۔ فرمایا: \"یہی پانچ نمازوں کی مثال ہے، اللہ ان کے ذریعے گناہ مٹاتا ہے\" (صحیح بخاری و مسلم)۔\n\nپانچ نمازیں یہ ہیں: فجر (دو رکعت فرض)، ظہر (چار)، عصر (چار)، مغرب (تین)، اور عشاء (چار)، ساتھ وتر کی تین رکعات واجب ہیں۔ ہر نماز کا اپنا وقت ہے اور ان کو وقت پر پڑھنا فرض ہے: ﴿ وَعَلَىٰ جُنُوبِكُمْ فَإِذَا ٱطْمَأْنَنتُمْ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ ﴾ (النساء ۱۰۳)۔ نماز کی تفصیلات کے لیے \"نماز کی شرائط، فرائض اور واجبات\" والا مضمون دیکھیں۔"},{"id":"a-haya","v":2,"title":"حیا اور ایمان","cat":"اخلاق","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نبی ﷺ نے فرمایا: \"حیا ایمان کا ایک حصہ ہے\" (صحیح بخاری و مسلم)۔ اور فرمایا: \"حیا خیر ہی لاتی ہے\" (صحیح بخاری و مسلم)۔ حیا صرف لباس کا نام نہیں، یہ نظر، زبان، رویے اور سوچ سب میں ظاہر ہوتی ہے۔\n\nحیا انسان کو ایسی باتوں سے روکتی ہے جو اللہ کو ناپسند ہیں، اور ساتھ ہی اچھے اخلاق کی طرف بلاتی ہے۔ حیا دار انسان نرم بات کرتا ہے، دوسروں کی عزت کا خیال رکھتا ہے اور تنہائی میں بھی اللہ کو حاضر سمجھتا ہے۔\n\nحیا کی ایک مثال حضرت عثمانؓ ہیں، جن کے بارے میں نبی ﷺ نے فرمایا کہ میں اس شخص سے کیسے حیا نہ کروں جس سے فرشتے بھی حیا کرتے ہیں (صحیح مسلم)۔\n\nبچیوں کو حیا سکھانے کا بہترین طریقہ یہ ہے کہ ہم خود اس پر عمل کریں، اور انہیں سمجھائیں کہ حیا کمزوری نہیں بلکہ وقار ہے۔"},{"id":"a-sabr","v":2,"title":"صبر: مومن کی طاقت","cat":"اخلاق","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نبی ﷺ نے فرمایا: \"مومن کا معاملہ عجیب ہے، اس کا ہر معاملہ اس کے لیے خیر ہے۔ اگر اسے خوشی پہنچے اور وہ شکر کرے تو یہ اس کے لیے خیر ہے، اور اگر اسے تکلیف پہنچے اور وہ صبر کرے تو یہ بھی اس کے لیے خیر ہے\" (صحیح مسلم)۔\n\nصبر کا مطلب رونا یا دل کا درد چھپانا نہیں، بلکہ اللہ کے فیصلے پر راضی رہتے ہوئے ثابت قدم رہنا اور اپنی زبان اور عمل کو قابو میں رکھنا ہے۔\n\n﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ ﴾\n(سورۃ البقرہ، آیت ۱۵۳)\n\nمفہوم: اے ایمان والو! صبر اور نماز سے مدد مانگو، بے شک اللہ صبر کرنے والوں کے ساتھ ہے۔\n\nحضرت ایوبؑ اور حضرت یعقوبؑ کے قصے ہمیں سکھاتے ہیں کہ صبر کے ساتھ دعا بھی ضروری ہے۔ شکوہ اللہ سے نہیں، اللہ کے سامنے کیا جاتا ہے۔ نبی ﷺ نے فرمایا کہ صبر وہ ہے جو صدمے کی ابتدا میں ہو (صحیح بخاری و مسلم)۔"},{"id":"a-walidain","v":2,"title":"والدین کا مقام","cat":"گھر اور خاندان","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"قرآن میں اللہ نے اپنی عبادت کے حکم کے ساتھ ہی والدین سے اچھے سلوک کا حکم دیا ہے۔\n\n﴿ وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوٓا۟ إِلَّآ إِيَّاهُ وَبِٱلْوَٰلِدَيْنِ إِحْسَٰنًا إِمَّا يَبْلُغَنَّ عِندَكَ ٱلْكِبَرَ أَحَدُهُمَآ أَوْ كِلَاهُمَا فَلَا تَقُل لَّهُمَآ أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا وَٱخْفِضْ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحْمَةِ وَقُل رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا ﴾\n(سورۃ بنی اسرائیل، آیات ۲۳ تا ۲۴)\n\nمفہوم: تیرے رب نے فیصلہ کر دیا ہے کہ اس کے سوا کسی کی عبادت نہ کرو اور ماں باپ کے ساتھ اچھا سلوک کرو۔ اگر ان میں سے ایک یا دونوں تیرے سامنے بڑھاپے کو پہنچ جائیں تو انہیں \"اف\" تک نہ کہو، نہ انہیں جھڑکو، اور ان سے نرمی اور ادب سے بات کرو۔ ان کے لیے عاجزی کا بازو جھکائے رکھو اور دعا کرو: \"اے میرے رب! ان دونوں پر رحم فرما جیسے انہوں نے بچپن میں مجھے پالا۔\"\n\nایک شخص نے نبی ﷺ سے پوچھا کہ میرے حسنِ سلوک کا سب سے زیادہ حق دار کون ہے؟ آپ ﷺ نے فرمایا: تمہاری ماں۔ اس نے پوچھا: پھر؟ فرمایا: تمہاری ماں۔ پھر پوچھا: پھر؟ فرمایا: تمہاری ماں۔ چوتھی مرتبہ فرمایا: تمہارا باپ (صحیح بخاری و مسلم)۔\n\nوالدین کی خدمت، ان کی دعا لینا اور ان کے لیے دعا کرنا بہت بڑی نیکی ہے۔ والدین کے انتقال کے بعد بھی ان کے لیے دعا، صدقہ اور ان کے دوستوں سے اچھا سلوک ان کا حق ہے۔\n\nمزید تفصیل: والدین کی نافرمانی۔ نبی ﷺ نے فرمایا: \"کیا میں تمہیں سب سے بڑے گناہ نہ بتاؤں؟\" تین بار فرمایا۔ صحابہ نے کہا: ضرور۔ فرمایا: \"اللہ کے ساتھ شرک کرنا اور والدین کی نافرمانی\" (صحیح بخاری و مسلم)۔ والدین اگر خلافِ شرع کام کا حکم دیں تو اس میں ان کی اطاعت نہیں، مگر ان سے پھر بھی نرمی اور ادب سے بات کی جائے (لقمان ۱۵)۔\n\nوالدین بوڑھے ہو جائیں تو ان کی خدمت جنت کا راستہ ہے۔ نبی ﷺ نے فرمایا: \"اس کی ناک خاک آلود ہو جس نے اپنے ماں باپ کو بڑھاپے میں پایا اور جنت میں داخل نہ ہوا\" (صحیح مسلم)۔ والدین کے دوستوں اور رشتہ داروں سے بھی حسنِ سلوک کریں۔"},{"id":"a-quran-seekhna","v":2,"title":"قرآن سیکھنے کی شروعات","cat":"قرآن","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"نبی ﷺ نے فرمایا: \"تم میں سب سے بہتر وہ ہے جو قرآن سیکھے اور سکھائے\" (صحیح بخاری)۔ قرآن سیکھنے کی عمر یا وقت مقرر نہیں، بس شروعات کی ضرورت ہے۔\n\nآسان طریقہ یہ ہے: روزانہ ایک مقررہ وقت رکھیں، چاہے صرف دس منٹ ہو۔ پہلے قرآن کو درست پڑھنا سیکھیں، پھر چھوٹی سورتوں کا ترجمہ یاد کریں، اور آخر میں تفسیر سے ان کا پس منظر سمجھیں۔\n\nنبی ﷺ نے فرمایا: \"جو شخص قرآن کا ایک حرف پڑھے، اسے ایک نیکی ملتی ہے اور ایک نیکی دس کے برابر ہوتی ہے\" (جامع ترمذی)۔ جو شخص اٹک اٹک کر پڑھتا ہے اور اسے مشقت ہوتی ہے، اسے دوہرا اجر ملتا ہے (صحیح بخاری و مسلم)، اس لیے شروع میں مشکل ہو تو ہمت نہ ہاریں۔\n\nہماری ویب سائٹ پر آپ ہر آیت کے ساتھ اردو ترجمہ اور مختصر تفسیر پڑھ سکتی ہیں، اور \"تجوید\" کے سیکشن سے درست پڑھنا بھی سیکھ سکتی ہیں۔ تلاوت کی درستی کے لیے کسی مستند قاریہ یا معلمہ سے ضرور رابطہ رکھیں۔\n\nمزید تفصیل: ایک سال کا آسان منصوبہ۔ پہلے مہینے میں نورانی قاعدہ مکمل کریں، پھر روزانہ آدھا صفحہ ناظرہ پڑھیں۔ ساتھ ساتھ تیسویں پارے کی چھوٹی سورتیں ترجمے کے ساتھ یاد کریں۔ چھ مہینے بعد ہر روز ایک رکوع ترجمے کے ساتھ پڑھیں۔ ہماری ویب سائٹ پر \"قرآن\" اور \"تجوید\" کے سیکشن میں یہ سب ایک جگہ موجود ہیں، اور ہر آیت کی آڈیو بھی سن سکتے ہیں۔\n\nاور یاد رکھیں: قرآن کی تلاوت میں ناغہ نہ کریں۔ نبی ﷺ نے فرمایا: \"اللہ کے نزدیک سب سے پسندیدہ عمل وہ ہے جو ہمیشہ کیا جائے، چاہے تھوڑا ہو\" (صحیح بخاری و مسلم)۔"},{"id":"a-iman","v":2,"title":"ایمان کیا ہے؟ ارکانِ ایمان","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"ایمان وہ بنیاد ہے جس پر پورا دین کھڑا ہے۔ ایک مرتبہ حضرت جبرئیلؑ انسانی شکل میں نبی ﷺ کے پاس آئے اور پوچھا: ایمان کیا ہے؟ آپ ﷺ نے فرمایا: \"یہ کہ تم اللہ پر، اس کے فرشتوں پر، اس کی کتابوں پر، اس کے رسولوں پر اور آخرت کے دن پر ایمان لاؤ، اور اچھی بری تقدیر پر ایمان لاؤ\" (صحیح مسلم)۔\n\n﴿ ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِۦ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ ﴾\n(سورۃ البقرہ، آیت ۲۸۵)\n\nایمان کی چھ باتیں یہ ہیں: (۱) اللہ کی ذات اور صفات پر ایمان کہ وہ ایک ہے۔ (۲) فرشتوں پر ایمان کہ وہ اللہ کے نور سے بنے ہوئے فرماں بردار بندے ہیں۔ (۳) آسمانی کتابوں پر ایمان، اور قرآن ان میں آخری اور محفوظ کتاب ہے۔ (۴) تمام رسولوں پر ایمان، جن کے آخری نبی حضرت محمد ﷺ ہیں۔ (۵) آخرت پر ایمان یعنی موت، قبر، قیامت، حساب، جنت اور جہنم کا یقین۔ (۶) تقدیر پر ایمان کہ ہر اچھائی برائی اللہ کے علم اور فیصلے سے ہے۔\n\nاہلِ سنت والجماعت کا عقیدہ ہے کہ ایمان دل کی تصدیق اور زبان کے اقرار کا نام ہے، اور نیک اعمال ایمان کو بڑھاتے اور گناہ اسے کمزور کرتے ہیں۔ گناہ کرنے سے آدمی کافر نہیں ہو جاتا، مگر اس سے سچی توبہ کرنا ضروری ہے۔\n\nعملی بات: روزانہ ایمان کی تجدید کے لیے کلمۂ طیبہ اور ایمانِ مجمل و مفصل کا ورد کریں، اور بچوں کو بھی یاد کرائیں۔\n\nمزید تفصیل: ایمان کی شاخیں۔ نبی ﷺ نے فرمایا: \"ایمان کی ستر سے کچھ زیادہ شاخیں ہیں، سب سے اعلیٰ لا الہ الا اللہ کہنا ہے اور سب سے ادنیٰ راستے سے تکلیف دہ چیز ہٹانا، اور حیا ایمان کی ایک شاخ ہے\" (صحیح بخاری و مسلم)۔ یعنی ایمان صرف دل میں رہ جانے والی چیز نہیں بلکہ عمل میں بھی ظاہر ہوتا ہے۔\n\nتقدیر کا مطلب: تقدیر پر ایمان کا مطلب یہ نہیں کہ انسان ہاتھ پر ہاتھ رکھ کر بیٹھ جائے۔ انسان کو اختیار دیا گیا ہے کہ وہ اچھا یا برا کام کرے، اور اسی پر حساب ہوگا، البتہ ہر کام اللہ کے علم میں ہے اور اس کی مشیت سے ہوتا ہے۔ جب کوئی مصیبت آئے تو یہ کہنا چاہیے: \"قدر اللہ وما شاء فعل\" (صحیح مسلم)۔"},{"id":"a-tauheed","v":2,"title":"توحید: اللہ کی پہچان","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"اسلام کی سب سے پہلی اور سب سے بڑی بات توحید ہے، یعنی یہ ماننا کہ اللہ ایک ہے، نہ اس کا کوئی شریک ہے، نہ مثل۔\n\n﴿ قُلْ هُوَ ٱللَّهُ أَحَدٌ ٱللَّهُ ٱلصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ ﴾\n(سورۃ الاخلاص)\n\nمفہوم: کہہ دیجیے کہ اللہ ایک ہے۔ اللہ بے نیاز ہے۔ نہ اس کی کوئی اولاد ہے اور نہ وہ کسی کی اولاد ہے، اور نہ کوئی اس کے برابر ہے۔ نبی ﷺ نے فرمایا کہ سورۃ الاخلاص قرآن کے ایک تہائی کے برابر ہے (صحیح بخاری)۔\n\nانسان اور جنوں کی پیدائش کا اصل مقصد اللہ کی عبادت ہے:\n\n﴿ وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ ﴾\n(سورۃ الذاریات، آیت ۵۶)\n\nشرک سب سے بڑا گناہ ہے۔ حضرت لقمانؑ نے اپنے بیٹے کو نصیحت کی: ﴿ إِنَّ ٱلشِّرْكَ لَظُلْمٌ عَظِيمٌ ﴾ (لقمان ۱۳)، بے شک شرک بہت بڑا ظلم ہے۔ حضرت معاذؓ سے نبی ﷺ نے فرمایا: \"بندوں پر اللہ کا حق یہ ہے کہ وہ اس کی عبادت کریں اور اس کے ساتھ کسی کو شریک نہ کریں\" (صحیح بخاری و مسلم)۔\n\nتوحید کا مطلب یہ ہے کہ دعا، مدد، نذر اور عبادت صرف اللہ کے لیے ہو۔ انبیاء اور اولیاء کا ادب دل میں رکھیں، مگر عبادت کا کوئی حصہ ان کے لیے نہ کریں۔ روزانہ سورۃ الاخلاص پڑھنا اور اس کے معنی پر غور کرنا توحید کو دل میں مضبوط کرتا ہے۔\n\nمزید تفصیل: اللہ کے نام اور صفات۔ قرآن میں فرمایا: ﴿ وَلِلَّهِ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ فَٱدْعُوهُ بِهَا وَذَرُوا۟ ٱلَّذِينَ ﴾ (الاعراف ۱۸۰)، یعنی اللہ کے بہترین نام ہیں، ان کے ذریعے اسے پکارو۔ نبی ﷺ نے فرمایا کہ اللہ کے ننانوے نام ہیں، جو انہیں یاد کرے اور ان کے معانی کا لحاظ رکھے وہ جنت میں داخل ہوگا (صحیح بخاری و مسلم)۔\n\nاللہ کی صفات کے بارے میں اہلِ سنت کا اصول یہ ہے کہ جو صفات قرآن و حدیث میں آئی ہیں انہیں مانا جائے، مخلوق سے تشبیہ نہ دی جائے اور کیفیت کی کھوج نہ کی جائے۔ قرآن میں ہے: ﴿ فَاطِرُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ جَعَلَ لَكُم مِّنْ ﴾ (الشوریٰ ۱۱)، یعنی اس جیسی کوئی چیز نہیں۔"},{"id":"a-khatm-e-nabuwwat","v":2,"title":"رسالتِ محمدیہ ﷺ اور ختمِ نبوت","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"ہمارے نبی حضرت محمد ﷺ اللہ کے آخری نبی اور رسول ہیں۔ آپ ﷺ کے بعد قیامت تک کوئی نیا نبی نہیں آئے گا۔ یہ قرآن و سنت اور پوری امت کا متفقہ عقیدہ ہے۔\n\n﴿ مَّا كَانَ مُحَمَّدٌ أَبَآ أَحَدٍ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ ٱللَّهِ وَخَاتَمَ ٱلنَّبِيِّـۧنَ وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمًا ﴾\n(سورۃ الاحزاب، آیت ۴۰)\n\nنبی ﷺ نے فرمایا: \"میں خاتم النبیین ہوں، میرے بعد کوئی نبی نہیں\" (سنن ابوداؤد، جامع ترمذی)۔ حضرت علیؓ سے فرمایا: \"تم میرے لیے ایسے ہو جیسے موسیٰؑ کے لیے ہارونؑ تھے، مگر میرے بعد کوئی نبی نہیں\" (صحیح بخاری و مسلم)۔\n\nآپ ﷺ کی رسالت پوری انسانیت کے لیے ہے:\n\n﴿ قُلْ يَٰٓأَيُّهَا ٱلنَّاسُ إِنِّى رَسُولُ ٱللَّهِ إِلَيْكُمْ جَمِيعًا ٱلَّذِى لَهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ لَآ إِلَٰهَ إِلَّا هُوَ يُحْىِۦ وَيُمِيتُ فَـَٔامِنُوا۟ بِٱللَّهِ وَرَسُولِهِ ٱلنَّبِىِّ ٱلْأُمِّىِّ ٱلَّذِى يُؤْمِنُ بِٱللَّهِ وَكَلِمَٰتِهِۦ وَٱتَّبِعُوهُ لَعَلَّكُمْ تَهْتَدُونَ ﴾\n(سورۃ الاعراف، آیت ۱۵۸)\n\nاسی لیے علمائے امت کا اجماع ہے کہ جو شخص آپ ﷺ کے بعد کسی کو نبی مانے یا خود نبوت کا دعویٰ کرے وہ دائرۂ اسلام سے خارج ہے۔ علمائے دیوبند نے اس عقیدے کی حفاظت کو ہمیشہ اپنی بڑی ذمہ داری سمجھا ہے۔\n\nنبی ﷺ سے محبت ایمان کی شرط ہے۔ آپ ﷺ نے فرمایا: \"تم میں سے کوئی اس وقت تک مومن نہیں ہو سکتا جب تک میں اسے اس کے والد، اس کی اولاد اور سب لوگوں سے زیادہ محبوب نہ ہو جاؤں\" (صحیح بخاری)۔ اس محبت کا اظہار درود شریف کی کثرت اور آپ ﷺ کی سنتوں پر عمل سے ہوتا ہے۔"},{"id":"a-sahaba-maqam","v":2,"title":"صحابہ کرامؓ کا مقام","cat":"عقائد","author":"حق الیقین انسٹیٹیوٹ","date":"","body":"صحابی وہ شخص ہے جس نے ایمان کی حالت میں نبی ﷺ کی زیارت کی اور ایمان ہی پر دنیا سے گیا۔ صحابہ کرامؓ امت کے سب سے بہتر لوگ ہیں، کیونکہ انہوں نے دین نبی ﷺ سے براہِ راست سیکھا اور ہم تک پہنچایا۔\n\n﴿ وَٱلسَّٰبِقُونَ ٱلْأَوَّلُونَ مِنَ ٱلْمُهَٰجِرِينَ وَٱلْأَنصَارِ وَٱلَّذِينَ ٱتَّبَعُوهُم بِإِحْسَٰنٍ رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ وَأَعَدَّ لَهُمْ جَنَّٰتٍ تَجْرِى تَحْتَهَا ٱلْأَنْهَ
